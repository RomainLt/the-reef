      m.position.set(x, floorHeight(x, z), z);
      m.userData.h = h;
      m.userData.out = 1;
      g.add(m);
      eels.push(m);
    }
    g.userData.eels = eels;
    return g;
  }

  /** Bénitier : deux valves qui s'ouvrent et se ferment. */
  function buildClam(scale) {
    var g = new THREE.Group();
    function valve(sign) {
      var v = new THREE.SphereGeometry(0.5, 14, 9, 0, TAU, 0, Math.PI * 0.5);
      var p = v.attributes.position, w = new THREE.Vector3();
      for (var i = 0; i < p.count; i++) {
        w.fromBufferAttribute(p, i);
        var a = Math.atan2(w.z, w.x);
        p.setXYZ(i, w.x * (1 + Math.cos(a * 7) * 0.07), w.y * 0.55, w.z * (1 + Math.cos(a * 7) * 0.07));
      }
      v.computeVertexNormals();
      occByHeight(v, 0, 0.3, 0.5);
      var m = toonMesh(v, {
        color: 0xdad3c2, colorB: 0x9f9784,
        baseHook: '  base = mix(base, uColorB, step(0.5, fract(length(vObj.xz)*9.0))*0.4);',
        spec: 0.35, rim: 0.3, bump: 0.4
      });
      m.rotation.z = sign * 0.1;
      return m;
    }
    var top = valve(1), bot = valve(-1);
    bot.rotation.x = Math.PI;
    bot.position.y = 0.02;
    top.position.y = 0.04;
    g.add(top); g.add(bot);
    var mantle = toonMesh(new THREE.SphereGeometry(0.44, 14, 8, 0, TAU, 0, Math.PI * 0.5), {
      color: 0x4fc0d8, colorB: 0x8f5ad8,
      baseHook: '  base = mix(base, uColorB, fbm(vObj.xz*8.0));\n  emis += 0.10;',
      spec: 0.5, rim: 0.6, sss: 0.4
    });
    mantle.scale.set(1, 0.25, 1);
    mantle.position.y = 0.03;
    g.add(mantle);
    g.userData.top = top;
    g.userData.mantle = mantle;
    g.scale.setScalar(scale || 1);
    return g;
  }

  /** Étoile de mer bavarde (avec des yeux). */
  function buildStarfishNPC(scale) {
    var g = new THREE.Group();
    var st = toonMesh(starfishGeo(), {
      color: 0xe8608f, colorB: 0xffc0d8,
      baseHook: '  base = mix(base, uColorB, smoothstep(0.0, 0.14, vObj.y)*0.7);\n  base = mix(base, base*0.8, step(0.55, fbm(vObj.xz*7.0))*0.6);',
      spec: 0.3, rim: 0.35, bump: 0.4
    });
    g.add(st);
    addEyes(g, 0.10, 0.16, 0.30, 0.062, { iris: 0xffd8e8, pupil: 0x0a1018 });
    g.userData.body = st;
    g.scale.setScalar(scale || 1);
    return g;
  }

  /** Silhouette de baleine, très loin dans le bleu. */
  function buildWhale() {
    var g = new THREE.Group();
    var b = fishBodyGeo(0.55, 0.62, { belly: 0.25, head: 0.35, seg: 18, seg2: 12 });
    var parts = [{ geo: b }];
    var tail = finGeo([[0, 0.06], [0.5, 0.5], [0.9, 0.34], [0.55, 0.02],
                       [0.9, -0.34], [0.5, -0.5], [0, -0.06]], 0.06);
    tail.rotateY(Math.PI / 2); tail.rotateZ(Math.PI / 2);   // fluke horizontal : voulu
    parts.push({ geo: tail, matrix: TRS(0, 0, -1.05) });
    var pec = finGeo([[0, 0], [0.7, -0.1], [1.0, -0.3], [0.6, -0.22]], 0.05);
    parts.push({ geo: pec, matrix: TRS(0.3, -0.2, 0.2, 0.3, 0, 0) });
    var pec2 = pec.clone(); pec2.scale(-1, 1, 1);
    parts.push({ geo: pec2, matrix: TRS(-0.3, -0.2, 0.2, 0.3, 0, 0) });
    var m = toonMesh(mergeGeos(parts), {
      color: 0x2f4a63, colorB: 0x9fb4c4,
      baseHook: '  base = mix(base, uColorB, smoothstep(-0.1, -0.5, vObj.y)*0.8);',
      mode: 1, fishLen: 1.0, taper: 1.4, swayAmp: 0.07, swayFreq: 1.6, swaySpeed: 0.7,
      rim: 0.5, spec: 0.15
    });
    g.add(m);
    g.scale.setScalar(26);
    g.userData.body = m;
    return g;
  }

  /** Perle de nacre à collecter. */
  function buildPearl() {
    var g = new THREE.Group();
    var core = toonMesh(new THREE.SphereGeometry(0.42, 16, 12), {
      color: 0xfff8ee, colorB: 0x9fe2ff,
      baseHook: '  base = mix(base, uColorB, smoothstep(0.15, -0.4, vObj.y));\n  emis += 0.5*pow(max(vObj.y*2.0, 0.0), 2.0);',
      rim: 1.0, spec: 2.0, emissive: 1.05, soft: 0.20, outline: 2.2
    });
    g.add(core);
    var halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX.soft, color: 0x9fe9ff, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.95
    }));
    halo.scale.setScalar(3.2);
    g.add(halo);
    var sparks = [];
    for (var i = 0; i < 3; i++) {
      var sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: TEX.soft, color: 0xffffff, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9
      }));
      sp.scale.setScalar(0.42);
      g.add(sp); sparks.push(sp);
    }
    g.userData.core = core;
    g.userData.halo = halo;
    g.userData.sparks = sparks;
    return g;
  }

  /* ================================================================== */
  /* SCÈNE, RENDU, POST-TRAITEMENT                                      */
  /* ================================================================== */
  var TEX = {};
  var renderer, scene, camera, W = 1, H = 1, pixelScale = 1;
  var rtScene, rtBrightA, rtBrightB, fsScene, fsCam, fsQuad;
  var matBright, matBlur, matComp;
  var QUALITY = 2;                         // 2 = élevée, 1 = moyenne, 0 = basse
  var flashCollect = 0, flashSting = 0;

  function initRenderer() {
    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
    renderer.setClearColor(0x0b4a72, 1);
    renderer.autoClear = true;
    $('#stage').appendChild(renderer.domElement);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(62, 1, 0.3, 800);
    camera.position.set(0, 8, 16);

    TEX.soft = softSpriteTex();
    TEX.bubble = bubbleSpriteTex();

    // ---- cibles de rendu
    var half = renderer.capabilities.isWebGL2 ? THREE.HalfFloatType : THREE.UnsignedByteType;
    // pas de MSAA : on a besoin d'une texture de profondeur (FXAA en compensation)
    rtScene = new THREE.WebGLRenderTarget(2, 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, type: half
    });
    rtScene.depthTexture = new THREE.DepthTexture(2, 2);
    rtScene.depthTexture.format = THREE.DepthFormat;
    rtScene.depthTexture.type = renderer.capabilities.isWebGL2 ? THREE.UnsignedIntType : THREE.UnsignedShortType;
    rtBrightA = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, type: half });
    rtBrightB = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, type: half });

    fsScene = new THREE.Scene();
    fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    var FS_VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';

    matBright = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uThresh: { value: 0.82 } },
      vertexShader: FS_VERT,
      fragmentShader: [
        'uniform sampler2D tDiffuse; uniform float uThresh; varying vec2 vUv;',
        'void main(){',
        '  vec3 c = texture2D(tDiffuse, vUv).rgb;',
        '  float l = max(max(c.r,c.g),c.b);',
        '  float k = max(l - uThresh, 0.0)/max(l, 0.0001);',
        '  gl_FragColor = vec4(c*k*1.25, 1.0);',
        '}'
      ].join('\n')
    });

    matBlur = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2(1, 0) } },
      vertexShader: FS_VERT,
      fragmentShader: [
        'uniform sampler2D tDiffuse; uniform vec2 uDir; varying vec2 vUv;',
        'void main(){',
        '  vec3 s = texture2D(tDiffuse, vUv).rgb * 0.2270270270;',
        '  s += (texture2D(tDiffuse, vUv + uDir*1.3846153846).rgb + texture2D(tDiffuse, vUv - uDir*1.3846153846).rgb) * 0.3162162162;',
        '  s += (texture2D(tDiffuse, vUv + uDir*3.2307692308).rgb + texture2D(tDiffuse, vUv - uDir*3.2307692308).rgb) * 0.0702702703;',
        '  gl_FragColor = vec4(s, 1.0);',
        '}'
      ].join('\n')
    });

    // Étalonnage "film d'animation" + profondeur de champ + rayons vers le soleil
    matComp = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: null }, tBloom: { value: null }, tDepth: { value: null },
        uBloom: { value: 0.62 }, uExposure: { value: 1.20 }, uTime: { value: 0 },
        uFlashA: { value: 0 }, uFlashB: { value: 0 }, uAspect: { value: 1 },
        uTexel: { value: new THREE.Vector2(1 / 1280, 1 / 800) },
        uSunScreen: { value: new THREE.Vector2(0.5, 1.2) }, uSunVis: { value: 0 },
        uNear: { value: 0.3 }, uFar: { value: 800 }, uDof: { value: 1 }, uMenace: { value: 0 }
      },
      vertexShader: FS_VERT,
      fragmentShader: [
        'uniform sampler2D tDiffuse; uniform sampler2D tBloom; uniform sampler2D tDepth;',
        'uniform float uBloom, uExposure, uTime, uFlashA, uFlashB, uAspect;',
        'uniform float uSunVis, uNear, uFar, uDof, uMenace;',
        'uniform vec2 uTexel, uSunScreen;',
        'varying vec2 vUv;',
        'vec3 filmic(vec3 x){',                        // courbe type ACES simplifiée
        '  x = max(x, 0.0);',
        '  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);',
        '}',
        'float linDepth(vec2 uv){',
        '  float z = texture2D(tDepth, uv).x;',
        '  float ndc = z*2.0 - 1.0;',
        '  return (2.0*uNear*uFar)/(uFar + uNear - ndc*(uFar - uNear));',
        '}',
        // anticrénelage léger : moyenne des diagonales pondérée par le contraste local
        'vec3 aaSample(vec2 uv){',
        '  vec3 c0 = texture2D(tDiffuse, uv).rgb;',
        '  vec3 a = texture2D(tDiffuse, uv + vec2( 0.6, 0.6)*uTexel).rgb;',
        '  vec3 b = texture2D(tDiffuse, uv + vec2(-0.6, 0.6)*uTexel).rgb;',
        '  vec3 c = texture2D(tDiffuse, uv + vec2( 0.6,-0.6)*uTexel).rgb;',
        '  vec3 d = texture2D(tDiffuse, uv + vec2(-0.6,-0.6)*uTexel).rgb;',
        '  vec3 av = (a+b+c+d)*0.25;',
        '  return mix(c0, av, clamp(length(av-c0)*3.0, 0.0, 0.62));',
        '}',
        // profondeur de champ : petit disque de 7 taps dont le rayon suit le flou
        'vec3 dofSample(vec2 uv, float coc){',
        '  vec2 r = uTexel * (1.0 + coc*6.0);',
        '  vec3 s = texture2D(tDiffuse, uv).rgb * 0.24;',
        '  s += texture2D(tDiffuse, uv + vec2( 1.00, 0.00)*r).rgb * 0.127;',
        '  s += texture2D(tDiffuse, uv + vec2(-1.00, 0.00)*r).rgb * 0.127;',
        '  s += texture2D(tDiffuse, uv + vec2( 0.50, 0.87)*r).rgb * 0.127;',
        '  s += texture2D(tDiffuse, uv + vec2(-0.50, 0.87)*r).rgb * 0.127;',
        '  s += texture2D(tDiffuse, uv + vec2( 0.50,-0.87)*r).rgb * 0.127;',
        '  s += texture2D(tDiffuse, uv + vec2(-0.50,-0.87)*r).rgb * 0.127;',
        '  return s;',
        '}',
        'void main(){',
        '  vec2 uv = vUv;',
        '  vec2 c = uv - 0.5;',
        '  float r2 = dot(c,c);',
        // léger flottement liquide
        '  uv += vec2(sin(uv.y*11.0 + uTime*0.55), cos(uv.x*9.0 - uTime*0.42)) * 0.0013;',
        '  float dpt = linDepth(uv);',
        '  float coc = smoothstep(26.0, 135.0, dpt) * uDof;',
        '  vec3 col = coc > 0.02 ? dofSample(uv, coc) : aaSample(uv);',
        // aberration chromatique douce sur les bords
        '  float ca = 0.0016 * r2 * 3.0;',
        '  col.r = mix(col.r, texture2D(tDiffuse, uv + c*ca).r, 0.85);',
        '  col.b = mix(col.b, texture2D(tDiffuse, uv - c*ca).b, 0.85);',
        '  col += texture2D(tBloom, uv).rgb * uBloom;',
        // rayons de soleil : flou radial de la passe des hautes lumières
        '  if(uSunVis > 0.001){',
        '    vec2 dir = (uSunScreen - uv) * 0.30;',
        '    vec3 sh = vec3(0.0);',
        '    for(int i = 0; i < 8; i++){',
        '      sh += texture2D(tBloom, uv + dir*(float(i)*0.125)).rgb;',
        '    }',
        '    col += sh * 0.125 * uSunVis * 0.85;',
        '  }',
        '  col *= uExposure;',
        '  col = filmic(col);',
        // étalonnage
        '  float l = dot(col, vec3(0.299,0.587,0.114));',
        '  col = mix(vec3(l), col, 1.22);',
        '  col *= mix(vec3(0.90,1.02,1.06), vec3(1.05,1.0,0.95), smoothstep(0.15,0.85,l));',
        '  col = pow(col, vec3(0.95));',
        '  col += vec3(0.9,1.0,0.7) * uFlashA * (1.0 - r2*1.4);',
        '  col = mix(col, vec3(0.75,0.35,0.95), uFlashB*0.5*smoothstep(0.02,0.30,r2));',
        '  col *= 1.0 - smoothstep(0.14, 0.78, r2)*0.42;',
        '  col = mix(col, col*vec3(1.0,0.42,0.34), uMenace*smoothstep(0.02,0.34,r2)*0.85);',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n')
    });

    fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), matComp);
    fsQuad.frustumCulled = false;
    fsScene.add(fsQuad);

    initShadows();
    window.addEventListener('resize', onResize);
    onResize();
  }

  function applyQuality() {
    var showInk = QUALITY > 0;
    scene.traverse(function (o) {
      if (o.userData && o.userData.isOutline) o.visible = showInk;
    });
  }
  /* ------------------------------------------------------------------ */
  /* OMBRES PORTÉES DU SOLEIL                                           */
  /* Passe de profondeur orthographique qui suit le joueur ; seuls les   */
  /* objets marqués (calque 1) y participent.                           */
  /* ------------------------------------------------------------------ */
  var SHADOW = { size: 2048, cam: null, rt: null, depthMat: null, half: 74, ready: false };

  function initShadows() {
    SHADOW.size = QUALITY === 2 ? 2048 : (QUALITY === 1 ? 1024 : 0);
    if (SHADOW.rt) { SHADOW.rt.dispose(); SHADOW.rt = null; }
    if (!SHADOW.size) { U.uShadowOn.value = 0; SHADOW.ready = false; return; }
    var d = SHADOW.half;
    SHADOW.cam = new THREE.OrthographicCamera(-d, d, d, -d, 1, 400);
    SHADOW.cam.layers.set(1);
    SHADOW.rt = new THREE.WebGLRenderTarget(SHADOW.size, SHADOW.size, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      type: renderer.capabilities.isWebGL2 ? THREE.HalfFloatType : THREE.UnsignedByteType,
      depthBuffer: true, stencilBuffer: false
    });
    SHADOW.depthMat = new THREE.ShaderMaterial({
      vertexShader: [
        'varying float vD;',
        'void main(){',
        '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        '  gl_Position = projectionMatrix * mv;',
        '  vD = gl_Position.z;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'varying float vD;',
        'void main(){ float d = vD*0.5 + 0.5; gl_FragColor = vec4(d, d, d, 1.0); }'
      ].join('\n'),
      side: THREE.FrontSide
    });
    U.tShadow.value = SHADOW.rt.texture;
    U.uShadowTexel.value = 1 / SHADOW.size;
    U.uShadowOn.value = 1;
    SHADOW.ready = true;
  }

  /** Marque un objet (et ses enfants) comme projetant une ombre. */
  function castShadow(obj) {
    obj.layers.enable(1);
    for (var i = 0; i < obj.children.length; i++) castShadow(obj.children[i]);
    return obj;
  }

  var _shadowBias = new THREE.Matrix4().set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
  function renderShadowMap() {
    if (!SHADOW.ready) return;
    var c = SHADOW.cam, sun = U.uSunDir.value;
    // centre devant le joueur, aligné sur la grille de texels (anti-scintillement)
    camForward(tmpA);
    var cx = player.pos.x + tmpA.x * 26, cz = player.pos.z + tmpA.z * 26;
    var texel = (SHADOW.half * 2) / SHADOW.size;
    cx = Math.round(cx / texel) * texel;
    cz = Math.round(cz / texel) * texel;
    c.position.set(cx + sun.x * 160, sun.y * 160, cz + sun.z * 160);
    c.up.set(0, 1, 0);
    c.lookAt(cx, 0, cz);
    c.updateMatrixWorld(true);
    U.uShadowMat.value.copy(_shadowBias)
      .multiply(c.projectionMatrix)
      .multiply(c.matrixWorldInverse);

    scene.overrideMaterial = SHADOW.depthMat;
    renderer.setRenderTarget(SHADOW.rt);
    renderer.setClearColor(0xffffff, 1);
    renderer.clear();
    renderer.render(scene, c);
    scene.overrideMaterial = null;
  }

  function qualityScale() { return QUALITY === 2 ? Math.min(window.devicePixelRatio || 1, 2) : (QUALITY === 1 ? 1 : 0.72); }

  function onResize() {
    W = window.innerWidth; H = window.innerHeight;
    var pr = qualityScale();
    pixelScale = pr;
    renderer.setPixelRatio(pr);
    renderer.setSize(W, H, true);
    var w = Math.max(2, Math.floor(W * pr)), h = Math.max(2, Math.floor(H * pr));
    rtScene.setSize(w, h);
    rtBrightA.setSize(Math.max(2, w >> 2), Math.max(2, h >> 2));
    rtBrightB.setSize(Math.max(2, w >> 2), Math.max(2, h >> 2));
    camera.aspect = W / H;
    camera.fov = W / H < 0.85 ? 74 : 62;
    camera.updateProjectionMatrix();
    matComp.uniforms.uAspect.value = W / H;
    matComp.uniforms.uTexel.value.set(1 / w, 1 / h);
    matComp.uniforms.uNear.value = camera.near;
    matComp.uniforms.uFar.value = camera.far;
    matComp.uniforms.uDof.value = QUALITY > 0 ? 1 : 0;
  }

  var _clear = new THREE.Color();
  function waterTintJS(y) {
    var t = smoothstep(-24, CFG.WATER_Y * 0.85, y);
    _clear.copy(t < 0.55 ? U.uDeepCol.value : U.uMidCol.value)
      .lerp(t < 0.55 ? U.uMidCol.value : U.uSkyCol.value, t < 0.55 ? t / 0.55 : (t - 0.55) / 0.45);
    return _clear.lerp(U.uDeepCol.value, 0.38);
  }
  function renderFrame(dt) {
    renderShadowMap();
    renderer.setClearColor(waterTintJS(camera.position.y), 1);
    matComp.uniforms.uTime.value = U.uTime.value;
    matComp.uniforms.uFlashA.value = flashCollect;
    matComp.uniforms.uFlashB.value = flashSting;
    matComp.uniforms.uMenace.value = world.menace;

    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene, camera);

    if (QUALITY > 0) {
      var bw = rtBrightA.width, bh = rtBrightA.height;
      fsQuad.material = matBright;
      matBright.uniforms.tDiffuse.value = rtScene.texture;
      renderer.setRenderTarget(rtBrightA);
      renderer.render(fsScene, fsCam);

      fsQuad.material = matBlur;
      matBlur.uniforms.tDiffuse.value = rtBrightA.texture;
      matBlur.uniforms.uDir.value.set(1 / bw, 0);
      renderer.setRenderTarget(rtBrightB);
      renderer.render(fsScene, fsCam);

      matBlur.uniforms.tDiffuse.value = rtBrightB.texture;
      matBlur.uniforms.uDir.value.set(0, 1 / bh);
      renderer.setRenderTarget(rtBrightA);
      renderer.render(fsScene, fsCam);
    }

    // position du soleil à l'écran, pour les rayons
    _v3.copy(camera.position).addScaledVector(U.uSunDir.value, 300).project(camera);
    matComp.uniforms.uSunScreen.value.set(_v3.x * 0.5 + 0.5, _v3.y * 0.5 + 0.5);
    camera.getWorldDirection(tmpA);
    matComp.uniforms.uSunVis.value = Math.pow(Math.max(0, tmpA.dot(U.uSunDir.value)), 2.2) * (QUALITY > 0 ? 1 : 0);

    fsQuad.material = matComp;
    matComp.uniforms.tDiffuse.value = rtScene.texture;
    matComp.uniforms.tDepth.value = rtScene.depthTexture;
    matComp.uniforms.tBloom.value = rtBrightA.texture;
    matComp.uniforms.uBloom.value = QUALITY > 0 ? 0.62 : 0.0;
    renderer.setRenderTarget(null);
    renderer.render(fsScene, fsCam);
  }

  /* ================================================================== */
  /* CONSTRUCTION DU MONDE                                              */
  /* ================================================================== */
  var world = {
    colliders: [],        // {x,y,z,r} sphères, {x,y,z,r,h} disques (étagères)
    pearls: [],
    critters: [],         // toute la faune animée
    npcs: {},             // PNJ indexés par identifiant
    refuges: [],          // anémones où l'on est à l'abri
    massifs: [],
    menace: 0,            // 0..1 : un prédateur est proche
    places: {},           // lieux remarquables
    vents: [],            // bouches à bulles
    pickups: [],          // objets à ramasser
    jellies: [],
    schools: [],
    turtle: null,
    shadows: [],
    home: new THREE.Vector3(0, 0, 0)
  };

  function tint(hex, k) {                       // éclaircit/assombrit une couleur
    var c = new THREE.Color(hex);
    c.r = clamp(c.r * k, 0, 1); c.g = clamp(c.g * k, 0, 1); c.b = clamp(c.b * k, 0, 1);
    return c.getHex();
  }

  /* ---------- le fond sableux ---------- */
  function buildFloor() {
    var g = new THREE.PlaneGeometry(340, 340, 150, 150);
    g.rotateX(-Math.PI / 2);                    // espace objet = espace monde
    var p = g.attributes.position;
    for (var i = 0; i < p.count; i++) {
      p.setY(i, floorHeight(p.getX(i), p.getZ(i)));
    }
    g.computeVertexNormals();
    var hook = [
      '  float n = fbm(vObj.xz*0.075);',
      '  base = mix(uColor, uColorB, smoothstep(0.34, 0.70, n));',
      '  float rip = sin(vObj.x*1.05 + fbm(vObj.xz*0.12)*8.0)*0.5 + 0.5;',
      '  base *= 0.93 + 0.11*rip;',
      '  float grav = smoothstep(0.58, 0.86, fbm(vObj.xz*0.42));',
      '  base = mix(base, vec3(0.46,0.44,0.40), grav*0.40);',
      '  base *= 0.88 + 0.14*smoothstep(-4.0, 3.0, vObj.y);',
      '  base = mix(base, base*vec3(0.72,0.86,1.0), smoothstep(0.55, 0.85, fbm(vObj.xz*0.18))*0.5);'
    ].join('\n');
    var m = toonMesh(g, {
      color: PAL.sand, colorB: PAL.sandDark, baseHook: hook, caust: 1.05, bump: 0.30,
      rim: 0.10, spec: 0.0, soft: 0.10, outline: false, frustumCulled: false
    });
    scene.add(m);
    return m;
  }

  /* ---------- le fond d'eau : dégradé profond -> turquoise ---------- */
  function buildWaterDome() {
    var g = new THREE.SphereGeometry(420, 24, 16);
    var mat = new THREE.ShaderMaterial({
      uniforms: sharedU(),
      vertexShader: [
        'varying vec3 vWP;',
        'void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vWP = wp.xyz;',
        '  gl_Position = projectionMatrix*viewMatrix*wp; }'
      ].join('\n'),
      fragmentShader: GLSL_LIB + '\n' + [
        'varying vec3 vWP;',
        'void main(){',
        '  vec3 dir = normalize(vWP - cameraPosition);',
        '  float h = dir.y;',
        '  vec3 col = mix(uDeepCol*0.82, uMidCol, smoothstep(-0.75, 0.02, h));',
        '  col = mix(col, uSkyCol, smoothstep(0.0, 0.55, h));',
        '  float depth = smoothstep(uWaterY*0.8, -10.0, cameraPosition.y);',
        '  col = mix(col, uDeepCol, depth*0.35);',
        '  col += uSunCol * pow(max(dot(dir, uSunDir), 0.0), 5.0) * 0.16;',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n'),
      side: THREE.BackSide, depthWrite: false, depthTest: false
    });
    var m = new THREE.Mesh(g, mat);
    m.frustumCulled = false;
    m.renderOrder = -10;
    scene.add(m);
    return m;
  }

  /* ---------- la surface, vue d'en dessous ---------- */
  function buildSurface() {
    var g = new THREE.PlaneGeometry(700, 700, 1, 1);
    g.rotateX(Math.PI / 2);                     // normale vers le bas
    var u = sharedU();
    var mat = new THREE.ShaderMaterial({
      uniforms: u,
      vertexShader: [
        'varying vec3 vWP;',
        'void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vWP = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp; }'
      ].join('\n'),
      fragmentShader: GLSL_LIB + '\n' + [
        'varying vec3 vWP;',
        'void main(){',
        '  vec3 V = normalize(vWP - cameraPosition);',
        '  float dist = length(vWP - cameraPosition);',
        '  vec2 p = vWP.xz*0.17;',
        '  float v1 = causticPat(p, uTime*0.8);',
        '  float v2 = causticPat(p*1.9 + 3.0, uTime*1.15);',
        '  float band = pow(1.0 - min(abs(v1)*1.15, 1.0), 6.0);',
        '  float rip2 = pow(1.0 - min(abs(v2)*1.5, 1.0), 9.0);',
        '  vec3 sky = mix(vec3(0.30,0.60,0.70), vec3(1.35,1.42,1.40), clamp(band*1.05 + rip2*0.85, 0.0, 1.0));',
        '  float fres = pow(1.0 - clamp(abs(V.y), 0.0, 1.0), 4.0);',
        '  vec3 mirror = waterTint(uWaterY*0.5) * (1.05 + band*0.9);',
        '  vec3 col = mix(sky, mirror, fres);',
        '  float sun = max(dot(V, uSunDir), 0.0);',
        '  col += uSunCol * pow(sun, 90.0) * 7.0;',
        '  col += uSunCol * pow(sun, 9.0) * 0.85;',
        '  col = applyWater(col, vWP, dist);',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n'),
      side: THREE.DoubleSide, depthWrite: true
    });
    var m = new THREE.Mesh(g, mat);
    m.position.y = CFG.WATER_Y;
    m.frustumCulled = false;
    scene.add(m);
    return m;
  }

  /* ---------- rayons de lumière ---------- */
  function buildGodRays() {
    var group = new THREE.Group();
    var u = sharedU();
    u.uRayFade = { value: 1 };
    var mat = new THREE.ShaderMaterial({
      uniforms: u,
      vertexShader: [
        'varying vec2 vUv; varying vec3 vWP;',
        'void main(){ vUv = uv; vec4 wp = modelMatrix*vec4(position,1.0); vWP = wp.xyz;',
        '  gl_Position = projectionMatrix*viewMatrix*wp; }'
      ].join('\n'),
      fragmentShader: GLSL_LIB + '\n' + [
        'uniform float uRayFade;',
        'varying vec2 vUv; varying vec3 vWP;',
        'void main(){',
        '  float edge = pow(sin(clamp(vUv.x,0.0,1.0)*3.14159), 1.7);',
        '  float vert = pow(clamp(vUv.y, 0.0, 1.0), 1.05);',
        '  float flick = 0.72 + 0.28*sin(uTime*0.55 + vWP.x*0.09 + vWP.z*0.07);',
        '  float a = edge*vert*flick*0.34*uRayFade;',
        '  a *= 1.0 - waterFog(length(vWP - cameraPosition))*0.85;',
        '  vec3 col = mix(uSkyCol, uSunCol, 0.65);',
        '  gl_FragColor = vec4(col*a, a);',
        '}'
      ].join('\n'),
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
    });
    var n = 26;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * TAU + rr(-0.2, 0.2);
      var d = Math.sqrt(rnd()) * 96;
      var len = rr(64, 108), wid = rr(3.5, 12);
      var g = new THREE.PlaneGeometry(wid, len, 1, 1);
      var q = new THREE.Mesh(g, mat);
      q.position.set(Math.cos(a) * d, CFG.WATER_Y - len * 0.5 + 2, Math.sin(a) * d);
      var sd = U.uSunDir.value;
      q.rotation.y = Math.atan2(sd.x, sd.z) + rr(-0.25, 0.25);
      q.rotation.z = -Math.asin(clamp(sd.x, -1, 1)) * 0.75 + rr(-0.10, 0.10);
      q.rotation.x = Math.asin(clamp(sd.z, -1, 1)) * 0.75 + rr(-0.10, 0.10);
      q.renderOrder = 6;
      group.add(q);
    }
    group.userData.mat = mat;
    scene.add(group);
    return group;
  }

  /* ---------- ombres de contact (un seul mesh pour tout le récif) ---------- */
  function pushShadow(x, z, radius, y) { world.shadows.push([x, z, radius, y]); }
  function buildShadows() {
    if (!world.shadows.length) return null;
    var parts = [];
    for (var i = 0; i < world.shadows.length; i++) {
      var s = world.shadows[i];
      var g = new THREE.CircleGeometry(s[2], s[3] !== undefined ? 10 : 14);
      g.rotateX(-Math.PI / 2);
      if (s[3] === undefined) {
        var p = g.attributes.position;
        for (var j = 0; j < p.count; j++) {        // la tache épouse le relief du sable
          var wx = p.getX(j) + s[0], wz = p.getZ(j) + s[1];
          p.setY(j, floorHeight(wx, wz) - floorHeight(s[0], s[1]) + 0.07);
        }
        g.computeVertexNormals();
      }
      parts.push({ geo: g, matrix: TRS(s[0], s[3] !== undefined ? s[3] : floorHeight(s[0], s[1]), s[1]) });
    }
    var u = sharedU();
    var mesh = new THREE.Mesh(mergeGeos(parts), new THREE.ShaderMaterial({
      uniforms: u,
      vertexShader: [
        'varying vec2 vUv; varying vec3 vWP;',
        'void main(){ vUv = uv; vec4 wp = modelMatrix*vec4(position,1.0); vWP = wp.xyz;',
        '  gl_Position = projectionMatrix*viewMatrix*wp; }'
      ].join('\n'),
      fragmentShader: GLSL_LIB + '\n' + [
        'varying vec2 vUv; varying vec3 vWP;',
        'void main(){',
        '  float d = length(vUv - 0.5)*2.0;',
        '  float a = pow(1.0 - clamp(d, 0.0, 1.0), 1.5)*0.55;',
        '  a *= 1.0 - waterFog(length(vWP - cameraPosition));',
        '  gl_FragColor = vec4(uDeepCol*0.65, a);',
        '}'
      ].join('\n'),
      transparent: true, depthWrite: false, side: THREE.DoubleSide
    }));
    mesh.renderOrder = 1;
    mesh.frustumCulled = false;
    scene.add(mesh);
    return mesh;
  }

  /* ---------- particules : neige marine + bulles ---------- */
  function buildParticles() {
    var group = new THREE.Group();
    function makePoints(count, spread, tex, opt) {
      var pos = new Float32Array(count * 3), size = new Float32Array(count), seed = new Float32Array(count);
      for (var i = 0; i < count; i++) {
        pos[i * 3] = rr(-spread, spread);
        pos[i * 3 + 1] = rr(opt.y0, opt.y1);
        pos[i * 3 + 2] = rr(-spread, spread);
        size[i] = rr(opt.s0, opt.s1);
        seed[i] = rnd() * 100;
      }
      var g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('aSize', new THREE.Float32BufferAttribute(size, 1));
      g.setAttribute('aSeed', new THREE.Float32BufferAttribute(seed, 1));
      var u = sharedU();
      u.tMap = { value: tex };
      u.uCenter = { value: new THREE.Vector3() };
      u.uSpread = { value: spread };
      u.uRise = { value: opt.rise };
      u.uPix = { value: 1 };
      u.uAlpha = { value: opt.alpha };
      u.uCol = { value: new THREE.Color(opt.color) };
      u.uYRange = { value: new THREE.Vector2(opt.y0, opt.y1) };
      var mat = new THREE.ShaderMaterial({
        uniforms: u,
        vertexShader: GLSL_LIB + '\n' + [
          'attribute float aSize; attribute float aSeed;',
          'uniform vec3 uCenter; uniform float uSpread; uniform float uRise; uniform float uPix;',
          'uniform vec2 uYRange; uniform vec2 uDrift;',
          'varying float vFade; varying float vSeed;',
          'void main(){',
          '  vec3 p = position;',
          '  float span = uSpread*2.0;',
          // La dérive vient de l'intégrale du courant : les mêmes rafales
          // emportent la poussière et penchent les coraux, donc on lit une eau
          // qui bouge et pas deux animations sans rapport.
          '  p.x += sin(uTime*0.31 + aSeed)*0.9 + uDrift.x;',
          '  p.z += cos(uTime*0.27 + aSeed*1.7)*0.9 + uDrift.y;',
          '  p.y += uTime*uRise;',
          '  p.x = mod(p.x - uCenter.x + uSpread, span) - uSpread + uCenter.x;',
          '  p.z = mod(p.z - uCenter.z + uSpread, span) - uSpread + uCenter.z;',
          '  float ySpan = uYRange.y - uYRange.x;',
          '  p.y = mod(p.y - uYRange.x, ySpan) + uYRange.x;',
          '  vSeed = aSeed;',
          '  vec4 mv = viewMatrix*vec4(p,1.0);',
          '  float dist = -mv.z;',
          '  vFade = (1.0 - waterFog(dist)) * smoothstep(1.2, 4.0, dist);',
          '  gl_PointSize = aSize*uPix/max(dist, 0.5);',
          '  gl_Position = projectionMatrix*mv;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'uniform sampler2D tMap; uniform float uAlpha; uniform vec3 uCol;',
          'varying float vFade; varying float vSeed;',
          'void main(){',
          '  vec4 t = texture2D(tMap, gl_PointCoord);',
          '  float a = t.a*uAlpha*vFade;',
          '  if(a < 0.004) discard;',
          '  gl_FragColor = vec4(uCol*t.rgb, a);',
          '}'
        ].join('\n'),
        transparent: true, depthWrite: false, blending: opt.additive ? THREE.AdditiveBlending : THREE.NormalBlending
      });
      var pts = new THREE.Points(g, mat);
      pts.frustumCulled = false;
      group.add(pts);
      return pts;
    }

    var snow = makePoints(QUALITY > 0 ? 1700 : 700, 62, TEX.soft,
      { y0: -6, y1: CFG.WATER_Y, s0: 16, s1: 52, rise: 0.35, alpha: 0.5, color: 0xdff6ff, additive: true });
    var plankton = makePoints(QUALITY > 0 ? 900 : 300, 34, TEX.soft,
      { y0: -4, y1: CFG.WATER_Y * 0.8, s0: 7, s1: 20, rise: 0.12, alpha: 0.75, color: 0xfff2cf, additive: true });
    var bubbles = makePoints(QUALITY > 0 ? 300 : 120, 60, TEX.bubble,
      { y0: -4, y1: CFG.WATER_Y + 2, s0: 40, s1: 130, rise: 3.1, alpha: 0.5, color: 0xffffff, additive: false });
    group.userData.layers = [snow, plankton, bubbles];
    scene.add(group);
    return group;
  }

  /* ================================================================== */
  /* LE RÉCIF : massifs d'étagères de roche encroûtés de coraux          */
  /* ------------------------------------------------------------------ */
  /* Tout le décor statique est fusionné en 3 maillages par massif       */
  /* (rigide / souple / plat), ce qui permet des milliers de coraux      */
  /* pour une poignée d'appels de dessin.                                */
  /* ================================================================== */
  var REEF = {};                 // les 3 seuls matériaux du décor
  var batch = null;
  var seedCounter = 1000;
  function nextSeed() { return ++seedCounter; }

  function beginBatch() { batch = { hard: [], soft: [], flat: [] }; }
  function put(kind, geo, matrix, color, phase) {
    batch[kind].push({ geo: geo, matrix: matrix, color: color, phase: phase || 0 });
  }
  function endBatch() {
    var kinds = ['hard', 'soft', 'flat'], made = [];
    for (var i = 0; i < kinds.length; i++) {
      var k = kinds[i];
      if (!batch[k].length) continue;
      var m = new THREE.Mesh(mergeGeos(batch[k]), REEF[k].mat);
      m.matrixAutoUpdate = false;
      castShadow(m);
      scene.add(m);
      made.push(m);
    }
    batch = null;
    return made;
  }

  var SPAWN = new THREE.Vector3(26, 0, 24);
  function nearSpawn(x, z, pad) {
    var dx = x - SPAWN.x, dz = z - SPAWN.z;
    return dx * dx + dz * dz < (pad || 9) * (pad || 9);
  }
  function addCollider(x, y, z, r) { world.colliders.push({ x: x, y: y, z: z, r: r }); }
  function addDisc(x, y, z, r, h) { world.colliders.push({ x: x, y: y, z: z, r: r, h: h }); }

  function buildReef() {
    /* ---- matériaux : un pour la roche et les coraux durs, un pour ce qui
            ondule, un pour les feuilles à double face ---- */
    var MOTTLE = [
      '  float mo = fbm(vWP.xz*0.33 + vWP.y*0.12);',
      '  base *= 0.90 + 0.20*mo;',
      '  base = mix(base, base*vec3(0.72,0.92,0.80), smoothstep(0.62,0.92,mo)*0.35);'
    ].join('\n');
    REEF.hard = makeToonMat({ color: 0xffffff, spec: 0.10, rim: 0.20, caust: 1.0, bump: 0.55, baseHook: MOTTLE });
    REEF.soft = makeToonMat({
      color: 0xffffff, spec: 0.06, rim: 0.30, sss: 0.55, caust: 0.85, bump: 0.22,
      mode: 0, swayAmp: 0.115, swaySpeed: 1.15
    });
    REEF.flat = makeToonMat({
      color: 0xffffff, spec: 0.05, rim: 0.28, sss: 0.75, caust: 0.8,
      mode: 0, swayAmp: 0.19, swaySpeed: 1.3, side: THREE.DoubleSide
    });

    /* ---- bibliothèque de géométries réutilisées partout ---- */
    var GEO = {
      knob:   [knobCoralGeo(301, 6), knobCoralGeo(302, 8), knobCoralGeo(303, 10), knobCoralGeo(304, 5)],
      brain:  [brainCoralGeo(311), brainCoralGeo(312)],
      branch: [branchCoralGeo(321, 1.0), branchCoralGeo(322, 1.25), branchCoralGeo(323, 0.85)],
      sponge: [tubeSpongeGeo(331), tubeSpongeGeo(332), tubeSpongeGeo(333)],
      pom:    [pomAnemoneGeo(341, 1.0, 22), pomAnemoneGeo(342, 1.4, 29), pomAnemoneGeo(343, 0.7, 15)],
      fringe: [fringePlateGeo(351, 2.1), fringePlateGeo(352, 3.0)],
      fan:    [fanCoralGeo(361, 1.4), fanCoralGeo(362, 2.1)],
      whip:   [whipGeo(371, 3.0), whipGeo(372, 4.4), whipGeo(373, 2.2)],
      pad:    [padGeo(381, 1.2), padGeo(382, 1.9)],
      grass:  [grassGeo(391, 10, 0.85), grassGeo(392, 14, 1.25)],
      kelp:   [kelpGeo(401, 5.0), kelpGeo(402, 7.5)],
      urchin: [urchinGeo(411)],
      star:   [starfishGeo()],
      shelfS: [shelfGeo(421, 2.0, 0.45), shelfGeo(422, 3.2, 0.65)],
      rock:   [rockGeo(431, 2.2), rockGeo(432, 4.0), rockGeo(433, 6.5), rockGeo(434, 9.5)],
      pillar: [pillarGeo(441, 10), pillarGeo(442, 14), pillarGeo(443, 7)]
    };
    var ROCK_R = [2.2, 4.0, 6.5, 9.5];

    function rockCol() {
      var v = rnd();
      return v < 0.5 ? PAL.rock : (v < 0.75 ? tint(PAL.rock, 0.88) : tint(PAL.rock, 1.09));
    }
    /** Palette d'un massif : 3 teintes dominantes + accents rares. */
    function makePal() {
      var p = [];
      for (var i = 0; i < 3; i++) p.push(pick(PAL.coral));
      return p;
    }
    function palPick(pal) {
      var v = rnd();
      return v < 0.82 ? pal[(rnd() * pal.length) | 0] : pick(PAL.coral);
    }

    /** Pose un corail d'un type donné. */
    function placeProp(t, x, z, py, col, big, shadY, onSand) {
      var rot = rnd() * TAU, ph = rnd() * TAU, s = 0;
      {
        if (t < 0.235) {                                    // chou-fleur
          s = (big > 1 && rnd() < 0.3 ? rr(1.6, 2.6) : rr(0.5, 1.25)) * big;
          put('hard', pick(GEO.knob), TRS(x, py - 0.08, z, 0, rot, 0, s), col);
          if (s > 0.85) addCollider(x, py + 0.6 * s, z, 0.95 * s + 0.5);
        } else if (t < 0.325) {                             // cerveau
          s = (big > 1 && rnd() < 0.3 ? rr(1.7, 2.8) : rr(0.55, 1.35)) * big;
          put('hard', pick(GEO.brain), TRS(x, py - 0.05, z, 0, rot, 0, s), col);
          if (s > 0.8) addCollider(x, py + 0.32 * s, z, 1.15 * s + 0.45);
        } else if (t < 0.415) {                             // branchu
          s = (big > 1 && rnd() < 0.25 ? rr(1.7, 2.6) : rr(0.55, 1.3)) * big;
          put('hard', pick(GEO.branch), TRS(x, py - 0.08, z, 0, rot, 0, s), col);
          if (s > 0.9) addCollider(x, py + 1.0 * s, z, 1.0 * s + 0.5);
        } else if (t < 0.49) {                              // éponges
          s = rr(0.6, 1.35) * big;
          put('hard', pick(GEO.sponge), TRS(x, py - 0.05, z, 0, rot, 0, s), col);
        } else if (t < 0.665) {                             // anémones pompons
          s = rr(0.55, 1.25) * big;
          put('soft', pick(GEO.pom), TRS(x, py - 0.05, z, 0, rot, 0, s), col, ph);
        } else if (t < 0.705) {                             // grande table frangée
          s = rr(0.75, 1.3);
          put('soft', pick(GEO.fringe), TRS(x, py + 0.1, z, 0, rot, 0, s), col, ph);
          addDisc(x, py + 0.35 * s, z, 2.4 * s, 0.5 * s + 0.7);
        } else if (t < 0.775) {                             // fouets de mer
          s = rr(0.6, 1.3) * big;
          put('soft', pick(GEO.whip), TRS(x, py, z, 0, rot, 0, s), col, ph);
        } else if (t < 0.825) {                             // gorgones
          s = rr(0.6, 1.4) * big;
          put('soft', pick(GEO.fan), TRS(x, py, z, 0, rot, 0, s), col, ph);
        } else if (t < 0.878) {                             // plateaux d'algue
          s = rr(0.45, 0.95);
          put('hard', pick(GEO.pad), TRS(x, py + 0.12, z, rr(-0.06, 0.06), rot, rr(-0.06, 0.06), s),
              pick(PAL.algae));
        } else if (t < 0.935) {                             // touffes
          s = rr(0.7, 1.4);
          put('flat', rnd() < 0.75 ? pick(GEO.grass) : pick(GEO.kelp),
              TRS(x, py - 0.1, z, 0, rot, 0, s), pick(PAL.algae), ph);
          s = 0;
        } else if (t < 0.962) {                             // petite étagère
          s = rr(0.6, 1.2);
          put('hard', pick(GEO.shelfS), TRS(x, py + 0.2, z, 0, rot, 0, s), rockCol());
        } else if (t < 0.984) {
          put('hard', GEO.urchin[0], TRS(x, py, z, 0, rot, 0, rr(0.6, 1.2)), pick(PAL.coral));
        } else {
          put('hard', GEO.star[0], TRS(x, py + 0.04, z, 0, rot, 0, rr(0.8, 1.5)), col);
        }
      }
      if (s > 0.62) pushShadow(x, z, s * 1.45, onSand ? undefined : shadY);
    }

    /** Sème des coraux sur un disque (sommet d'étagère, ou le sable),
        en petites touffes d'une même espèce comme dans le film. */
    function encrust(cx, cz, y, radius, count, pal, opt) {
      opt = opt || {};
      var placed = 0, guard = 0;
      while (placed < count && guard++ < count * 4) {
        var a = rnd() * TAU;
        var d = opt.rim ? radius * rr(0.86, 1.04) : Math.pow(rnd(), opt.edge ? 0.45 : 0.72) * radius;
        var x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d;
        if (opt.onSand && nearSpawn(x, z, 10)) continue;
        var t = rnd(), col = palPick(pal), big = opt.big ? 1.35 : 1.0;
        var clump = rnd() < 0.38 ? 2 + ((rnd() * 3) | 0) : 1;
        for (var ci = 0; ci < clump && placed < count; ci++) {
          var jx = x + (ci ? rr(-1.6, 1.6) : 0), jz = z + (ci ? rr(-1.6, 1.6) : 0);
          var py = opt.onSand ? floorHeight(jx, jz) : y;
          placeProp(t, jx, jz, py, col, big, py + 0.05, !!opt.onSand);
          placed++;
        }
      }
    }

    /** Un massif : noyau de roche + étagères empilées + coraux partout. */
    function buildMassif(cx, cz, size, opt) {
      opt = opt || {};
      beginBatch();
      var pal = makePal();
      var baseY = floorHeight(cx, cz);

      var ri = size > 17 ? 3 : (size > 12 ? 2 : 1);
      var rs = (size * 0.60) / ROCK_R[ri];
      put('hard', GEO.rock[ri], TRS(cx, baseY - size * 0.16, cz, 0, rnd() * TAU, 0, rs, rs * 0.85, rs), rockCol());
      addCollider(cx, baseY - size * 0.16, cz, ROCK_R[ri] * rs * 1.2 + 0.9);
      pushShadow(cx, cz, size * 1.4);

      var n = Math.max(3, Math.round(size / 3.6) + ((rnd() * 2) | 0));
      var y = baseY + size * rr(0.14, 0.22);
      var top = { x: cx, y: y, z: cz, r: size * 0.5 };
      for (var i = 0; i < n; i++) {
        var sr = size * (0.62 - i * 0.055 + (rnd() - 0.5) * 0.14);
        if (sr < 2.2) break;
        var th = rr(1.1, 2.3);
        var sx = cx + rr(-1, 1) * size * 0.26, sz = cz + rr(-1, 1) * size * 0.26;
        // pilier qui porte le plateau (sinon les étagères ont l'air de flotter)
        var supY0 = i === 0 ? baseY - 1 : top.y;
        var supH = y - th * 0.5 - supY0 + 0.8;
        if (supH > 0.4) {
          var supX = (i === 0 ? cx : top.x) * 0.4 + sx * 0.6;
          var supZ = (i === 0 ? cz : top.z) * 0.4 + sz * 0.6;
          var supR = Math.min(i === 0 ? size * 0.4 : top.r, sr) * rr(0.4, 0.62);
          var sup = new THREE.CylinderGeometry(supR * 0.88, supR * 1.06, supH, 10, 1, true);
          occByHeight(sup, -supH * 0.5, supH * 0.5, 0.5);
          put('hard', sup, TRS(supX, supY0 + supH * 0.5, supZ, 0, rnd() * TAU, 0, 1), rockCol());
          addCollider(supX, supY0 + supH * 0.5, supZ, supR + 1.0);
        }
        put('hard', shelfGeo(nextSeed(), sr, th), TRS(sx, y, sz, 0, rnd() * TAU, 0, 1), rockCol());
        addDisc(sx, y, sz, sr * 0.97, th * 0.5 + 1.0);
        var bigTop = i === 0 && size > 14;
        encrust(sx, sz, y + th * 0.5, sr * 0.86, Math.round(sr * 2.0), pal, { big: bigTop });
        encrust(sx, sz, y + th * 0.35, sr, Math.round(sr * 1.3), pal, { rim: true });
        top = { x: sx, y: y + th * 0.5, z: sz, r: sr };
        y += rr(1.1, 2.3) + th;
      }
      // au pied du massif, sur le sable
      encrust(cx, cz, 0, size * 1.1, Math.round(size * 2.4), pal, { onSand: true, edge: true });
      var meshes = endBatch();
      return { x: cx, z: cz, size: size, top: top, meshes: meshes };
    }

    /** Passerelle de roche entre deux massifs : les arches du film. */
    function buildBridge(a, b) {
      beginBatch();
      var mx = (a.top.x + b.top.x) * 0.5, mz = (a.top.z + b.top.z) * 0.5;
      var dx = b.top.x - a.top.x, dz = b.top.z - a.top.z;
      var len = Math.sqrt(dx * dx + dz * dz);
      var ang = Math.atan2(dx, dz);
      var y = Math.min(a.top.y, b.top.y) + rr(1.5, 4);
      var wid = rr(3.2, 5);
      var g = shelfGeo(nextSeed(), 1, 0.55);
      put('hard', g, TRS(mx, y, mz, 0, -ang, 0, wid, 1.6, len * 0.55), rockCol());
      addDisc(mx, y, mz, Math.max(wid, len * 0.5), 1.6);
      var pal = makePal();
      for (var i = 0; i < 14; i++) {
        var t = rr(-0.42, 0.42);
        encrust(mx + dx * t, mz + dz * t, y + 0.5, wid * 0.5, 2, pal, {});
      }
      endBatch();
      world.arch = new THREE.Vector3(mx, y, mz);
    }

    /* ---- 1. la maison : massif central coiffé de l'anémone hôte ---- */
    var home = buildMassif(0, 0, 15);
    beginBatch();
    var hostR = 4.4;          // dans le film l'anémone écrase le poisson
    /* Teinte blanche : le dégradé magenta → crème est cuit dans les sommets, et
       la couleur passée ici le MULTIPLIE. Un rose l'aurait reteint en entier et
       fait disparaître la colonne magenta sous une bouillie uniforme. */
    put('soft', hostAnemoneGeo(777, hostR, 172),
        TRS(home.top.x, home.top.y + 0.1, home.top.z, 0, rnd() * TAU, 0, 1), 0xffffff, rnd() * TAU);
    endBatch();
    world.home.set(home.top.x, home.top.y + hostR * 0.9, home.top.z);
    world.refuges.push(world.home.clone());
    addDisc(home.top.x, home.top.y + 0.6, home.top.z, hostR * 0.7, 1.2);

    /* ---- 2. les autres massifs ---- */
    var massifs = [home];
    var RING = [];
    var rings = [[30, 4, 14], [54, 6, 19], [78, 7, 23], [98, 5, 13]];
    for (var rg = 0; rg < rings.length; rg++) {
      var rad = rings[rg][0], cnt = rings[rg][1], sz = rings[rg][2];
      for (var ci2 = 0; ci2 < cnt; ci2++) {
        var ang2 = (ci2 / cnt) * TAU + rg * 0.5 + rr(-0.16, 0.16);
        RING.push([Math.cos(ang2) * rad * rr(0.88, 1.12), Math.sin(ang2) * rad * rr(0.88, 1.12), sz]);
      }
    }
    for (var i = 0; i < RING.length; i++) {
      var mx2 = RING[i][0] + rr(-5, 5), mz2 = RING[i][1] + rr(-5, 5);
      if (nearSpawn(mx2, mz2, 22)) continue;
      var clash = false;
      for (var pk2 in PLACES) {
        var pv = PLACES[pk2];
        if ((mx2 - pv.x) * (mx2 - pv.x) + (mz2 - pv.z) * (mz2 - pv.z) < pv.clear * pv.clear) clash = true;
      }
      if (clash) continue;
      // pas de massif dans le vide du tombant
      if ((1 - smoothstep(0.5, 1.0, angGap(Math.atan2(mz2, mx2), DROP_ANG))) *
          smoothstep(70, 92, Math.sqrt(mx2 * mx2 + mz2 * mz2)) > 0.25) continue;
      massifs.push(buildMassif(mx2, mz2, RING[i][2] * rr(0.85, 1.15)));
    }

    /* ---- 3. tourelles ---- */
    for (var q = 0; q < 10; q++) {
      var qa = rnd() * TAU, qd = 24 + Math.sqrt(rnd()) * (CFG.REEF_R - 34);
      var qx = Math.cos(qa) * qd, qz = Math.sin(qa) * qd;
      if (nearSpawn(qx, qz, 16)) continue;
      var okq = true;
      for (var mi = 0; mi < massifs.length; mi++) {
        var mm = massifs[mi];
        if ((qx - mm.x) * (qx - mm.x) + (qz - mm.z) * (qz - mm.z) < (mm.size + 12) * (mm.size + 12)) { okq = false; break; }
      }
      if (!okq) continue;
      beginBatch();
      var psc = rr(0.8, 1.5), pg = pick(GEO.pillar), pby = floorHeight(qx, qz) - 1;
      put('hard', pg, TRS(qx, pby, qz, 0, rnd() * TAU, 0, psc), rockCol());
      for (var pk = 0; pk < 4; pk++) addCollider(qx, pby + (1.5 + pk * 3.4) * psc, qz, 3.0 * psc + 0.9);
      pushShadow(qx, qz, 6 * psc);
      encrust(qx, qz, 0, 7 * psc, Math.round(16 * psc), makePal(), { onSand: true });
      endBatch();
    }

    /* ---- 4. deux passerelles entre massifs proches ---- */
    var bridges = 0;
    for (var bi = 1; bi < massifs.length && bridges < 2; bi++) {
      for (var bj = bi + 1; bj < massifs.length && bridges < 2; bj++) {
        var A = massifs[bi], B = massifs[bj];
        var dd = Math.sqrt((A.x - B.x) * (A.x - B.x) + (A.z - B.z) * (A.z - B.z));
        if (dd > 26 && dd < 42) { buildBridge(A, B); bridges++; }
      }
    }
    if (!world.arch) world.arch = new THREE.Vector3(massifs[1].top.x, massifs[1].top.y + 4, massifs[1].top.z);
    world.massifs = massifs;

    /* ---- 5. les lieux remarquables ---- */
    buildLandmarks(GEO, encrust, makePal, rockCol);

    /* ---- 6. le sable entre les massifs : semis clairsemé, par quadrant ---- */
    for (var qd2 = 0; qd2 < 4; qd2++) {
      beginBatch();
      var pal2 = makePal();
      var placedQ = 0, tries = 0;
      while (placedQ < 58 && tries < 520) {
        tries++;
        var aa = (qd2 + rnd()) * (TAU / 4);
        var dd2 = 16 + Math.sqrt(rnd()) * (CFG.REEF_R - 18);
        var px = Math.cos(aa) * dd2, pz = Math.sin(aa) * dd2;
        if (nearSpawn(px, pz, 11)) continue;
        var ok = true;
        for (var ci = 0; ci < massifs.length; ci++) {
          var M = massifs[ci];
          if ((px - M.x) * (px - M.x) + (pz - M.z) * (pz - M.z) < (M.size * 1.2) * (M.size * 1.2)) { ok = false; break; }
        }
        if (!ok) continue;
        placedQ++;
        encrust(px, pz, 0, 3 + rnd() * 4, 2 + ((rnd() * 5) | 0), pal2, { onSand: true });
      }
      endBatch();
    }
  }

  /* ---------- emplacements des perles ---------- */
  function buildPearls() {
    var spots = [];
    function far(v) {
      if (v.length() > CFG.REEF_R - 6) return false;
      var hx = v.x - world.home.x, hz = v.z - world.home.z;
      if (hx * hx + hz * hz < 260) return false;
      for (var i = 0; i < spots.length; i++) if (spots[i].distanceTo(v) < 20) return false;
      for (var c = 0; c < world.colliders.length; c++) {
        var col = world.colliders[c];
        var dx = v.x - col.x, dy = v.y - col.y, dz = v.z - col.z;
        if (col.h === undefined) {
          if (dx * dx + dy * dy + dz * dz < (col.r + 1.6) * (col.r + 1.6)) return false;
        } else if (dx * dx + dz * dz < (col.r + 1.6) * (col.r + 1.6) && Math.abs(dy) < col.h + 1.6) {
          return false;
        }
      }
      return true;
    }
    // une perle sous l'arche, une tout près de la surface
    spots.push(new THREE.Vector3(world.arch.x, world.arch.y - 4.5, world.arch.z));
    spots.push(new THREE.Vector3(rr(-30, 30), CFG.WATER_Y - 7, rr(-30, 30)));
    var guard = 0;
    while (spots.length < CFG.PEARLS && guard++ < 3000) {
      var a = rnd() * TAU, d = 22 + Math.sqrt(rnd()) * (CFG.REEF_R - 26);
      var x = Math.cos(a) * d, z = Math.sin(a) * d;
      var y = floorHeight(x, z) + (rnd() < 0.25 ? rr(9, 20) : rr(1.6, 7));
      var v = new THREE.Vector3(x, y, z);
      if (far(v)) spots.push(v);
    }
    world.pearlSpots = spots;
  }
  /** Fait apparaître les perles (au démarrage de la quête). */
  function spawnPearls(n) {
    var sp = world.pearlSpots || [];
    for (var i = 0; i < Math.min(n, sp.length); i++) {
      addPickup('pearl', sp[i], { tag: 'pearls' });
    }
  }

  /* ---------- bancs de poissons ---------- */
  function buildSchools() {
    var species = [
      { color: 0x2f7fe0, colorB: 0xa8ddff, w: 0.26, h: 0.62, n: 18, size: 0.55, swaySpeed: 9 },
      { color: 0xffcf3f, colorB: 0xfff3bd, w: 0.22, h: 0.68, n: 15, size: 0.5, swaySpeed: 10 },
      { color: 0xa9e6ff, colorB: 0xffffff, w: 0.24, h: 0.50, n: 22, size: 0.4, stripes: true, swaySpeed: 11 },
      { color: 0xff6fa8, colorB: 0xffd6e6, w: 0.28, h: 0.58, n: 13, size: 0.62, swaySpeed: 8.5 },
      { color: 0x6be0b0, colorB: 0xe6fff4, w: 0.25, h: 0.55, n: 16, size: 0.46, swaySpeed: 9.5 },
      { color: 0xffa03f, colorB: 0xffe3b0, w: 0.27, h: 0.60, n: 14, size: 0.52, stripes: true, swaySpeed: 9 },
      { color: 0x8f9dff, colorB: 0xe4e9ff, w: 0.23, h: 0.52, n: 18, size: 0.42, swaySpeed: 10.5 }
    ];
    for (var s = 0; s < species.length; s++) {
      var sp = species[s];
      var tmpl = buildSmallFish(sp);
      var school = {
        fish: [], t: rnd() * 100,
        radius: s < 3 ? rr(38, 88) : rr(13, 34), speed: rr(0.055, 0.11) * (rnd() < 0.5 ? 1 : -1),
        phase: rnd() * TAU, y: rr(5, 28), spread: rr(3.2, 6.5)
      };
      for (var i = 0; i < sp.n; i++) {
        var f = i === 0 ? tmpl : new THREE.Mesh(tmpl.geometry, tmpl.material);
        f.scale.setScalar(sp.size * rr(0.82, 1.18));
        f.userData.off = new THREE.Vector3(rr(-1, 1), rr(-0.5, 0.5), rr(-1, 1))
          .normalize().multiplyScalar(Math.pow(rnd(), 0.6) * school.spread);
        f.userData.ph = rnd() * TAU;
        f.userData.prev = new THREE.Vector3();
        f.userData.flee = new THREE.Vector3();
        castShadow(f);
        scene.add(f);
        school.fish.push(f);
      }
      world.schools.push(school);
    }
  }

  /* ---------- méduses ---------- */
  function buildJellies() {
    for (var i = 0; i < CFG.JELLIES; i++) {
      var j = buildJellyfish();
      var a = rnd() * TAU, d = 25 + rnd() * (CFG.REEF_R - 34);
      var x = Math.cos(a) * d, z = Math.sin(a) * d;
      j.position.set(x, floorHeight(x, z) + rr(8, 26), z);
      j.scale.setScalar(rr(0.85, 1.5));
      j.userData.ph = rnd() * TAU;
      j.userData.drift = new THREE.Vector3(rr(-1, 1), 0, rr(-1, 1)).normalize().multiplyScalar(rr(0.5, 1.3));
      j.userData.y0 = j.position.y;
      scene.add(j);
      world.jellies.push(j);
    }
  }

  /* ---------- la tortue de passage ---------- */
  function buildTurtleActor() {
    var t = buildTurtle();
    t.scale.setScalar(2.6);
    t.userData.t = rnd() * 100;
    castShadow(t);
    scene.add(t);
    world.turtle = t;
  }


  /* ================================================================== */
  /* VIE DU RÉCIF : comportements                                       */
  /* ================================================================== */
  var ZERO = new THREE.Vector3();
  var tmpF = new THREE.Vector3(), tmpG = new THREE.Vector3();

  function faceDir(obj, dir, dt, lambda) {
    if (dir.lengthSq() < 1e-7) return;
    tmpF.copy(dir).normalize();
    tmpM.lookAt(tmpF, ZERO, UP);
    tmpQ.setFromRotationMatrix(tmpM);
    obj.quaternion.slerp(tmpQ, 1 - Math.exp(-(lambda || 3) * dt));
  }
  function addCritter(obj, def) {
    def.obj = obj;
    def.t = rnd() * 100;
    if (def.phase === undefined) def.phase = rnd() * TAU;
    if (def.cast !== false) castShadow(obj);
    scene.add(obj);
    world.critters.push(def);
    return def;
  }
  function updateCritters(dt) {
    for (var i = 0; i < world.critters.length; i++) {
      var c = world.critters[i];
      c.t += dt;
      if (c.update) c.update(c, dt);
    }
  }
  /** Battement des nageoires pectorales si le modèle en a. */
  function flapPect(obj, t, amp) {
    var p = obj.userData.pect;
    if (!p) return;
    p[0].rotation.z = 0.15 + Math.sin(t) * (amp || 0.45);
    p[1].rotation.z = -0.15 - Math.sin(t + 0.4) * (amp || 0.45);
  }
  /** Le joueur est-il à l'abri dans une anémone ? */
  function inRefuge() {
    for (var i = 0; i < world.refuges.length; i++) {
      if (world.refuges[i].distanceToSquared(player.pos) < 42) return true;
    }
    return false;
  }

  /* ---------- requins : patrouille, puis fonce si on s'expose ---------- */
  function updateShark(c, dt) {
    var pos = c.obj.position;
    var dp = pos.distanceTo(player.pos);
    if (c.alert > 0) c.alert -= dt;
    if (c.cool > 0) c.cool -= dt;

    /* L'anémone COUPE la poursuite, elle n'empêche pas seulement de se faire
       repérer. C'était le bug : `inRefuge()` ne gardait que l'acquisition, donc
       une fois `alert` posée à 3,4 s le requin continuait de foncer et pouvait
       percuter un joueur réfugié. Pire, tant qu'on était dehors l'alerte était
       remise à 3,4 s à chaque image — entrer dans l'anémone ne lançait qu'un
       compte à rebours de trois secondes et demie, pendant lesquelles on se
       faisait cogner. Se cacher ne faisait donc, littéralement, rien. */
    var safe = inRefuge();
    if (safe) {
      if (c.alert > 0 && G.safeT <= 0) {
        // sans ce retour, rien ne dit au joueur que ça a marché
        G.safeT = 3.5;
        showHint(T('hint.lostYou'), 2.8);
        SND.safe();
      }
      c.alert = 0;
      c.cool = 1.5;          // et un répit en ressortant : jamais punitif
    } else if (G.state === 'play' && dp < c.senseR && c.cool <= 0) {
      if (c.alert <= 0) { SND.growl(); showHint(T('hint.spotted'), 3.5); }
      c.alert = 3.4;
    }

    if (c.alert > 0 && G.state === 'play') {
      tmpA.copy(player.pos).sub(pos);
      var dist = tmpA.length() || 1;
      tmpA.divideScalar(dist);
      pos.addScaledVector(tmpA, dt * c.chase);
      faceDir(c.obj, tmpA, dt, 2.0);
      c.obj.userData.body.userData.anim.uSwaySpeed.value = 5.2;
      if (dist < 3.6 && player.stun <= 0) { sharkBump(c); c.alert = 0; c.cool = 9; }
    } else {
      var a = c.t * c.speed + c.phase;
      var x = c.cx + Math.cos(a) * c.r, z = c.cz + Math.sin(a) * c.r;
      var y = c.y + Math.sin(c.t * 0.23 + c.phase) * 6;
      tmpA.set(x, y, z);
      tmpB.copy(tmpA).sub(pos);
      /* Retour à l'orbite en nageant, pas en sautant. Le `pos.copy(tmpA)`
         d'avant téléportait le requin sur son cercle dès la fin de la chasse ;
         ça passait presque inaperçu quand l'alerte s'éteignait toute seule au
         loin, mais l'anémone coupe la poursuite à bout portant — il se serait
         évaporé sous le nez du joueur.

         Vitesse **bornée** et non pas lissage exponentiel : une interpolation
         vers un point de patrouille situé à 92 u part toujours vite, quelle que
         soit sa constante de temps — mesuré à 26 u en 50 ms, soit un saut à
         peine étalé. Ici il nage à ~7 u/s, met une douzaine de secondes à
         rejoindre le large, et une fois arrivé il colle à l'orbite comme
         avant (le cercle avance à 4,6 u/s, il le rattrape donc toujours). */
      var far = tmpB.length();
      var step = dt * c.chase * 0.55;
      if (far > step) pos.addScaledVector(tmpB, step / far);
      else pos.copy(tmpA);
      faceDir(c.obj, tmpB, dt, 2.2);
      // plus il est loin de son orbite, plus il bat de la queue
      c.obj.userData.body.userData.anim.uSwaySpeed.value = 2.4 + clamp(far / 22, 0, 1) * 1.8;
    }
    var fl = floorHeight(pos.x, pos.z) + 3;
    if (pos.y < fl) pos.y = fl;
    // ambiance : plus il est près, plus l'eau se teinte — mais à l'abri elle
    // se vide, et c'est le signal le plus lisible que la cachette fonctionne
    var menace = safe ? 0 : clamp(1 - (dp - 12) / 26, 0, 1);
    if (menace > c.menace) c.menace = menace; else c.menace = damp(c.menace, menace, 2, dt);
    if (c.menace > world.menace) world.menace = c.menace;
  }

  /* ---------- raie : glisse en cercles très lents ---------- */
  function updateRay(c, dt) {
    var a = c.t * 0.055 + c.phase;
    var x = Math.cos(a) * c.r, z = Math.sin(a) * c.r;
    var y = c.y + Math.sin(c.t * 0.13) * 5;
    tmpA.set(x, y, z);
    tmpB.copy(tmpA).sub(c.obj.position);
    c.obj.position.copy(tmpA);
    faceDir(c.obj, tmpB, dt, 1.6);
  }

  /* ---------- tortues ---------- */
  function updateTurtleCritter(c, dt) {
    var a = c.t * c.speed + c.phase;
    tmpA.set(Math.cos(a) * c.r + c.cx, c.y + Math.sin(c.t * 0.09) * 4, Math.sin(a) * c.r + c.cz);
    if (c.follow) {                                  // escorte : il suit le joueur
      tmpG.copy(player.pos).sub(c.obj.position);
      var d = tmpG.length();
      if (d > c.followD) {
        tmpG.divideScalar(d);
        tmpA.copy(c.obj.position).addScaledVector(tmpG, Math.min(d - c.followD, 1) * dt * c.followSpeed * 6);
      } else tmpA.copy(c.obj.position);
      tmpA.y += Math.sin(c.t * 1.2) * dt * 0.6;
    }
    tmpB.copy(tmpA).sub(c.obj.position);
    c.obj.position.copy(tmpA);
    if (tmpB.lengthSq() > 1e-6) faceDir(c.obj, tmpB, dt, 2.5);
    var fl = floorHeight(c.obj.position.x, c.obj.position.z) + 1.6;
    if (c.obj.position.y < fl) c.obj.position.y = fl;
    var fls = c.obj.userData.flippers, ph = c.t * (c.follow ? 3.4 : 1.5);
    for (var i = 0; i < fls.length; i++) {
      var sg = i % 2 === 0 ? 1 : -1;
      fls[i].rotation.z = (i < 2 ? Math.sin(ph) * 0.5 : Math.sin(ph + 0.7) * 0.25) * sg + 0.1 * sg;
      fls[i].rotation.x = Math.cos(ph + i) * 0.18;
    }
  }

  /* ---------- PNJ qui flottent près de leur point d'ancrage ---------- */
  function updateNpc(c, dt) {
    var a = c.t * (c.orbit || 0.5) + c.phase;
    tmpA.set(c.anchor.x + Math.cos(a) * (c.r || 1.6),
             c.anchor.y + Math.sin(a * 0.8) * (c.bob || 0.5),
             c.anchor.z + Math.sin(a) * (c.r || 1.6));
    tmpB.copy(tmpA).sub(c.obj.position);
    c.obj.position.copy(tmpA);
    var dp = c.obj.position.distanceTo(player.pos);
    if (dp < 11) { tmpB.copy(player.pos).sub(c.obj.position); tmpB.y *= 0.5; }
    faceDir(c.obj, tmpB, dt, 3);
    flapPect(c.obj, c.t * 7, 0.45);
    if (c.extra) c.extra(c, dt, dp);
  }

  /* ---------- poisson-globe : se gonfle ---------- */
  function puffExtra(c, dt, dp) {
    var want = dp < 7 ? 1 : 0;
    c.puff = damp(c.puff === undefined ? 0 : c.puff, want, want ? 6 : 2, dt);
    var s = c.baseScale * (1 + c.puff * 0.55);
    c.obj.scale.setScalar(s);
    c.obj.userData.spikes.scale.setScalar(1 + c.puff * 0.35);
  }

  /* ---------- pieuvre : rentre dans son trou ---------- */
  function octoExtra(c, dt, dp) {
    var hide = dp < 4.5 ? 1 : 0;
    c.hide = damp(c.hide === undefined ? 0 : c.hide, hide, hide ? 3.5 : 1.2, dt);
    c.obj.position.y = c.anchor.y - c.hide * 0.35;
    c.obj.userData.arms.userData.anim.uSwayAmp.value = 0.30 + c.hide * 0.5;
    c.obj.userData.body.material.uniforms.uColor.value.setHex(c.hide > 0.5 ? 0x8f6f9c : 0xc4628f);
  }

  /* ---------- crabe : trotte sur le sable et détale ---------- */
  function updateCrab(c, dt) {
    var pos = c.obj.position;
    var dp = pos.distanceTo(player.pos);
    if (dp < 7) {                                     // il détale
      tmpA.copy(pos).sub(player.pos).setY(0).normalize();
      c.dir.lerp(tmpA, 1 - Math.exp(-6 * dt));
      c.speed = damp(c.speed, 6.5, 6, dt);
    } else {
      if (c.turnT === undefined || c.t > c.turnT) {
        c.turnT = c.t + rr(2, 6);
        var a = rnd() * TAU;
        c.target = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
      }
      c.dir.lerp(c.target, 1 - Math.exp(-1.5 * dt));
      c.speed = damp(c.speed, 1.4, 2, dt);
    }
    pos.addScaledVector(c.dir, c.speed * dt);
    var rad = Math.sqrt((pos.x - c.cx) * (pos.x - c.cx) + (pos.z - c.cz) * (pos.z - c.cz));
    if (rad > c.range) {                              // il reste dans son coin
      tmpA.set(c.cx - pos.x, 0, c.cz - pos.z).normalize();
      c.dir.lerp(tmpA, 0.25);
      c.target = tmpA.clone();
    }
    pos.y = floorHeight(pos.x, pos.z) + 0.05;
    c.obj.rotation.y = Math.atan2(c.dir.x, c.dir.z) + Math.PI * 0.5;   // il marche de travers
    c.obj.position.y += Math.abs(Math.sin(c.t * c.speed * 3)) * 0.06;
  }

  /* ---------- anguilles de jardin ---------- */
  function updateEels(c, dt) {
    var eels = c.obj.userData.eels;
    for (var i = 0; i < eels.length; i++) {
      var e = eels[i];
      var d = e.position.distanceTo(player.pos);
      var want = d < 9 ? 0.06 : 1;
      e.userData.out = damp(e.userData.out, want, want < 0.5 ? 7 : 1.6, dt);
      e.scale.y = e.userData.out;
    }
  }

  /* ---------- bénitier ---------- */
  function updateClam(c, dt) {
    var dp = c.obj.position.distanceTo(player.pos);
    var open = dp < 5 ? 0.06 : (0.55 + Math.sin(c.t * 0.5 + c.phase) * 0.35);
    c.open = damp(c.open === undefined ? 0.5 : c.open, open, dp < 5 ? 8 : 1.2, dt);
    c.obj.userData.top.rotation.x = -c.open * 0.75;
    c.obj.userData.top.position.y = 0.04 + c.open * 0.10;
    c.obj.userData.mantle.material.uniforms.uEmissive.value = 0.05 + c.open * 0.2;
  }

  /* ---------- murène ---------- */
  function updateMoray(c, dt) {
    var dp = c.obj.position.distanceTo(player.pos);
    var open = dp < 9 ? 0.8 + Math.sin(c.t * 5) * 0.2 : 0.25 + Math.sin(c.t * 0.8) * 0.2;
    c.open = damp(c.open === undefined ? 0.3 : c.open, open, 6, dt);
    c.obj.userData.jaw.rotation.x = Math.PI - c.open * 0.5;
    c.obj.userData.body.userData.anim.uSwaySpeed.value = dp < 9 ? 3.2 : 1.2;
    if (dp < 3.2 && player.stun <= 0 && G.state === 'play') {
      moraySnap(c);
    }
  }

  /* ---------- baleine : elle traverse le grand bleu, très loin ---------- */
  function updateWhale(c, dt) {
    if (c.wait > 0) {
      c.wait -= dt;
      c.obj.visible = false;
      return;
    }
    c.obj.visible = true;
    c.prog += dt * 0.012;
    if (c.prog > 1) { c.prog = 0; c.wait = rr(70, 140); c.phase = rnd() * TAU; return; }
    var a = c.phase, span = 460;
    var t = (c.prog - 0.5) * span;
    tmpA.set(Math.cos(a) * 190 - Math.sin(a) * t, c.y + Math.sin(c.prog * 3.1) * 8, Math.sin(a) * 190 + Math.cos(a) * t);
    tmpB.copy(tmpA).sub(c.obj.position);
    c.obj.position.copy(tmpA);
    faceDir(c.obj, tmpB, dt, 1.2);
    if (c.prog > 0.42 && c.prog < 0.46 && !c.called) { c.called = true; SND.whale(); }
    if (c.prog < 0.3) c.called = false;
  }



  /* ================================================================== */
  /* LIEUX REMARQUABLES                                                 */
  /* ================================================================== */
  // clear = rayon à laisser libre de massifs autour du lieu
  var PLACES = {
    kelp:   { x: -58, z: 30, clear: 26, nameKey: 'place.kelp' },
    wreck:  { x: 54, z: 50, clear: 24, nameKey: 'place.wreck' },
    cave:   { x: -34, z: -62, clear: 22, nameKey: 'place.cave' },
    vents:  { x: 46, z: -20, clear: 18, nameKey: 'place.vents' },
    dropoff:{ x: 0, z: -88, clear: 30, nameKey: 'place.dropoff' }
  };

  /** Ambiances lumineuses locales : chaque lieu tire la couleur de l'eau. */
  var ZONES = [];
  var ZBASE = {
    deep: new THREE.Color(PAL.deep), mid: new THREE.Color(PAL.mid),
    sky: new THREE.Color(PAL.sky), fog: CFG.FOG_FAR, caust: 1.0
  };
  var _zd = new THREE.Color(), _zm = new THREE.Color(), _zs = new THREE.Color();
  function updateZones(dt) {
    _zd.copy(ZBASE.deep); _zm.copy(ZBASE.mid); _zs.copy(ZBASE.sky);
    var fog = ZBASE.fog, caust = ZBASE.caust;
    for (var i = 0; i < ZONES.length; i++) {
      var z = ZONES[i];
      var dx = player.pos.x - z.x, dz = player.pos.z - z.z;
      var d = Math.sqrt(dx * dx + dz * dz);
      var w = 1 - smoothstep(z.r * 0.45, z.r, d);
      if (w <= 0.001) continue;
      _zd.lerp(z.deep, w); _zm.lerp(z.mid, w); _zs.lerp(z.sky, w);
      fog = lerp(fog, z.fog, w);
      caust = lerp(caust, z.caust, w);
    }
    var k = 1 - Math.exp(-1.6 * dt);
    U.uDeepCol.value.lerp(_zd, k);
    U.uMidCol.value.lerp(_zm, k);
    U.uSkyCol.value.lerp(_zs, k);
    U.uFogFar.value = damp(U.uFogFar.value, fog, 1.6, dt);
    U.uCaustics.value = damp(U.uCaustics.value, caust, 1.6, dt);
  }
  function addZone(x, z, r, deep, mid, sky, fog, caust) {
    ZONES.push({
      x: x, z: z, r: r,
      deep: new THREE.Color(deep), mid: new THREE.Color(mid), sky: new THREE.Color(sky),
      fog: fog, caust: caust
    });
  }

  function buildLandmarks(GEO, encrust, makePal, rockCol) {
    /* ---------------- le tombant : falaise et grand bleu ---------------- */
    (function dropOff() {
      var P = PLACES.dropoff;
      beginBatch();
      var pal = makePal();
      // gros rochers sur la lèvre de la falaise
      for (var i = 0; i < 22; i++) {
        var a = DROP_ANG + rr(-0.72, 0.72);
        var d = 66 + rr(-6, 10);
        var x = Math.cos(a) * d, z = Math.sin(a) * d;
        var sc = rr(0.7, 1.7);
        put('hard', GEO.rock[1 + ((rnd() * 2) | 0)], TRS(x, floorHeight(x, z) - 1, z, 0, rnd() * TAU, 0, sc), rockCol());
        addCollider(x, floorHeight(x, z), z, 4.5 * sc);
        encrust(x, z, 0, 6 * sc, 8, pal, { onSand: true });
      }
      // gorgones géantes tournées vers le courant
      for (var g = 0; g < 14; g++) {
        var ga = DROP_ANG + rr(-0.6, 0.6), gd = 62 + rr(-8, 8);
        var gx = Math.cos(ga) * gd, gz = Math.sin(ga) * gd;
        put('soft', pick(GEO.fan), TRS(gx, floorHeight(gx, gz), gz, 0, ga + Math.PI / 2, 0, rr(1.8, 3.2)),
            pick(PAL.coral), rnd() * TAU);
      }
      endBatch();
      addZone(Math.cos(DROP_ANG) * 96, Math.sin(DROP_ANG) * 96, 66,
              0x05304a, 0x116a8a, 0x4fa8c4, 118, 0.55);
      world.places.dropoff = new THREE.Vector3(Math.cos(DROP_ANG) * 72, 6, Math.sin(DROP_ANG) * 72);
    })();

    /* ---------------- la forêt de laminaires ---------------- */
    (function kelpForest() {
      var P = PLACES.kelp;
      beginBatch();
      var pal = makePal();
      var tall = [kelpGeo(901, 13), kelpGeo(902, 17), kelpGeo(903, 21)];
      for (var i = 0; i < 150; i++) {
        var a = rnd() * TAU, d = Math.sqrt(rnd()) * 22;
        var x = P.x + Math.cos(a) * d, z = P.z + Math.sin(a) * d;
        put('flat', pick(tall), TRS(x, floorHeight(x, z) - 0.3, z, 0, rnd() * TAU, 0, rr(0.8, 1.5)),
            pick(PAL.algae), rnd() * TAU);
      }
      for (var r2 = 0; r2 < 7; r2++) {                    // quelques rochers moussus
        var ra = rnd() * TAU, rd = rnd() * 20;
        var rx = P.x + Math.cos(ra) * rd, rz = P.z + Math.sin(ra) * rd;
        var rs = rr(0.6, 1.2);
        put('hard', GEO.rock[1], TRS(rx, floorHeight(rx, rz) - 1.2, rz, 0, rnd() * TAU, 0, rs), 0x6f7a5c);
        addCollider(rx, floorHeight(rx, rz), rz, 4.4 * rs);
        encrust(rx, rz, 0, 5, 6, pal, { onSand: true });
      }
      endBatch();
      addZone(P.x, P.z, 30, 0x0d4a52, 0x1f8a7a, 0x86e0b4, 92, 0.75);
      world.places.kelp = new THREE.Vector3(P.x, floorHeight(P.x, P.z) + 8, P.z);
    })();

    /* ---------------- l'épave ---------------- */
    (function wreck() {
      var P = PLACES.wreck;
      beginBatch();
      var by = floorHeight(P.x, P.z);
      var parts = [];
      // coque : sphère étirée, proue pointue, pont aplati
      var hull = new THREE.SphereGeometry(1, 26, 16);
      var hp = hull.attributes.position, hv = new THREE.Vector3();
      for (var i = 0; i < hp.count; i++) {
        hv.fromBufferAttribute(hp, i);
        var t = (hv.z + 1) * 0.5;                          // 0 = poupe, 1 = proue
        var taper = t < 0.58 ? (0.72 + t * 0.48) : Math.pow(1 - (t - 0.58) / 0.42, 0.5);
        hp.setXYZ(i, hv.x * taper * 4.0, Math.min(hv.y, 0.40) * 3.2, hv.z * 12.5);
      }
      hull.computeVertexNormals();
      occByHeight(hull, -3.2, 1.2, 0.55);
      // bordage : planches horizontales
      (function planks(g2) {
        ensureAttrs(g2);
        var pa = g2.attributes.position, ca = g2.attributes.aColor;
        for (var q = 0; q < pa.count; q++) {
          var k = 0.86 + 0.24 * (Math.sin(pa.getY(q) * 5.5) * 0.5 + 0.5);
          ca.setXYZ(q, k, k, k);
        }
      })(hull);
      parts.push({ geo: hull, matrix: TRS(0, 2.8, 0, 0.12, 0, 0.30) });
      // pont
      var deck = new THREE.CylinderGeometry(3.2, 3.5, 0.45, 20, 1);
      deck.scale(1, 1, 3.2);
      parts.push({ geo: deck, matrix: TRS(0, 4.0, -0.6, 0.12, 0, 0.30) });
      // cabine
      var cab = new THREE.BoxGeometry(3.0, 2.2, 3.6);
      occByHeight(cab, -1.1, 1.1, 0.5);
      parts.push({ geo: cab, matrix: TRS(0.2, 5.4, -3.0, 0.12, 0, 0.30) });
      // mât brisé
      var mast = new THREE.CylinderGeometry(0.22, 0.30, 9, 8, 1);
      parts.push({ geo: mast, matrix: TRS(-0.6, 8.4, 1.4, 0.45, 0, 0.5) });
      var mast2 = new THREE.CylinderGeometry(0.16, 0.22, 4.5, 7, 1);
      parts.push({ geo: mast2, matrix: TRS(3.4, 2.0, 3.0, 1.3, 0.6, 0.2) });
      var merged = mergeGeos(parts.map(function (q) { return { geo: q.geo, matrix: q.matrix, color: 0x9a8158 }; }));
      var wm = new THREE.Mesh(merged, REEF.hard.mat);
      wm.position.set(P.x, by - 1.2, P.z);
      wm.rotation.y = 0.7;
      wm.rotation.z = 0.22;
      wm.scale.setScalar(1.35);
      castShadow(wm);
      scene.add(wm);
      // collisions grossières le long de la coque
      for (var c = -1; c <= 1; c++) {
        addCollider(P.x + Math.sin(0.7) * c * 7, by + 2.6, P.z + Math.cos(0.7) * c * 7, 5.4);
      }
      addCollider(P.x + Math.sin(0.7) * -3.6, by + 5.6, P.z + Math.cos(0.7) * -3.6, 3.2);
      pushShadow(P.x, P.z, 17);
      // l'épave est colonisée
      var pal = makePal();
      for (var e = 0; e < 18; e++) {
        var ea = rnd() * TAU, ed = Math.sqrt(rnd()) * 6.5;
        encrust(P.x + Math.cos(ea) * ed, P.z + Math.sin(ea) * ed, by + rr(3.2, 5.2), 1.0, 1, pal, {});
      }

  /* ---------- petits effets : bulles, éclats ---------- */
  var fx = [];
  function initFx() {
    for (var i = 0; i < 60; i++) {

        map: TEX.bubble, transparent: true, depthWrite: false, opacity: 0
      }));
