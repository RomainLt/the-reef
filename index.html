  }
  function spawnFx(pos, count, opt) {
    opt = opt || {};
    var made = 0;
    for (var i = 0; i < fx.length && made < count; i++) {
      var f = fx[i];
      if (f.life > 0) continue;
      made++;
      f.sp.position.copy(pos).add(new THREE.Vector3(rr(-0.4, 0.4), rr(-0.3, 0.3), rr(-0.4, 0.4)).multiplyScalar(opt.spread || 1));
      f.vel.set(rr(-1, 1), rr(0.8, 2.6), rr(-1, 1)).multiplyScalar(opt.speed || 1);
      f.max = opt.life || rr(0.9, 1.8);
      f.life = f.max;
      f.s0 = (opt.size || 0.3) * rr(0.6, 1.4);
      f.s1 = f.s0 * (opt.grow || 1.4);
      f.sp.material.map = opt.soft ? TEX.soft : TEX.bubble;
      f.sp.material.color.set(opt.color !== undefined ? opt.color : 0xffffff);
      f.sp.material.blending = opt.soft ? THREE.AdditiveBlending : THREE.NormalBlending;
      f.sp.visible = true;
    }
  }
  function updateFx(dt) {
    for (var i = 0; i < fx.length; i++) {
      var f = fx[i];
      if (f.life <= 0) continue;
      f.life -= dt;
      if (f.life <= 0) { f.sp.visible = false; f.sp.material.opacity = 0; continue; }
      var k = 1 - f.life / f.max;
      f.vel.y += dt * 1.2;
      f.vel.x *= (1 - dt * 1.2); f.vel.z *= (1 - dt * 1.2);
      f.sp.position.addScaledVector(f.vel, dt);
      var sc = lerp(f.s0, f.s1, k);
      f.sp.scale.set(sc, sc, sc);
      f.sp.material.opacity = Math.sin((1 - k) * Math.PI * 0.85) * 0.95;
    }
  }

  /* ================================================================== */
  /* LE JOUEUR ET LA CAMÉRA                                             */
  /* ================================================================== */
  var UP = new THREE.Vector3(0, 1, 0);
  var player = {
    obj: null, pos: new THREE.Vector3(0, 0, 0), vel: new THREE.Vector3(),
    stun: 0, dash: 0, flap: 0, turn: 0, quat: new THREE.Quaternion()
  };
  var cam = { yaw: 0, pitch: -0.10, dist: 5.8, pos: new THREE.Vector3(), look: new THREE.Vector3(), baseFov: 62 };
  var keys = {}, mouseDX = 0, mouseDY = 0, dragging = false, locked = false;
  var TOUCH = false;   // passe à vrai au premier appui : voir goTouch()
  var tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpC = new THREE.Vector3();
  var tmpD = new THREE.Vector3(), tmpE = new THREE.Vector3();
  var tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion();

  function camForward(out) {
    var cp = Math.cos(cam.pitch);
    return out.set(Math.sin(cam.yaw) * cp, Math.sin(cam.pitch), Math.cos(cam.yaw) * cp).normalize();
  }

  function buildPlayer() {
    player.obj = buildClownfish();
    player.obj.scale.setScalar(0.85);
    castShadow(player.obj);
    scene.add(player.obj);
    resetPlayer();
  }
  function resetPlayer() {
    var ox = SPAWN.x - world.home.x, oz = SPAWN.z - world.home.z;
    player.pos.set(SPAWN.x, world.home.y + 4.2, SPAWN.z);
    player.vel.set(0, 0, 0);
    player.stun = 0; player.dash = 0;
    player.lastYaw = undefined;
    cam.yaw = Math.atan2(-ox, -oz); cam.pitch = -0.13;
    camForward(tmpA);
    cam.pos.copy(player.pos).addScaledVector(tmpA, -cam.dist);
    player.obj.position.copy(player.pos);
  }

  function keyDown(codes) {
    for (var i = 0; i < codes.length; i++) if (keys[codes[i]]) return true;
    return false;
  }

  /** Première intersection rayon/obstacle (sphère ou disque). -1 si aucune. */
  function rayHit(o, d, maxT, c) {
    var px = o.x - c.x, py = o.y - c.y, pz = o.z - c.z;
    if (c.h === undefined) {
      var er = c.r + 0.35;
      var b = px * d.x + py * d.y + pz * d.z;
      var q = px * px + py * py + pz * pz - er * er;
      var disc = b * b - q;
      if (disc <= 0) return -1;
      return -b - Math.sqrt(disc);
    }
    var r = c.r + 0.3, h = c.h + 0.3;
    var t0 = 0, t1 = maxT;
    var a = d.x * d.x + d.z * d.z;
    var bb = px * d.x + pz * d.z;
    var cc2 = px * px + pz * pz - r * r;
    if (a > 1e-8) {
      var dq = bb * bb - a * cc2;
      if (dq < 0) return -1;
      var sq = Math.sqrt(dq);
      t0 = Math.max(t0, (-bb - sq) / a);
      t1 = Math.min(t1, (-bb + sq) / a);
    } else if (cc2 > 0) return -1;
    if (Math.abs(d.y) > 1e-8) {
      var ta = (-h - py) / d.y, tb = (h - py) / d.y;
      if (ta > tb) { var sw = ta; ta = tb; tb = sw; }
      t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
    } else if (Math.abs(py) > h) return -1;
    if (t1 < t0 || t1 < 0) return -1;
    return t0;
  }

  function updatePlayer(dt) {
    var sens = 0.0026;
    cam.yaw -= mouseDX * sens;
    cam.pitch = clamp(cam.pitch - mouseDY * sens, -1.28, 1.05);
    mouseDX = 0; mouseDY = 0;

    var fwd = camForward(tmpA);
    var right = tmpB.crossVectors(fwd, UP).normalize();

    var inZ = (keyDown(['KeyW', 'KeyZ', 'ArrowUp']) ? 1 : 0) - (keyDown(['KeyS', 'ArrowDown']) ? 1 : 0);
    var inX = (keyDown(['KeyD', 'ArrowRight']) ? 1 : 0) - (keyDown(['KeyA', 'KeyQ', 'ArrowLeft']) ? 1 : 0);
    var inY = (keyDown(['Space']) ? 1 : 0) - (keyDown(['ControlLeft', 'ControlRight', 'KeyX', 'KeyC']) ? 1 : 0);
    var wantDash = keyDown(['ShiftLeft', 'ShiftRight']) && inZ > 0;

    if (player.stun > 0) { player.stun -= dt; inZ = inX = inY = 0; wantDash = false; }
    if (Q.dialog) { inZ = inX = inY = 0; wantDash = false; }

    player.dash = damp(player.dash, wantDash ? 1 : 0, wantDash ? 7 : 3.5, dt);

    var desired = tmpC.set(0, 0, 0)
      .addScaledVector(fwd, inZ)
      .addScaledVector(right, inX)
      .addScaledVector(UP, inY * 0.85);
    if (desired.lengthSq() > 1) desired.normalize();
    var speed = CFG.PLAYER_SPEED * (1 + player.dash * (CFG.DASH_MULT - 1));
    desired.multiplyScalar(speed);

    /* Le courant emporte le joueur, mais ajouté à la vitesse **visée** plutôt
       qu'à la position : en nageant on le compense sans y penser, à l'arrêt on
       dérive avec l'eau. Volontairement faible (~0,35 u/s contre 15,5 de nage).
       Nul à l'abri d'une anémone — c'est vrai physiquement, et surtout la quête
       « reste caché 8 s » a un rayon de 6,5 u : une dérive constante l'aurait
       fait échouer sans que le joueur comprenne pourquoi. */
    var flow = inRefuge() ? 0 : CFG.CURRENT;
    var accel = desired.lengthSq() > 0.01 ? 3.4 : 1.9;
    player.vel.x = damp(player.vel.x, desired.x + U.uCurrent.value.x * flow, accel, dt);
    player.vel.y = damp(player.vel.y, desired.y, accel, dt);
    player.vel.z = damp(player.vel.z, desired.z + U.uCurrent.value.y * flow, accel, dt);
    player.pos.addScaledVector(player.vel, dt);

    // --- obstacles : sphères (rochers, coraux) et disques (étagères)
    // deux passes : dans un massif dense les obstacles se chevauchent
    for (var pass = 0; pass < 2; pass++)
    for (var i = 0; i < world.colliders.length; i++) {
      var c = world.colliders[i];
      var dx = player.pos.x - c.x, dy = player.pos.y - c.y, dz = player.pos.z - c.z;
      if (c.h === undefined) {
        var d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < c.r * c.r && d2 > 0.0001) {
          var d = Math.sqrt(d2), nx = dx / d, ny = dy / d, nz = dz / d;
          var push = c.r - d;
          player.pos.x += nx * push; player.pos.y += ny * push; player.pos.z += nz * push;
          var vn = player.vel.x * nx + player.vel.y * ny + player.vel.z * nz;
          if (vn < 0) { player.vel.x -= vn * nx; player.vel.y -= vn * ny; player.vel.z -= vn * nz; }
        }
      } else {
        var dh = Math.sqrt(dx * dx + dz * dz);
        if (dh < c.r && Math.abs(dy) < c.h) {
          var overH = c.r - dh, overV = c.h - Math.abs(dy);
          if (overV <= overH || dh < 0.001) {
            var sg = dy >= 0 ? 1 : -1;
            player.pos.y += sg * overV;
            if (player.vel.y * sg < 0) player.vel.y = 0;
          } else {
            player.pos.x += dx / dh * overH; player.pos.z += dz / dh * overH;
            var vt = (player.vel.x * dx + player.vel.z * dz) / dh;
            if (vt < 0) { player.vel.x -= vt * dx / dh; player.vel.z -= vt * dz / dh; }
          }
        }
      }
    }
    // --- sol et surface
    var fy = floorHeight(player.pos.x, player.pos.z) + 1.0;
    if (player.pos.y < fy) { player.pos.y = fy; if (player.vel.y < 0) player.vel.y *= -0.15; }
    var maxY = CFG.WATER_Y - 1.4;
    if (player.pos.y > maxY) {
      player.pos.y = maxY;
      if (player.vel.y > 0) { player.vel.y *= -0.2; spawnFx(player.pos, 3, { speed: 1.4, size: 0.35 }); }
    }
    // --- bord du récif : on est doucement ramené vers le récif
    var rad = Math.sqrt(player.pos.x * player.pos.x + player.pos.z * player.pos.z);
    if (rad > CFG.REEF_R) {
      var k = (rad - CFG.REEF_R) * 0.12;
      player.pos.x -= player.pos.x / rad * k;
      player.pos.z -= player.pos.z / rad * k;
      showHint(T('hint.edge'), 2.2);
    }

    // --- orientation : le poisson suit sa vitesse, s'incline dans les virages
    var sp = player.vel.length();
    var dir = tmpA;
    if (sp > 0.8) dir.copy(player.vel).divideScalar(sp);
    else camForward(dir);
    /* Le virage se lit sur le **retard** d'un cap lissé par rapport au cap
       réel. Avant, c'était `dYaw / dt` : une différence d'angle minuscule
       divisée par un dt qui varie d'une image à l'autre, donc un signal qui
       changeait de signe cinq fois par seconde (mesuré). Il pilote le roulis
       et la courbure du corps — deux endroits où le bruit se voit. */
    var yawNow = Math.atan2(dir.x, dir.z);
    if (player.headYaw === undefined) player.headYaw = yawNow;
    var dYaw = yawNow - player.headYaw;
    while (dYaw > Math.PI) dYaw -= TAU;
    while (dYaw < -Math.PI) dYaw += TAU;
    player.headYaw += dYaw * (1 - Math.exp(-3.2 * dt));
    player.turn = damp(player.turn, clamp(dYaw * 1.6, -1, 1), 7, dt);

    var upv = tmpB.copy(UP).applyAxisAngle(dir, -player.turn * 0.85);
    tmpM.lookAt(dir, new THREE.Vector3(0, 0, 0), upv);
    tmpQ.setFromRotationMatrix(tmpM);
    player.obj.quaternion.slerp(tmpQ, 1 - Math.exp(-9 * dt));
    player.obj.position.copy(player.pos);

    // --- animation du corps
    /* Cadence bornée : à pleine vitesse l'ancienne formule montait à 5 battements
       par seconde, ce qui se lit comme un tremblement même avec une phase
       propre. Une nage se lit vers 1,5–2 Hz, avec plus d'amplitude. */
    var beat = 2.8 + Math.min(sp, 16) * 0.52 + player.dash * 3.2;
    var anim = player.obj.userData.body.userData.anim;
    anim.uSwaySpeed.value = beat;
    anim.uSwayAmp.value = 0.062 + Math.min(sp, 20) * 0.0062 + player.dash * 0.035;
    anim.uBend.value = damp(anim.uBend.value, -player.turn * 0.16, 8, dt);
    player.flap += dt * (3 + sp * 0.5 + player.dash * 5);
    var pect = player.obj.userData.pect;
    pect[0].rotation.z = 0.2 + Math.sin(player.flap) * 0.55;
    pect[1].rotation.z = -0.2 - Math.sin(player.flap + 0.4) * 0.55;

    // --- bulles quand on fonce
    if (player.dash > 0.55 && rnd() < dt * 26) {
      tmpA.copy(player.pos).addScaledVector(dir, -1.1);
      spawnFx(tmpA, 1, { speed: 0.7, size: 0.16, life: rr(0.6, 1.1), grow: 1.2 });
    }

    // --- caméra suiveuse
    var fwd2 = camForward(tmpA);
    var side = tmpD.crossVectors(fwd2, UP).normalize();
    var want = tmpB.copy(player.pos).addScaledVector(fwd2, -cam.dist)
      .addScaledVector(UP, 0.85).addScaledVector(side, 0.95);
    // si un obstacle est entre le poisson et la caméra, on raccourcit la perche
    tmpE.copy(want).sub(player.pos);
    var maxD = tmpE.length() || 1;
    tmpE.divideScalar(maxD);
    var allowed = maxD;
    for (var j = 0; j < world.colliders.length; j++) {
      var th = rayHit(player.pos, tmpE, allowed, world.colliders[j]);
      if (th > 0.35 && th < allowed) allowed = th;
    }
    want.copy(player.pos).addScaledVector(tmpE, Math.max(allowed, 1.7));
    var camFloor = floorHeight(want.x, want.z) + 1.4;
    if (want.y < camFloor) want.y = camFloor;
    if (want.y > CFG.WATER_Y - 0.6) want.y = CFG.WATER_Y - 0.6;
    var lambda = 9;
    cam.pos.x = damp(cam.pos.x, want.x, lambda, dt);
    cam.pos.y = damp(cam.pos.y, want.y, lambda, dt);
    cam.pos.z = damp(cam.pos.z, want.z, lambda, dt);
    camera.position.copy(cam.pos);
    cam.look.copy(player.pos).addScaledVector(camForward(tmpA), 3.4)
      .addScaledVector(tmpD, 0.62).addScaledVector(player.vel, 0.05);
    camera.lookAt(cam.look);
    var fov = cam.baseFov + player.dash * 7;
    if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }
  }

  function updateSchools(dt) {
    for (var s = 0; s < world.schools.length; s++) {
      var sc = world.schools[s];
      sc.t += dt;
      var a = sc.t * sc.speed + sc.phase;
      var cx = Math.cos(a) * sc.radius, cz = Math.sin(a) * sc.radius;
      var cy = sc.y + Math.sin(sc.t * 0.21 + sc.phase) * 5.0;
      var floorY = floorHeight(cx, cz) + 3.5;
      if (cy < floorY) cy = floorY;
      for (var i = 0; i < sc.fish.length; i++) {
        var f = sc.fish[i];
        var off = f.userData.off;
        var wob = Math.sin(U.uTime.value * 1.4 + f.userData.ph) * 0.7;
        tmpA.set(cx + off.x + wob, cy + off.y + wob * 0.3, cz + off.z - wob);
        // fuite si le joueur approche
        tmpB.copy(f.position).sub(player.pos);
        var d2 = tmpB.lengthSq();
        if (d2 < 90) {
          var d = Math.sqrt(d2) || 1;
          f.userData.flee.copy(tmpB).divideScalar(d).multiplyScalar((9.5 - d) * 1.5);
        }
        f.userData.flee.multiplyScalar(1 - Math.min(dt * 1.6, 1));
        tmpA.add(f.userData.flee);
        var k = 1 - Math.exp(-2.6 * dt);
        f.position.lerp(tmpA, k);
        tmpB.copy(f.position).sub(f.userData.prev);
        f.userData.prev.copy(f.position);
        if (tmpB.lengthSq() > 1e-6) {
          tmpC.copy(f.position).add(tmpB.multiplyScalar(30));
          f.lookAt(tmpC);
        }
      }
    }
  }

  function updateJellies(dt) {
    for (var i = 0; i < world.jellies.length; i++) {
      var j = world.jellies[i];
      var t = U.uTime.value * 0.9 + j.userData.ph;
      var pulse = Math.sin(t * 1.7);
      j.userData.bell.scale.set(1 + pulse * 0.10, 1 - pulse * 0.16, 1 + pulse * 0.10);
      j.position.addScaledVector(j.userData.drift, dt);
      j.position.y = j.userData.y0 + Math.sin(t * 1.7 - 0.6) * 1.5 + Math.sin(t * 0.3) * 2.2;
      var r = Math.sqrt(j.position.x * j.position.x + j.position.z * j.position.z);
      if (r > CFG.REEF_R - 8 || r < 12) j.userData.drift.multiplyScalar(-1);
      var fl = floorHeight(j.position.x, j.position.z) + 4;
      if (j.position.y < fl) { j.userData.y0 += (fl - j.position.y); }
      if (player.stun <= 0 && j.position.distanceToSquared(player.pos) < 7.5 * j.scale.x * j.scale.x) sting(j);
    }
  }

  function updateTurtle(dt) {
    var t = world.turtle;
    if (!t) return;
    t.userData.t += dt;
    var a = t.userData.t * 0.028;
    var R = 96;
    var x = Math.cos(a) * R, z = Math.sin(a) * R;
    var y = 24 + Math.sin(t.userData.t * 0.07) * 8;
    tmpA.set(x, y, z);
    tmpB.copy(tmpA).sub(t.position);
    t.position.copy(tmpA);
    if (tmpB.lengthSq() > 1e-6) t.lookAt(tmpC.copy(tmpA).add(tmpB.multiplyScalar(40)));
    var fl = t.userData.flippers, ph = t.userData.t * 1.5;
    for (var i = 0; i < fl.length; i++) {
      var s = i % 2 === 0 ? 1 : -1;
      fl[i].rotation.z = (i < 2 ? Math.sin(ph) * 0.5 : Math.sin(ph + 0.7) * 0.25) * s + 0.1 * s;
      fl[i].rotation.x = Math.cos(ph + i) * 0.18;
    }
  }

     * constante de temps fait tout le lissage. Limité à ~8 fois par seconde,

    var len = Math.sqrt(dx * dx + dy * dy) || 1;

  function shellGeo(seed) {
    var g = new THREE.SphereGeometry(0.42, 16, 10, 0, TAU, 0, Math.PI * 0.55);
    var p = g.attributes.position, v = new THREE.Vector3();
    for (var i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      var a = Math.atan2(v.z, v.x);
      var rid = 1 + Math.cos(a * 9) * 0.10;
      p.setXYZ(i, v.x * rid * 1.1, v.y * 0.42, v.z * rid);
    }
    g.computeVertexNormals();
    occByHeight(g, 0, 0.2, 0.5);
    return g;
  }

        baseHook: '  base = mix(base, uColorB, smoothstep(-0.1, 0.2, vObj.y));\n  emis += 0.25;',
        spec: 0.7, rim: 0.7, bump: 0.4
      });
      halo = 0xffd0c0;
    } else if (kind === 'urchin') {
      core = toonMesh(urchinGeo(7), { color: 0x6b4fa8, colorB: 0xc0a8ff, spec: 0.4, rim: 0.5, emissive: 0.10 });
      halo = 0xc0a8ff;
    } else if (kind === 'treasure') {
      core = toonMesh(new THREE.SphereGeometry(0.56, 18, 13), {
        color: 0xffe9a8, colorB: 0xffb840,
        baseHook: '  base = mix(base, uColorB, smoothstep(0.2, -0.4, vObj.y));\n  emis += 0.9;',
        spec: 2.2, rim: 1.0, emissive: 0.9

      halo = 0xffd88a;

  /** Un point est-il libre de tout obstacle ? */
  function isClear(v, pad) {
    pad = pad || 1.2;
    for (var i = 0; i < world.colliders.length; i++) {
      var c = world.colliders[i];
      var dx = v.x - c.x, dy = v.y - c.y, dz = v.z - c.z;
      if (c.h === undefined) {
        if (dx * dx + dy * dy + dz * dz < (c.r + pad) * (c.r + pad)) return false;
      } else if (dx * dx + dz * dz < (c.r + pad) * (c.r + pad) && Math.abs(dy) < c.h + pad) return false;
    }
    return true;
  }

    for (var k = 0; k < 50; k++) {

      var v = new THREE.Vector3(x, y === null ? floorHeight(x, z) + rr(1.3, 3.2) : y, z);
      if (isClear(v, pad)) return v;
    }
    return new THREE.Vector3(cx, y === null ? floorHeight(cx, cz) + 6 : y + 4, cz);
  }

    o.userData.kind = kind;
    o.userData.tag = opt.tag;

  function updatePickups(dt) {
    var t = U.uTime.value;
    for (var i = 0; i < world.pickups.length; i++) {
      var o = world.pickups[i];
      if (o.userData.taken) {
        if (o.userData.pushT > 0) {                    // l'oursin poussé roule sur le sable
          o.userData.pushT -= dt;
          o.position.addScaledVector(o.userData.push, dt);
          o.userData.push.multiplyScalar(1 - dt * 1.6);
          o.position.y = damp(o.position.y, floorHeight(o.position.x, o.position.z) + 0.35, 3, dt);
          o.rotation.x += dt * 4;
          if (o.userData.pushT <= 0) o.visible = false;
        }
        continue;
      }
      var k = o.userData.kind;
      if (k !== 'urchin') {
        o.position.y = o.userData.base.y + Math.sin(t * 1.3 + o.userData.phase) * 0.30;
        o.rotation.y += dt * 0.9;
      }
      var hs = (k === 'urchin' ? 2.0 : 3.0) + Math.sin(t * 2.2 + o.userData.phase) * 0.3;
      o.userData.halo.scale.setScalar(hs);
      if (o.position.distanceToSquared(player.pos) < o.userData.radius * o.userData.radius) {
        takePickup(o);
      }
    }
  }

  function takePickup(o) {
    o.userData.taken = true;
    var k = o.userData.kind;
    if (k === 'urchin') {                              // poussé : il roule et s'éloigne
      o.userData.push = o.position.clone().sub(player.pos).setY(0.15).normalize().multiplyScalar(7);
      o.userData.pushT = 1.6;
      o.userData.halo.visible = false;
    } else o.visible = false;
    flashCollect = 0.5;
    spawnFx(o.position, 12, {
      speed: 1.5, size: 0.3, soft: true, life: 0.9, grow: 2.2, spread: 1.4,
      color: k === 'treasure' ? 0xffe0a0 : 0xcaf4ff
    });
    spawnFx(o.position, 5, { speed: 1.1, size: 0.22, life: 1.2 });
    Q.onPickup(k, o);
  }

  /* ================================================================== */

  function initQuests() {
    Q.defs = questDefs();
    Q.total = Q.defs.length;
    $('#pearls small').textContent = T('hud.quests', { n: Q.total });
    for (var i = 0; i < Q.defs.length; i++) {
      var d = Q.defs[i];
      d.state = i === 0 ? 'available' : 'locked';
      d.progress = 0;
      Q.byId[d.id] = d;
      Q.order.push(d.id);
    }
    updateJournal();
  }

  /** Une fois la première quête finie, tout le récif s'ouvre. */
  function unlockAll() {
    for (var i = 0; i < Q.defs.length; i++) {
      var d = Q.defs[i];
      if (d.state === 'locked' && !d.late) d.state = 'available';
    }
    var cens = Q.byId.census;
    if (cens && cens.state === 'locked' && Q.done >= 4) cens.state = 'available';
  }

  /** Nom affiché d'un habitant ou d'un lieu — résolu au moment de l'affichage,
      pour qu'un changement de langue renomme tout le monde d'un coup. */
  function npcName(o) { return o && o.nameKey ? T(o.nameKey) : T('jr.someone'); }

  /** Quête proposée / à rendre par ce PNJ. */
  function questForNpc(id) {
    for (var i = 0; i < Q.defs.length; i++) {
      var d = Q.defs[i];
      if (d.npc !== id) continue;
      if (d.state === 'active' && d.progress >= d.target) return d;   // à rendre
      if (d.state === 'available') return d;
    }
    return null;
  }
  function npcMark(id) {
    var q = questForNpc(id);
    if (!q) return null;
    return q.state === 'active' ? '?' : '!';
  }


  /* ---------- marqueurs au-dessus des PNJ ---------- */
  function markTexture(ch, col) {
    return canvasTex(64, function (g, s) {
      g.clearRect(0, 0, s, s);
      g.font = 'bold 52px "Baloo 2", sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 8; g.strokeStyle = '#08202e';
      g.strokeText(ch, s / 2, s / 2 + 2);
      g.fillStyle = col;
      g.fillText(ch, s / 2, s / 2 + 2);
    });
  }
  function attachMarks() {
    TEX.mark1 = markTexture('!', '#ffd98a');
    TEX.mark2 = markTexture('?', '#9fe8ff');
    for (var id in world.npcs) {
      var c = world.npcs[id];
      if (!c.obj || c.noTalk) continue;
      var sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: TEX.mark1, transparent: true, depthWrite: false, depthTest: false
      }));
      sp.scale.setScalar(1.5);
      sp.position.y = c.markY || 2.4;
      sp.renderOrder = 20;
      sp.visible = false;
      c.obj.add(sp);
      c.mark = sp;
    }
  }
  function updateMarks(dt) {
    var t = U.uTime.value;
    for (var id in world.npcs) {
      var c = world.npcs[id];
      if (!c.mark) continue;
      var m = npcMark(id);
      c.mark.visible = !!m && !Q.dialog;
      if (m) {
        c.mark.material.map = m === '!' ? TEX.mark1 : TEX.mark2;
        c.mark.position.y = (c.markY || 2.4) + Math.sin(t * 2.4 + (c.phase || 0)) * 0.18;
        var sc = 1.4 / Math.max(c.obj.scale.x, 0.001);
        c.mark.scale.setScalar(sc);
      }
    }
  }

  /* ---------- dialogues ---------- */
  // (les petites phrases d'ambiance vivent dans TXT, clés `idle.<pnj>`)

  function startDialog(c) {
    var q = questForNpc(c.id);
    var mode = 'idle', lines;
    /* Les lignes sont fabriquées par une fonction gardée sur le dialogue, et
       pas seulement copiées : changer de langue au milieu d'une conversation
       doit pouvoir les réécrire. */
    var linesFor = function () {
      if (q && q.state === 'available') return q.lines();
      if (q && q.state === 'active') return q.doneLines();
      return [T(TXT['idle.' + c.id] ? 'idle.' + c.id : 'idle.none')];
    };
    if (q && q.state === 'available') mode = 'give';
    else if (q && q.state === 'active') mode = 'turnin';
    lines = linesFor();
    Q.dialog = { npc: c, q: q, mode: mode, lines: lines, linesFor: linesFor,
                 i: 0, shown: '', full: '', t: 0 };
    elDialog.classList.add('on');
    showDialogLine();
    SND.talk();
  }
  function showDialogLine() {
    var d = Q.dialog;
    elWho.textContent = npcName(d.npc);
    d.full = d.lines[d.i];
    d.shown = ''; d.t = 0;
    elTxt.textContent = '';
    var quoi = T(d.i < d.lines.length - 1 ? 'hud.more' : (d.mode === 'give' ? 'hud.accept' : 'hud.close'));
    $('#dialog .more').textContent = T(TOUCH ? 'hud.tapPrefix' : 'hud.keyPrefix') + quoi;
  }
  function advanceDialog() {
    var d = Q.dialog;
    if (!d) return;
    if (d.shown.length < d.full.length) { d.shown = d.full; elTxt.textContent = d.full; return; }
    d.i++;
    if (d.i < d.lines.length) { showDialogLine(); SND.talk(); return; }
    Q.dialog = null;
    elDialog.classList.remove('on');
    if (d.mode === 'give') acceptQuest(d.q);
    else if (d.mode === 'turnin') completeQuest(d.q);
  }
  function updateDialog(dt) {
    var d = Q.dialog;
    if (!d) return;
    if (d.shown.length < d.full.length) {
      d.t += dt;
      var n = Math.min(d.full.length, Math.floor(d.t * 58));
      if (n > d.shown.length) { d.shown = d.full.slice(0, n); elTxt.textContent = d.shown; }
    }
  }

  function acceptQuest(q) {
    q.state = 'active';
    q.progress = 0;
    if (q.start) q.start(q);
    showToast(T('obj.newQuest'));
    showHint(q.title(), 4.5);
    SND.quest();
    updateJournal(); refreshObjective(true);
  }
  function completeQuest(q) {
    q.state = 'done';
    Q.done++;
    elPearls.textContent = Q.done;
    showToast(T('obj.questDone'));
    SND.pickup(Math.min(Q.done + 2, 7));
    if (q.id === 'pearls') unlockAll();
    if (Q.done >= 3) { var c = Q.byId.census; if (c && c.state === 'locked') c.state = 'available'; }
    updateJournal(); refreshObjective(true);
    if (Q.done >= Q.total) win();
  }

  Q.onPickup = function (kind, o) {
    var q = Q.byId[o.userData.tag];
    if (q && q.state === 'active' && q.progress < q.target) {
      q.progress++;
      SND.pickup(Math.min(q.progress - 1, 7));
      if (q.progress >= q.target) {
        var who = world.npcs[q.npc];
        showToast(T('obj.report', { name: who ? npcName(who) : T('obj.friend') }));
      } else {
        showToast(q.progress + ' / ' + q.target);
      }
      updateJournal(); refreshObjective(true);
    }
  };

  /* ---------- suivi des quêtes ---------- */
  function updateQuests(dt) {
    var q;
    // escorte du bébé tortue
    q = Q.byId.escort;
    if (q && q.state === 'active' && Q.babyTurtle && q.progress < 1) {
      var d = Q.babyTurtle.obj.position.distanceTo(world.places.dropoff);
      if (d < 16) {
        q.progress = 1;
        Q.babyTurtle.follow = false;
        Q.babyTurtle.cx = world.places.dropoff.x;
        Q.babyTurtle.cz = world.places.dropoff.z;
        Q.babyTurtle.r = 8;
        showToast(T('toast.arrived'));
        refreshObjective(true); updateJournal();
      }
    }
    // se cacher dans une anémone
    q = Q.byId.hide;
    if (q && q.state === 'active' && q.progress < 1) {
      if (inRefuge()) {
        Q.hideT += dt;
        if (Q.hideT >= 8) { q.progress = 1; showToast(T('toast.wellDone')); updateJournal(); }
      } else if (Q.hideT > 0) {
        Q.hideT = Math.max(0, Q.hideT - dt * 2);
      }
    }
    // recensement
    q = Q.byId.census;
    if (q && q.state === 'active' && q.progress < q.target) {
      var n = 0, k;
      for (var i = 0; i < world.critters.length; i++) {
        var c = world.critters[i];
        if (!c.obj || !c.obj.visible) continue;
        if (c.obj.position.distanceToSquared(player.pos) < 100) Q.seen[c.id || c.kind] = 1;
      }
      for (var s2 = 0; s2 < world.schools.length; s2++) {
        var sc = world.schools[s2];
        if (sc.fish[0] && sc.fish[0].position.distanceToSquared(player.pos) < 110) Q.seen['banc' + s2] = 1;
      }
      for (var j = 0; j < world.jellies.length; j++) {
        if (world.jellies[j].position.distanceToSquared(player.pos) < 110) Q.seen.meduse = 1;
      }
      for (k in Q.seen) n++;
      if (n !== q.progress) {
        q.progress = Math.min(n, q.target);
        if (q.progress >= q.target) showToast(T('toast.eightKinds'));
        updateJournal(); refreshObjective(true);
      }
    }
  }

  /* ---------- interaction ---------- */
  function updateInteract(dt) {
    if (Q.dialog) { elPrompt.classList.remove('on'); return; }
    var best = null, bd = 49;
    for (var id in world.npcs) {
      var c = world.npcs[id];
      if (!c.obj || c.noTalk) continue;
      var d = c.obj.position.distanceToSquared(player.pos);
      if (d < bd) { bd = d; best = c; }
    }
    Q.near = best;
    if (best) {
      var mk = npcMark(best.id);
      var verbe = T(mk === '!' ? 'hud.listenTo' : 'hud.talkTo', { name: npcName(best) });
      elPrompt.innerHTML = TOUCH ? ('💬 ' + verbe) : ('<kbd>E</kbd> ' + verbe);
      elPrompt.classList.add('on');
    } else elPrompt.classList.remove('on');
  }

  /* ---------- journal et objectif ---------- */
  function stripTags(h) { return String(h).replace(/<[^>]*>/g, ''); }
  function updateJournal() {
    var html = '';
    for (var i = 0; i < Q.order.length; i++) {
      var q = Q.byId[Q.order[i]];
      if (q.state === 'locked') continue;
      var who = world.npcs[q.npc];
      var nom = npcName(who);
      var line = q.state === 'done' ? T('jr.done')
        : (q.state === 'active' ? (q.progress >= q.target
            ? T('jr.report', { name: nom })
            : stripTags(q.objective(q)))
          : T('jr.pickUp', { name: nom }));
      html += '<li' + (q.state === 'done' ? ' class="done"' : '') + '><b>' + q.title() + '</b>' + line + '</li>';
    }
    elJList.innerHTML = html || '<li class="empty">' + T('jr.empty') + '</li>';
  }
  var _objTxt = '';
  function refreshObjective(force) {
    var q = null;
    for (var i = 0; i < Q.order.length; i++) {
      var d = Q.byId[Q.order[i]];
      if (d.state === 'active') { q = d; break; }
    }
    Q.active = q;
    if (!q) {
      if (_objTxt !== '') { _objTxt = ''; elObj.classList.remove('on'); }
      return;
    }
    var who = world.npcs[q.npc];
    var txt = q.progress >= q.target
      ? T('obj.goSee', { name: npcName(who) })
      : q.objective(q);
    if (txt !== _objTxt || force) {
      _objTxt = txt;
      elObj.innerHTML = txt;
      elObj.classList.add('on');
    }
  }
  /** Cible de la flèche dorée. */
  function arrowTarget() {
    var q = Q.active;
    if (!q) {
      var best = null, bd = 1e9;
      for (var id in world.npcs) {
        var c = world.npcs[id];
        if (!c.obj || c.noTalk || !npcMark(id)) continue;
        var d = c.obj.position.distanceToSquared(player.pos);
        if (d < bd) { bd = d; best = c.obj.position; }
      }
      return best;
    }
    if (q.progress >= q.target) {
      var w = world.npcs[q.npc];
      return w && w.obj ? w.obj.position : null;
    }
    var near = null, nd = 1e9;
    for (var i = 0; i < world.pickups.length; i++) {
      var o = world.pickups[i];
      if (o.userData.taken || o.userData.tag !== q.id) continue;
      var dd = o.position.distanceToSquared(player.pos);
      if (dd < nd) { nd = dd; near = o.position; }
    }
    if (near) return near;
    if (q.marker) { var m = q.marker(q); if (m) return m; }
    var w2 = world.npcs[q.npc];
    return w2 && w2.obj ? w2.obj.position : null;
  }

  /* ================================================================== */
  /* RÈGLES DU JEU                                                      */
  /* ================================================================== */
  function sting(j) {
    player.stun = 0.9;
    flashSting = 1;
    tmpA.copy(player.pos).sub(j.position).normalize();
    player.vel.copy(tmpA).multiplyScalar(16);
    player.pos.addScaledVector(tmpA, 0.6);
    SND.sting();
    showToast(T('hint.ouch'));
    showHint(T('hint.jelly'), 3);
    spawnFx(player.pos, 8, { speed: 1.6, size: 0.3, soft: true, color: 0xd9a0ff, life: 0.7, grow: 2 });
    elFlash.style.opacity = 0.85;
    setTimeout(function () { elFlash.style.opacity = 0; }, 160);
  }

  function win() {
    G.state = 'win';
    var t = G.time | 0;
    $('#stats').textContent = T('win.stats', { time: T('win.time', { m: (t / 60) | 0, s: t % 60 }), n: Q.total });
    $('#win').classList.remove('gone');
    elHud.classList.remove('on');
    if (document.pointerLockElement) document.exitPointerLock();
    SND.win();
  }

  function dive() {
    SND.init();
    if (SND.ctx && SND.ctx.state === 'suspended') SND.ctx.resume();
    G.state = 'play'; G.time = 0; G.pearls = 0;
    elPearls.textContent = '0';
    // on repart de zéro : objets et quêtes
    for (var i = 0; i < world.pickups.length; i++) scene.remove(world.pickups[i]);
    world.pickups.length = 0;
    if (Q.babyTurtle) {
      scene.remove(Q.babyTurtle.obj);
      var bi = world.critters.indexOf(Q.babyTurtle);
      if (bi >= 0) world.critters.splice(bi, 1);
      Q.babyTurtle = null;
    }
    Q.done = 0; Q.seen = {}; Q.hideT = 0; Q.dialog = null; Q.active = null;
    elDialog.classList.remove('on');
    for (var k = 0; k < Q.defs.length; k++) {
      Q.defs[k].state = k === 0 ? 'available' : 'locked';
      Q.defs[k].progress = 0;
    }
    updateJournal(); refreshObjective(true);
    resetPlayer();
    $('#title').classList.add('gone');
    $('#win').classList.add('gone');
    $('#pause').classList.add('gone');
    elHud.classList.add('on');
    showHint(T('hint.blueFish'), 7);
  }

  function setPause(on) {
    if (G.state !== 'play' && G.state !== 'pause') return;
    G.state = on ? 'pause' : 'play';
    $('#pause').classList.toggle('gone', !on);
    if (on && document.pointerLockElement) document.exitPointerLock();
  }

  /* ================================================================== */
  /* COMMANDES                                                          */
  /* ================================================================== */
  function bindInput() {
    var el = renderer.domElement;

    window.addEventListener('keydown', function (e) {
      if (e.code === 'Escape') { if (G.state === 'play') setPause(true); return; }
      keys[e.code] = true;
      if (e.code === 'KeyP') setPause(G.state === 'play');
      if (G.state === 'play') {
        if (e.code === 'KeyE') { if (Q.dialog) advanceDialog(); else if (Q.near) startDialog(Q.near); }
        if (e.code === 'Space' && Q.dialog) { advanceDialog(); keys.Space = false; }
        if (e.code === 'KeyJ') { Q.journalOn = !Q.journalOn; elJournal.classList.toggle('on', Q.journalOn); }
      }
      if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
    });
    window.addEventListener('keyup', function (e) { keys[e.code] = false; });
    window.addEventListener('blur', function () { keys = {}; });

    el.addEventListener('mousedown', function () {
      if (Q.dialog) { advanceDialog(); return; }
      dragging = true;
      /* Pas de verrouillage du pointeur au doigt : il n'y a pas de pointeur à
         verrouiller, et l'appel échoue à chaque appui.
         Depuis Chrome 116 la méthode renvoie une **promesse**, et un
         `try/catch` ne l'attrape pas : le refus (ré-verrouillage trop rapide,
         document non focalisé) ressortait en « Uncaught (in promise) » dans la
         console de qui ouvrait la page. Rien de cassé, mais une erreur visible
         dans une page qu'on partage, c'est une erreur de trop. */
      if (G.state === 'play' && !locked && !TOUCH && el.requestPointerLock) {
        var pl;
        try { pl = el.requestPointerLock(); } catch (err) { pl = null; }
        if (pl && pl.catch) pl.catch(function () { /* refusé : on garde le glissé */ });
      }
    });
    window.addEventListener('mouseup', function () { dragging = false; });
    window.addEventListener('mousemove', function (e) {
      if (locked || dragging) { mouseDX += e.movementX || 0; mouseDY += e.movementY || 0; }
    });
    document.addEventListener('pointerlockchange', function () {
      locked = document.pointerLockElement === el;
    });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    el.addEventListener('wheel', function (e) {
      cam.dist = clamp(cam.dist + (e.deltaY > 0 ? 0.7 : -0.7), 3.4, 13);
      e.preventDefault();
    }, { passive: false });

    // ---- tactile : glisser pour regarder + un gros bouton NAGER
    var tid = null, tx = 0, ty = 0;
    el.addEventListener('touchstart', function (e) {
      goTouch();
      var t = e.changedTouches[0];
      tid = t.identifier; tx = t.clientX; ty = t.clientY;
    }, { passive: true });
    el.addEventListener('touchmove', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier !== tid) continue;
        mouseDX += (t.clientX - tx) * 1.6; mouseDY += (t.clientY - ty) * 1.6;
        tx = t.clientX; ty = t.clientY;
      }
      e.preventDefault();
    }, { passive: false });
    el.addEventListener('touchend', function () { tid = null; }, { passive: true });

    // L'invite et la bulle de dialogue prennent le rôle de la touche E et de la
    // barre d'espace. `click` plutôt que `touchstart` : le navigateur le
    // synthétise sur un appui court, et ça garde le clic souris pour un
    // ordinateur à écran tactile.
    elPrompt.addEventListener('click', function (e) {
      e.stopPropagation();
      if (G.state !== 'play') return;
      if (Q.dialog) advanceDialog(); else if (Q.near) startDialog(Q.near);
    });
    elDialog.addEventListener('click', function (e) {
      e.stopPropagation();
      if (Q.dialog) advanceDialog();
    });

    $('#btn-dive').addEventListener('click', dive);
    $('#btn-again').addEventListener('click', dive);
    $('#btn-resume').addEventListener('click', function () { setPause(false); });
    $('#btn-lang').addEventListener('click', function () {
      setLang(LANG.code === 'fr' ? 'en' : 'fr');
    });
    $('#btn-sound').addEventListener('click', function () {
      SND.init();
      SND.muted = !SND.muted;
      if (SND.master) SND.master.gain.value = SND.muted ? 0 : 0.9;
      this.textContent = SND.muted ? '🔇' : '🔊';
      this.classList.toggle('off', SND.muted);
    });
    $('#btn-quality').addEventListener('click', function () {
      QUALITY = (QUALITY + 2) % 3;
      setQualityLabel();
      applyQuality();
      initShadows();
      onResize();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && G.state === 'play') setPause(true);
    });
  }

  function setQualityLabel() {
    $('#btn-quality').innerHTML = T('hud.quality',
      { v: T(QUALITY === 2 ? 'hud.qHigh' : QUALITY === 1 ? 'hud.qMid' : 'hud.qLow') });
  }

  /* Basculer en mode tactile est irréversible dans une partie, et c'est voulu :
     un appui au doigt prouve qu'il y a un écran tactile, alors qu'un ordinateur
     portable tactile peut très bien repasser au clavier — retirer les boutons
     dès qu'une touche est pressée les ferait clignoter. */
  function goTouch() {
    if (TOUCH) return;
    TOUCH = true;
    document.body.classList.add('touch');
    addSwimButton();
    if (Q.dialog) showDialogLine();   // ré-écrit « Espace » en « Touchez »
  }

  function addSwimButton() {
    if (document.getElementById('swim')) return;
    var b = document.createElement('div');
    b.id = 'swim';
    b.textContent = T('hud.swim');
    b.setAttribute('style', 'position:fixed;left:18px;bottom:18px;z-index:4;width:108px;height:108px;' +
      'border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;' +
      'color:#3a1400;background:linear-gradient(#ffd08a,#ff7a4d);box-shadow:0 6px 0 #e2542a;' +
      'user-select:none;touch-action:none;font-family:"Baloo 2",sans-serif');
    document.body.appendChild(b);
    function on(e) { keys['KeyW'] = true; e.preventDefault(); e.stopPropagation(); }
    function off(e) { keys['KeyW'] = false; e.preventDefault(); e.stopPropagation(); }
    b.addEventListener('touchstart', on, { passive: false });
    b.addEventListener('touchend', off, { passive: false });
    b.addEventListener('touchcancel', off, { passive: false });
  }

  /* ================================================================== */
  /* PLAN D'OUVERTURE (écran-titre)                                     */
  /* ================================================================== */
  function updateTitle(dt) {
    var t = U.uTime.value;
    var a = t * 0.32;
    player.pos.set(world.home.x + Math.cos(a) * 7.5,
                   world.home.y + 1.6 + Math.sin(t * 0.7) * 1.0,
                   world.home.z + Math.sin(a) * 7.5);
    tmpA.set(-Math.sin(a), Math.cos(t * 0.7) * 0.06, Math.cos(a)).normalize();
    tmpM.lookAt(tmpA, tmpC.set(0, 0, 0), UP);
    tmpQ.setFromRotationMatrix(tmpM);
    player.obj.quaternion.slerp(tmpQ, 1 - Math.exp(-5 * dt));
    player.obj.position.copy(player.pos);

    var anim = player.obj.userData.body.userData.anim;
    anim.uSwaySpeed.value = 5.2;
    anim.uSwayAmp.value = 0.075;
    player.flap += dt * 4.2;
    player.obj.userData.pect[0].rotation.z = 0.2 + Math.sin(player.flap) * 0.5;
    player.obj.userData.pect[1].rotation.z = -0.2 - Math.sin(player.flap + 0.4) * 0.5;

    var ca = t * 0.075 + 1.1;
    camera.position.set(world.home.x + Math.cos(ca) * 26,
                        world.home.y + 8 + Math.sin(t * 0.11) * 3,
                        world.home.z + Math.sin(ca) * 26);
    camera.lookAt(world.home.x, world.home.y + 1.5, world.home.z);
    cam.pos.copy(camera.position);
  }

  /* ================================================================== */
  /* BOUCLE PRINCIPALE                                                  */
  /* ================================================================== */
  var lastT = 0, frameAcc = 0, frameN = 0, autoDropped = false;

  function updateWorldFx(dt) {
    var layers = world.particles.userData.layers;
    for (var i = 0; i < layers.length; i++) {
      var u = layers[i].material.uniforms;
      u.uCenter.value.copy(camera.position);
      u.uPix.value = H * pixelScale * 0.00055;
    }
    world.rays.rotation.y += dt * 0.007;
    // les sources de bulles crachent en continu
    if (world.vents.length && rnd() < dt * 14) {
      var v = world.vents[(rnd() * world.vents.length) | 0];
      if (v.distanceToSquared(camera.position) < 3600) {
        spawnFx(v, 1, { speed: 0.5, size: 0.22, life: rr(2.2, 3.4), grow: 1.6, spread: 0.6 });
      }
    }
  }

  /* Le courant tourne lentement et respire, sans jamais s'annuler : une eau
     immobile fait un décor mort, un courant qui s'inverse d'un coup fait
     claquer toute la végétation. Deux sinusoïdes de périodes incommensurables
     (41 s et 67 s) suffisent à ce qu'on ne devine pas la boucle. */
  var CUR = { ang: 0.6, beat: 0 };
  var _curF = new THREE.Vector3(), _curR = new THREE.Vector3();
  function updateCurrent(dt) {
    var t = U.uTime.value;
    CUR.ang = 0.6 + Math.sin(t / 41) * 0.9 + Math.sin(t / 67 + 1.3) * 0.5;
    var force = 0.62 + Math.sin(t / 23 + 0.7) * 0.20 + Math.sin(t / 13.5) * 0.09;
    var cx = Math.cos(CUR.ang) * force, cz = Math.sin(CUR.ang) * force;
    U.uCurrent.value.set(cx, cz);
    // intégrale du courant : c'est elle que suivent les particules, pour
    // qu'un changement de force ne les fasse pas sauter d'un coup.
    U.uDrift.value.x += cx * dt * 2.6;
    U.uDrift.value.y += cz * dt * 2.6;

    /* ---- et ce qu'on en entend ----
       La rafale est recalculée ici avec **la formule du shader**, à la position
       du joueur : `REEF.soft` ondule à 1,15 rad/s et sa rafale voyage avec le
       courant. Recopier la formule est le prix à payer pour que l'oreille et
       l'œil parlent de la même vague — une enveloppe sonore indépendante aurait
       été plus simple et aurait sonné faux, en gonflant quand les coraux se
       redressent. */
    if (!SND.ready) return;
    CUR.beat += dt * 1.15;
    var trav = (player.pos.x * cx + player.pos.z * cz) * 0.09;
    var gust = 0.60 + 0.40 * Math.sin(CUR.beat * 0.29 - trav);
    // de quel côté ça souffle, par rapport à là où l'on regarde
    camForward(_curF);
    _curR.crossVectors(_curF, UP).normalize();
    // /0,75 et pas /0,62 : à 0,62 les rafales fortes tapaient dans le plafond
    // du clamp et sonnaient toutes pareil.
    SND.setCurrent(force * gust / 0.75, cx * _curR.x + cz * _curR.z);
  }

  function animate() {
    requestAnimationFrame(animate);
    var now = performance.now() / 1000;
    var dt = clamp(now - lastT, 0.0005, 0.05);
    lastT = now;

    if (G.state === 'pause') { renderFrame(dt); return; }

    U.uTime.value += dt;
    updateCurrent(dt);
    for (var ai = 0; ai < ANIMS.length; ai++) {
      var an = ANIMS[ai];
      an.uBeat.value += dt * an.uSwaySpeed.value;
      /* La phase est repliée pour qu'un `float` de shader garde sa précision :
         au bout d'une heure, `uBeat` atteindrait ~20 000 et un float 32 bits
         n'a plus assez de mantisse pour distinguer deux images — l'animation
         se figerait par paliers. Replier sur un multiple de 2π est invisible. */
      if (an.uBeat.value > 6283.18) an.uBeat.value -= 6283.18;
    }
    G.safeT = Math.max(0, G.safeT - dt);
    flashCollect = Math.max(0, flashCollect - dt * 2.2);
    flashSting = Math.max(0, flashSting - dt * 2.6);

    if (G.state === 'play') {
      G.time += dt;
      updatePlayer(dt);
      updatePickups(dt);
      updateQuests(dt);
      updateInteract(dt);
      updateDialog(dt);
      refreshObjective(false);
      updateHud(dt);
      G.bubbleT -= dt;
      if (G.bubbleT <= 0) { G.bubbleT = rr(2.5, 7.5); SND.bubble(); }
    } else {
      updateTitle(dt);
    }
    world.menace = 0;
    updateZones(dt);
    updateCritters(dt);
    updateSchools(dt);
    updateJellies(dt);
    updateFx(dt);
    updateMarks(dt);
    updateWorldFx(dt);
    renderFrame(dt);

    // baisse la qualité tout seul si la machine souffre
    if (!autoDropped && QUALITY > 0) {
      frameAcc += dt; frameN++;
      if (frameN >= 150) {
        if (frameAcc / frameN > 0.028) {
          QUALITY = QUALITY - 1; setQualityLabel(); applyQuality(); initShadows(); onResize();
          if (QUALITY === 0) autoDropped = true;
        }
        frameAcc = 0; frameN = 0;
      }
    }
  }

  /* ================================================================== */
  /* DÉMARRAGE                                                          */
  /* ================================================================== */
  function init() {
    initRenderer();
    buildWaterDome();
    buildFloor();
    buildSurface();
    world.rays = buildGodRays();
    buildReef();
    buildShadows();
    buildPearls();
    buildSchools();
    populateReef();
    buildJellies();
    world.particles = buildParticles();
    initFx();
    buildPlayer();
    initQuests();
    attachMarks();
    bindInput();
    setQualityLabel();

    camera.position.set(world.home.x + 26, world.home.y + 10, world.home.z);
    camera.lookAt(world.home.x, world.home.y, world.home.z);
    renderer.compile(scene, camera);
    lastT = performance.now() / 1000;
    renderFrame(0.016);
    animate();

    window.__reef = { THREE: THREE, scene: scene, camera: camera, player: player, cam: cam,
                      world: world, U: U, CFG: CFG, G: G, Q: Q, renderer: renderer,
                      SND: SND, CUR: CUR, LANG: LANG, T: T, setLang: setLang,
                      dive: dive, startDialog: startDialog, advanceDialog: advanceDialog };
    loaderEl.style.opacity = '0';
    setTimeout(function () { if (loaderEl.parentNode) loaderEl.parentNode.removeChild(loaderEl); }, 600);
  }

  try {
    requestAnimationFrame(function () {
      try { init(); }
      catch (err) {
        loaderEl.style.opacity = '1';
        loaderEl.innerHTML = T('ui.crash') + '<br><small style="opacity:.7">' + (err && err.message ? err.message : err) + '</small>';
        if (window.console) console.error(err);
      }
    });
  } catch (err2) {
    loaderEl.textContent = 'Erreur : ' + err2;
  }
})();
</script>
