<style>
  :root{
    --ink:#08202e;
    --deep:#06304a;
    --teal:#2fd0c5;
    --aqua:#7ef0ff;
    --coral:#ff7a4d;
    --coral-dark:#e2542a;
    --sand:#ffe9bd;
    --panel:rgba(6,44,68,.62);
    --font:"Baloo 2","Trebuchet MS",Verdana,sans-serif;
  }
  html,body{height:100%}
  body{margin:0;background:#03202f;overflow:hidden;font-family:var(--font);color:#eaffff;
       -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
  #hud.on{opacity:1}
  .card{
    background:var(--panel);
    border:2px solid rgba(126,240,255,.35);
    border-radius:18px;
    box-shadow:0 6px 0 rgba(3,22,34,.45), inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter:blur(6px) saturate(1.2);
  }
  #pearls{position:absolute;left:18px;top:16px;padding:8px 16px 8px 12px;display:flex;align-items:center;gap:10px}
  #pearls .orb{width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#ffffff,#bff6ff 38%,#5ec7e8 70%,#2b6f96);
    box-shadow:0 0 14px rgba(150,240,255,.85)}
  #pearls b{font-size:26px;font-weight:800;letter-spacing:.5px;line-height:1}
  #pearls small{font-size:15px;opacity:.75;font-weight:500}
  #clock{position:absolute;right:18px;top:16px;padding:8px 16px;font-size:22px;font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:1px}
  #depth{position:absolute;right:18px;top:70px;padding:5px 13px;font-size:15px;font-weight:600;opacity:.8}
  #hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);padding:9px 20px;
    font-size:17px;font-weight:600;text-align:center;max-width:78vw;transition:opacity .45s;text-wrap:balance}
  #hint.hide{opacity:0}

  /* compass arrow toward nearest pearl */
  #arrow{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;opacity:0;transition:opacity .3s}
  #arrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 6px rgba(0,20,30,.7))}

  #toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-10px) scale(.9);opacity:0;
    font-size:34px;font-weight:800;color:var(--sand);text-shadow:0 3px 0 #1d5c3a,0 0 26px rgba(255,220,120,.7);
    transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .35s}
  #toast.pop{opacity:1;transform:translate(-50%,0) scale(1)}

  /* ---------- overlays ---------- */
  .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(115% 85% at 50% 20%,rgba(24,130,170,.12),rgba(3,26,42,.62));
    backdrop-filter:blur(3px);transition:opacity .6s;z-index:5}
  .screen.gone{opacity:0;pointer-events:none}
  .box{max-width:min(600px,88vw);padding:30px 34px 26px;text-align:center}
  h1{margin:0;font-size:clamp(44px,9vw,86px);font-weight:800;line-height:.95;
     color:var(--sand);text-shadow:0 5px 0 var(--coral-dark),0 8px 22px rgba(0,0,0,.45);letter-spacing:1px}
  /* Le sous-titre est sorti du <h1> : `data-i18n` écrit du textContent, ce qui
     aurait effacé le <span> imbriqué. Il n'hérite donc plus du corps du titre,
     d'où une taille explicite plutôt que l'ancien `.36em`. */
  .sub{display:block;font-size:clamp(16px,3.2vw,31px);font-weight:800;color:var(--aqua);
       text-shadow:0 3px 0 #0b4a66;margin-top:8px;letter-spacing:3px;line-height:1.15}
  .lead{font-size:19px;line-height:1.5;margin:18px 0 6px;font-weight:500;opacity:.95;text-wrap:balance}
  .keys{display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;margin:22px 0 4px}
  .keys div{font-size:14.5px;font-weight:600;background:rgba(3,30,46,.55);border:1.5px solid rgba(126,240,255,.28);
    border-radius:11px;padding:6px 11px}
  .keys kbd{font-family:var(--font);font-weight:800;background:linear-gradient(#fff,#cfeaf2);color:#08384f;
    border-radius:6px;padding:1px 7px;margin-right:5px;box-shadow:0 2px 0 #6f9aab}
  button{font-family:var(--font);font-size:26px;font-weight:800;color:#3a1400;cursor:pointer;
    margin-top:26px;padding:13px 44px;border:none;border-radius:999px;letter-spacing:.5px;
    background:linear-gradient(#ffd08a,var(--coral));box-shadow:0 6px 0 var(--coral-dark),0 10px 26px rgba(255,110,60,.35);
    transition:transform .12s,box-shadow .12s}
  button:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--coral-dark),0 14px 30px rgba(255,110,60,.45)}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--coral-dark)}
  .tiny{margin-top:20px;font-size:13.5px;opacity:.6;font-weight:500}
  #stats{font-size:21px;font-weight:700;margin-top:14px;color:var(--aqua)}

  /* ---------- corner buttons ---------- */
  /* z-index 6, donc AU-DESSUS des écrans (titre, pause, victoire, z-index 5) :
     c'est sur l'écran-titre qu'un visiteur cherche le bouton de langue, et il
     s'y trouvait masqué. Le son devient réglable avant de plonger, au passage. */
  #tools{position:fixed;right:14px;bottom:14px;display:flex;gap:9px;z-index:6}
  #btn-lang{padding:8px 10px;letter-spacing:.5px}
  #btn-lang span{opacity:.42;font-weight:700}
  #btn-lang span.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
  #btn-lang i{opacity:.42;font-style:normal;margin:0 4px}
  #tools button{margin:0;font-size:18px;padding:8px 14px;border-radius:14px;box-shadow:0 4px 0 var(--coral-dark)}
  #tools button.off{background:linear-gradient(#9fc0cc,#6d8f9d);color:#0d2b39;box-shadow:0 4px 0 #3f6472}
  button:focus-visible,#swim:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){
    /* le récif reste animé (c'est le jeu), mais l'interface arrête de bouger */
    .screen,button,#hint,#toast,#arrow,#vignette-flash,#loader{transition:none}
    button:hover{transform:none}
  }
  /* ---------- dialogues et quêtes ---------- */
  #dialog{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);
    width:min(680px,90vw);padding:16px 22px 14px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s}
  #dialog.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #dialog .who{font-size:15px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--sand);margin-bottom:4px}
  #dialog .txt{font-size:19px;line-height:1.45;font-weight:500;min-height:2.6em;text-wrap:pretty}
  #dialog .more{font-size:13px;opacity:.6;margin-top:6px;font-weight:600}
  #prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);padding:6px 14px;
    font-size:15px;font-weight:700;opacity:0;transition:opacity .2s}
  #prompt.on{opacity:1}
  #objective{position:absolute;left:50%;top:16px;transform:translateX(-50%);padding:8px 18px;
    font-size:16px;font-weight:600;max-width:60vw;text-align:center;opacity:0;transition:opacity .3s}
  #objective.on{opacity:1}
  #objective b{color:var(--sand);font-weight:800}
  #journal{position:absolute;right:16px;top:74px;width:min(330px,42vw);padding:14px 16px;
    opacity:0;pointer-events:none;transform:translateX(12px);transition:opacity .25s,transform .25s}
  #journal.on{opacity:1;transform:none}
  #journal h3{margin:0 0 10px;font-size:16px;font-weight:800;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--aqua)}
  #journal ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  #journal li{font-size:14.5px;line-height:1.35;font-weight:500;padding-left:20px;position:relative}
  #journal li:before{content:"○";position:absolute;left:0;color:var(--sand)}
  #journal li.done{opacity:.5}
  #journal li.done:before{content:"●";color:var(--teal)}
  #journal li b{display:block;font-weight:800;font-size:15px}
  #journal .empty{font-size:14px;opacity:.6}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;
    background:#03202f;font-size:20px;font-weight:600;color:#9fe8ff;transition:opacity .5s}
  #vignette-flash{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;
    background:radial-gradient(120% 90% at 50% 50%,transparent 40%,rgba(190,90,255,.55));transition:opacity .25s}
  /* ---------- surcharges d'écran étroit ----------------------------------
     Ce bloc est dernier, et c'est structurel : à spécificité égale, c'est la
     règle la plus basse qui gagne. Placé plus haut, il se faisait annuler par
     les positions de `#dialog`, `#prompt` et `#journal` définies plus bas —
     l'interface restait superposée sur téléphone sans qu'aucune règle n'ait
     l'air fausse. */
  @media (max-width:760px){
    /* Le bouton NAGER occupe les 126 premiers pixels du bas (18 de marge +
       108 de diamètre) : la bulle passe au-dessus, et le dialogue au-dessus
       d'elle. Mesuré, pas estimé — à 118 px les deux se recouvraient de 8 px. */
    #hint{bottom:140px;font-size:15px;max-width:88vw;padding:8px 14px}
    #dialog{bottom:212px;padding:13px 16px 11px}
    #tools button{font-size:15px;padding:7px 11px;border-radius:12px}
    #objective{max-width:84vw;font-size:14px;top:64px}
    #journal{width:min(330px,74vw);top:64px}
    #prompt{top:52%}
    #pearls{font-size:15px}
  }

  /* L'invite « parler à … » devient le bouton lui-même en tactile : au doigt il
     n'y a pas de touche E, et ajouter un second gros bouton flottant aurait
     encombré un écran déjà chargé.
     Les deux cibles ne sont cliquables que *visibles* (`.on`) : invisibles mais
     actives, une pilule au milieu de l'écran et une carte large en bas
     avaleraient le glissé-pour-regarder sans que rien ne l'explique. */
  body.touch #prompt{padding:11px 20px;font-size:17px;
    background:linear-gradient(#ffd08a,#ff7a4d);color:#3a1400;box-shadow:0 5px 0 #e2542a}
  body.touch #prompt.on{pointer-events:auto}
  body.touch #prompt.on:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #e2542a}
  body.touch #dialog.on{pointer-events:auto}

</style>

<div id="stage"></div>

<div id="hud">
  <div id="pearls" class="card"><span class="orb"></span><b>0</b><small></small></div>
  <div id="clock" class="card">0:00</div>
  <div id="depth" class="card">-0 m</div>
  <div id="arrow"><svg viewBox="0 0 64 64"><path d="M32 4 54 40H10z" fill="#ffd98a" stroke="#08202e" stroke-width="4" stroke-linejoin="round"/></svg></div>
  <div id="toast"></div>
  <div id="objective" class="card"></div>
  <div id="journal" class="card">
    <h3 data-i18n="hud.journal"></h3>
    <ul id="journal-list"></ul>
  </div>
  <div id="prompt" class="card" data-i18n-html="hud.promptIdle"></div>
  <div id="dialog" class="card">
    <div class="who"></div>
    <div class="txt"></div>
    <div class="more"></div>
  </div>
  <div id="hint" class="card"></div>
</div>

<div id="vignette-flash"></div>

<div id="tools">
  <button id="btn-lang" data-i18n-title="hud.langTip"><span id="lang-fr">FR</span><i>/</i><span id="lang-en">EN</span></button>
  <button id="btn-sound" data-i18n-title="hud.sound">🔊</button>
  <button id="btn-quality" data-i18n-title="hud.qualityTip"></button>
</div>

<div class="screen" id="title">
  <div class="box card">
    <h1 data-i18n="ui.title"></h1><span class="sub" data-i18n="ui.subtitle"></span>
    <p class="lead" data-i18n-html="ui.lead"></p>
    <div class="keys">
      <div data-i18n-html="keys.move"></div>
      <div data-i18n-html="keys.look"></div>
      <div data-i18n-html="keys.dash"></div>
      <div data-i18n-html="keys.up"></div>
      <div data-i18n-html="keys.down"></div>
      <div data-i18n-html="keys.talk"></div>
      <div data-i18n-html="keys.journal"></div>
      <div data-i18n-html="keys.pause"></div>
    </div>
    <button id="btn-dive" data-i18n="ui.dive"></button>
    <p class="tiny" data-i18n-html="ui.mouseTip"></p>
  </div>
</div>

<div class="screen gone" id="win">
  <div class="box card">
    <h1 data-i18n-html="ui.winTitle"></h1><span class="sub" data-i18n="ui.winSub"></span>
    <p class="lead" data-i18n="ui.winLead"></p>
    <div id="stats"></div>
    <button id="btn-again" data-i18n="ui.again"></button>
  </div>
</div>

<div class="screen gone" id="pause">
  <div class="box card">
    <h1 data-i18n="ui.pause"></h1><span class="sub" data-i18n="ui.pauseSub"></span>
    <button id="btn-resume" data-i18n="ui.resume"></button>
  </div>
</div>

<div id="loader"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.1/three.min.js"></script>

  var LANG = { code: 'fr', i: 0 };
  /** Texte traduit. `v` remplit les trous `{nom}`.
      Nommée `T` et pas `t` : `t` sert de variable locale à cinquante-trois
      endroits du fichier (paramètre d'interpolation, temps, compteur de
      boucle). Une fonction globale `t` y serait masquée sans un mot d'erreur
      au moment de l'écriture — et lèverait « t is not a function » seulement
      quand on tomberait sur la bonne branche, en jeu. */
  function T(k, v) {
    var e = TXT[k];
    var s = e ? (e[LANG.i] !== undefined ? e[LANG.i] : e[0]) : k;
    if (v) for (var n in v) s = s.split('{' + n + '}').join(v[n]);
    return s;
  }

  /** Choix de départ : ce que le visiteur a choisi la dernière fois, sinon la
      langue de son navigateur. `localStorage` peut lever (navigation privée,
      cookies bloqués), et le jeu doit démarrer quand même. */
  function initLang() {
    var saved = null;
    try { saved = localStorage.getItem('recif-lang'); } catch (e) { /* pas de stockage */ }
    var code = (saved === 'fr' || saved === 'en') ? saved
      : ((navigator.language || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en');
    LANG.code = code;
    LANG.i = code === 'fr' ? 0 : 1;
  }

  /** Écrit tout le texte fixe de la page. */
  function applyI18n() {
    var n, i;
    n = document.querySelectorAll('[data-i18n]');
    for (i = 0; i < n.length; i++) n[i].textContent = T(n[i].getAttribute('data-i18n'));
    n = document.querySelectorAll('[data-i18n-html]');
    for (i = 0; i < n.length; i++) n[i].innerHTML = T(n[i].getAttribute('data-i18n-html'));
    n = document.querySelectorAll('[data-i18n-title]');
    for (i = 0; i < n.length; i++) n[i].title = T(n[i].getAttribute('data-i18n-title'));
    document.title = T('ui.title');
    document.documentElement.lang = LANG.code;
    var fr = $('#lang-fr'), en = $('#lang-en');
    if (fr) fr.classList.toggle('on', LANG.code === 'fr');
    if (en) en.classList.toggle('on', LANG.code === 'en');
  }

  /** Change de langue en cours de partie : le texte fixe, puis tout ce que le
      jeu fabrique lui-même — sans ça on se retrouve avec un journal français
      dans une interface anglaise. */
  function setLang(code) {
    LANG.code = code;
    LANG.i = code === 'fr' ? 0 : 1;
    try { localStorage.setItem('recif-lang', code); } catch (e) { /* tant pis */ }
    applyI18n();
    loaderEl.textContent = T('ui.loading');
    if (typeof setQualityLabel === 'function' && $('#btn-quality')) setQualityLabel();
    if (Q && Q.total) $('#pearls small').textContent = T('hud.quests', { n: Q.total });
    if (Q && Q.defs && Q.defs.length) { updateJournal(); refreshObjective(true); }
    if (Q && Q.dialog) { Q.dialog.lines = Q.dialog.linesFor(); showDialogLine(); }
    var sw = document.getElementById('swim');
    if (sw) sw.textContent = T('hud.swim');
  }

  initLang();
  // Le script est en fin de <body> : toute la page existe déjà, on peut écrire
  // son texte tout de suite — y compris celui du chargement, qui s'affiche
  // avant que three.js soit là.
  applyI18n();
  loaderEl.textContent = T('ui.loading');

    return;
  }

    return function () {

    };

  function hash2(x, y) {
    var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }
  function noise2(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    var a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
    return lerp(lerp(a, b, ux), lerp(c, d, ux), uy) * 2 - 1;

  function fbm2(x, y, oct) {
    var v = 0, amp = 0.5, fx = x, fy = y;

  var DROP_ANG = -Math.PI / 2;                           // direction du tombant (-Z)
  /** Écart angulaire absolu à un cap, dans [0, PI]. */
  function angGap(a, b) {
    return Math.abs(((a - b + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
  }
  /** Relief du fond sableux — utilisé par la géométrie ET par le gameplay. */
  function floorHeight(x, z) {
    var r = Math.sqrt(x * x + z * z);
    var h = fbm2(x * 0.013, z * 0.013, 4) * 4.2;         // grandes dunes
    h += fbm2(x * 0.075, z * 0.075, 2) * 0.85;           // ondulations
    h += Math.sin(x * 0.09 + Math.cos(z * 0.06) * 2) * 0.35 * smoothstep(60, 10, r); // rides de sable
    h -= smoothstep(0, 46, r) * 1.6;                     // petite cuvette centrale
    // le tombant : dans un secteur, le récif s'arrête net et plonge dans le grand bleu
    var drop = (1 - smoothstep(0.50, 1.00, angGap(Math.atan2(z, x), DROP_ANG))) * smoothstep(70, 92, r);
    h += smoothstep(CFG.REEF_R - 20, CFG.REEF_R + 55, r) * 15 * (1 - drop);
    h -= drop * (48 + smoothstep(92, 140, r) * 45);
    return h;
  }

  function canvasTex(size, draw) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    var t = new THREE.CanvasTexture(c);
    t.needsUpdate = true;
    return t;
  }
  function softSpriteTex() {
    return canvasTex(64, function (g, s) {
      var grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.35, 'rgba(255,255,255,.55)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd; g.fillRect(0, 0, s, s);
    });
  }
  function bubbleSpriteTex() {
    return canvasTex(64, function (g, s) {
      g.clearRect(0, 0, s, s);
      g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 4.5;
      g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 5, 0, TAU); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.16)';
      g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 6, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,.95)';
      g.beginPath(); g.ellipse(s * 0.36, s * 0.32, s * 0.10, s * 0.07, -0.7, 0, TAU); g.fill();
    });
  }

    for (var i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      var t = clamp((v.z + 1) * 0.5, 0, 1);                 // 0 = queue, 1 = museau
      var prof = 0.13 + 0.87 * Math.pow(Math.sin(Math.pow(t, 0.78) * Math.PI), 0.62);
      var belly = 1 + (opt.belly || 0.12) * smoothstep(0.15, 0.55, t) * (v.y < 0 ? 1 : 0.25);
      var head = 1 + (opt.head || 0) * smoothstep(0.45, 1.0, t);
      p.setXYZ(i,
        v.x * prof * width * head,
        v.y * prof * height * belly * (1 + (opt.head || 0) * 0.35 * smoothstep(0.5, 1.0, t))
          + (opt.arch || 0.04) * Math.sin(t * Math.PI),
        v.z);
    }
    geo.computeVertexNormals();
    return geo;
  }

  /** Assombrit le pourtour d'une nageoire et éclaircit sa base. */
  function finEdge(geo, r0, r1, kRoot, kEdge) {
    ensureAttrs(geo);
    var p = geo.attributes.position, a = geo.attributes.aColor;
    for (var i = 0; i < p.count; i++) {
      var d = Math.sqrt(p.getX(i) * p.getX(i) + p.getY(i) * p.getY(i));
      var k = lerp(kRoot, kEdge, smoothstep(r0, r1, d));
      a.setXYZ(i, k, k, k);
    }
    return geo;
  }

  /** Nageoire : polygone 2D extrudé. */
  function finGeo(pts, thick) {
    var shape = new THREE.Shape();
    shape.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
    shape.closePath();
    var g = new THREE.ExtrudeGeometry(shape, { depth: thick || 0.05, bevelEnabled: false, curveSegments: 4 });
    g.translate(0, 0, -(thick || 0.05) * 0.5);
    return g;
  }

  /* ---------- outils communs ---------- */
  var YAXIS = new THREE.Vector3(0, 1, 0);
  /** Éclaircit/assombrit progressivement via aColor (pointes plus claires, etc.). */
  function rampColor(geo, y0, y1, k0, k1) {
    ensureAttrs(geo);
    var p = geo.attributes.position, a = geo.attributes.aColor;
    for (var i = 0; i < p.count; i++) {
      var k = lerp(k0, k1, smoothstep(y0, y1, p.getY(i)));
      a.setXYZ(i, a.getX(i) * k, a.getY(i) * k, a.getZ(i) * k);
    }
    return geo;
  }
  /** Creuse le couvercle d'un cylindre pour former une bouche sombre (éponges). */
  function dimpleTop(geo, depth, shrink, occ) {
    ensureAttrs(geo);
    var p = geo.attributes.position, n = geo.attributes.normal, a = geo.attributes.aOcc;
    for (var i = 0; i < p.count; i++) {
      if (n.getY(i) > 0.9) {
        p.setXYZ(i, p.getX(i) * shrink, p.getY(i) - depth, p.getZ(i) * shrink);
        a.setX(i, occ);
      }
    }
    geo.computeVertexNormals();
    return geo;
  }
  /** Tentacule effilé qui part d'un point vers une direction, souple à la pointe. */
  function tentaclePart(pos, dir, len, r0, r1, seg) {
    var g = new THREE.ConeGeometry(r1, len, seg || 4, 1, false);
    g.translate(0, len * 0.5, 0);
    swayByHeight(g, 0, len, 1.35);
    return {
      geo: g,
      matrix: new THREE.Matrix4().compose(pos,
        new THREE.Quaternion().setFromUnitVectors(YAXIS, dir), new THREE.Vector3(1, 1, 1))
    };
  }

  /* ---------- LA forme signature : l'étagère de roche ---------- */
  /** Plateau de roche à bord arrondi et contour irrégulier. */
  function shelfGeo(seed, R, thick) {
    var R2 = mulberry32(seed), sd = R2() * 12, t = thick;
    var pts = [
      new THREE.Vector2(0.002, t * 0.50),
      new THREE.Vector2(R * 0.52, t * 0.50),
      new THREE.Vector2(R * 0.90, t * 0.44),
      new THREE.Vector2(R * 1.00, t * 0.12),
      new THREE.Vector2(R * 0.98, -t * 0.24),
      new THREE.Vector2(R * 0.78, -t * 0.50),
      new THREE.Vector2(R * 0.34, -t * 0.46),
      new THREE.Vector2(0.002, -t * 0.40)
    ];
    var g = new THREE.LatheGeometry(pts, 24);
    var p = g.attributes.position, v = new THREE.Vector3();
    for (var i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      var a = Math.atan2(v.z, v.x);
      var k = 1 + fbm2(Math.cos(a) * 2.3 + sd, Math.sin(a) * 2.3 - sd, 3) * 0.34;
      var rel = Math.sqrt(v.x * v.x + v.z * v.z) / R;
      p.setXYZ(i, v.x * k, v.y + Math.sin(a * 2 + sd) * t * 0.4 * rel, v.z * k);
    }
    g.computeVertexNormals();
    occByHeight(g, -t * 0.5, t * 0.5, 0.42);        // dessous des plateaux : sombre
    return g;
  }

  /* ---------- coraux ---------- */
  /** Corail "chou-fleur" : amas de bosses, creux occlus. */
  function knobCoralGeo(seed, lumps) {
    var R2 = mulberry32(seed), parts = [], spheres = [[0, 0.52, 0, 0.60]];
    lumps = lumps || 7;
    for (var i = 0; i < lumps; i++) {
      var a = R2() * TAU, b = 0.12 + R2() * 1.05, d = 0.42 + R2() * 0.52;
      var r = 0.28 + R2() * 0.30;
      spheres.push([Math.cos(a) * Math.sin(b) * d, 0.48 + Math.cos(b) * d * 0.9 + r * 0.15,
                    Math.sin(a) * Math.sin(b) * d, r]);
    }
    for (i = 0; i < spheres.length; i++) {
      var s = spheres[i];
      parts.push({
        geo: new THREE.SphereGeometry(s[3], 6, 5),
        matrix: TRS(s[0], s[1], s[2], 0, 0, 0, 1, 0.85 + (i % 3) * 0.12, 1)
      });
    }
    var out = mergeGeos(parts);
    occBySpheres(out, spheres, 0.55);
    occByHeight(out, 0, 1.2, 0.5);
    rampColor(out, 0, 1.5, 0.78, 1.18);
    return out;
  }

  /** Corail cerveau : sillons méandreux, fond des sillons sombre. */
  function brainCoralGeo(seed) {
    var g = new THREE.SphereGeometry(1, 18, 13);
    var p = g.attributes.position, v = new THREE.Vector3();
    ensureAttrs(g);
    var ao = g.attributes.aOcc;
    for (var i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      var n = fbm2(v.x * 2.2 + seed, v.z * 2.2 - seed, 3);
      var groove = Math.sin(n * 22 + v.y * 3.5) * 0.5 + 0.5;     // sillons serrés
      var d = 0.16 * n + 0.055 * (groove - 0.55);
      _v3.copy(v).normalize();
      v.addScaledVector(_v3, d);
      p.setXYZ(i, v.x, v.y, v.z);
      ao.setX(i, clamp(0.42 + groove * 0.62, 0.3, 1));
    }
    g.scale(1.12, 0.68, 1.05);
    g.translate(0, 0.40, 0);
    g.computeVertexNormals();
    occByHeight(g, 0, 0.8, 0.55);
    rampColor(g, 0, 0.9, 0.80, 1.14);
    return g;
  }

  /** Corail branchu trapu (acropora), extrémités claires. */
  function branchCoralGeo(seed, scale) {
    var R = mulberry32(seed), parts = [];
    function grow(pos, dir, radius, len, depth) {
      if (depth > 3 || radius < 0.055) return;
      var end = pos.clone().addScaledVector(dir, len);
      parts.push({
        geo: new THREE.CylinderGeometry(radius * 0.74, radius, len, 6, 1, true),
        matrix: new THREE.Matrix4().compose(pos.clone().addScaledVector(dir, len * 0.5),
          new THREE.Quaternion().setFromUnitVectors(YAXIS, dir), new THREE.Vector3(1, 1, 1))
      });
      parts.push({
        geo: new THREE.SphereGeometry(radius * 0.88, 5, 4),
        matrix: new THREE.Matrix4().makeTranslation(end.x, end.y, end.z)
      });
      var n = depth === 0 ? 3 : (R() < 0.6 ? 2 : 3);
      for (var i = 0; i < n; i++) {
        var a = (i / n) * TAU + R() * 1.3, spread = 0.40 + R() * 0.5;
        grow(end, new THREE.Vector3(dir.x + Math.cos(a) * spread, dir.y + 0.34 + R() * 0.22,
             dir.z + Math.sin(a) * spread).normalize(),
             radius * (0.62 + R() * 0.13), len * (0.72 + R() * 0.16), depth + 1);
      }
    }
    grow(new THREE.Vector3(0, 0, 0), new THREE.Vector3(R() * 0.16 - 0.08, 1, R() * 0.16 - 0.08).normalize(),
         0.34, 1.25, 0);
    var g = mergeGeos(parts);
    g.scale(scale || 1, scale || 1, scale || 1);
    occByHeight(g, 0, 2.2 * (scale || 1), 0.42);
    rampColor(g, 0, 2.4 * (scale || 1), 0.85, 1.15);
    return g;
  }

  /** Gorgone : éventail ramifié presque plat (belle silhouette de fond). */
  function fanCoralGeo(seed, scale) {
    var R = mulberry32(seed), parts = [];
    function grow(pos, ang, radius, len, depth) {
      if (depth > 4 || radius < 0.022) return;
      var dir = new THREE.Vector3(Math.sin(ang), Math.cos(ang), 0);
      var end = pos.clone().addScaledVector(dir, len);
      parts.push({
        geo: new THREE.CylinderGeometry(radius * 0.72, radius, len, 5, 1, true),
        matrix: new THREE.Matrix4().compose(pos.clone().addScaledVector(dir, len * 0.5),
          new THREE.Quaternion().setFromUnitVectors(YAXIS, dir), new THREE.Vector3(1, 1, 1))
      });
      var spread = 0.40 + R() * 0.24;
      grow(end, ang - spread, radius * 0.74, len * 0.82, depth + 1);
      grow(end, ang + spread, radius * 0.74, len * 0.82, depth + 1);
      if (R() < 0.3) grow(end, ang + (R() - 0.5) * 0.2, radius * 0.6, len * 0.6, depth + 1);
    }
    grow(new THREE.Vector3(0, 0, 0), 0, 0.13, 1.05, 0);
    var g = mergeGeos(parts);
    g.scale(scale || 1, scale || 1, (scale || 1) * 0.4);
    swayByHeight(g, 0, 3.2 * (scale || 1), 1.6);
    occByHeight(g, 0, 1.5, 0.6);
    return g;
  }

  /** Plateau frangé : la grande table à tentacules du film. */
  function fringePlateGeo(seed, R) {
    var R2 = mulberry32(seed);
    var parts = [{ geo: shelfGeo(seed + 7, R, R * 0.15) }];
    var n = Math.max(24, Math.round(R * 24));
    for (var i = 0; i < n; i++) {
      var a = (i / n) * TAU + R2() * 0.18;
      var rad = R * (0.42 + R2() * 0.56);
      var len = R * (0.34 + R2() * 0.42);
      var tilt = 0.75 + R2() * 0.55;
      var out = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
      var dir = new THREE.Vector3().copy(YAXIS).multiplyScalar(Math.cos(tilt))
        .addScaledVector(out, Math.sin(tilt)).normalize();
      parts.push(tentaclePart(new THREE.Vector3(Math.cos(a) * rad, R * 0.07, Math.sin(a) * rad),
                              dir, len, R * 0.010, R * 0.032, 4));
    }
    var g = mergeGeos(parts);
    rampColor(g, 0, R * 0.6, 0.9, 1.18);
    return g;
  }

  /* ---------- LES ANÉMONES POMPONS ----------------------------------------
     Elles étaient des pelotes d'épingles : soixante cônes à quatre faces
     effilés en aiguille, ce qui se lit comme un oursin. Le brin de l'anémone
     hôte (`tentacleTubeGeo`, 120 triangles) est hors de question ici — il y a
     **698 pompons** dans le récif, soit à eux seuls un quart de toute la
     géométrie posée (594 000 triangles, compté et pas estimé). Les leur donner
     coûterait neuf millions de triangles.

     Le compromis tient en une observation : ce qui trahit l'aiguille, c'est la
     pointe, pas le nombre de brins. Un tube à cinq faces dont seuls les 20
     derniers pour cent se referment coûte 20 triangles au lieu de 8 — mais on
     peut alors se contenter de deux fois moins de brins, plus gros, et le
     pompon est **plus** ressemblant pour le même prix. Vérifié après coup sur
     le total du décor.
     ----------------------------------------------------------------------- */

  /* Les quatre anneaux du brin, placés à la main. Deux tombent dans la calotte
     (0,86 et 1,0), et c'est tout l'objet de l'exercice : avec un seul anneau au
     bout, six faces convergeant vers un point font six grands triangles qui
     accrochent la lumière chacun à leur façon — on voyait des pointes de
     cristal taillées, et changer la couleur ou le nombre de faces n'y faisait
     rien. Le rayon remonte avant de retomber, ce qui donne le doigt. */
  var POM_T = [0, 0.52, 0.86, 1.00];
  var POM_R = [0.86, 1.06, 0.80, 0.00];

  /** Brin de pompon : tube court à six faces, à bout mat. */
  function pomTentacleGeo(pos, dir, len, r) {
    /* 6 faces × 3 segments = 36 triangles, sans couvercles : la base est
       enfouie dans le dôme, et un couvercle inutile coûterait 6 triangles
       × 22 brins × 698 pompons. */
    var g = new THREE.CylinderGeometry(1, 1, len, 6, 3, true);
    ensureAttrs(g);
    var p = g.attributes.position, sw = g.attributes.aSway, ac = g.attributes.aColor;
    for (var i = 0; i < p.count; i++) {
      var x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      // les anneaux d'un cylindre à 3 segments tombent exactement sur 0, ⅓, ⅔, 1
      var ring = Math.round(clamp((y + len * 0.5) / len, 0, 1) * 3);
      var t = POM_T[ring], rr2 = r * POM_R[ring];
      p.setXYZ(i, x * rr2, (t - 0.5) * len, z * rr2);
      sw.setX(i, 0.55 * Math.pow(t, 1.3));    // trapu : il ondule sans mollir
      var k = 0.80 + 0.46 * t;                 // pointe plus claire
      ac.setXYZ(i, k, k, k);
    }
    g.computeVertexNormals();
    return {
      geo: g,
      matrix: new THREE.Matrix4().compose(pos,
        new THREE.Quaternion().setFromUnitVectors(YAXIS, dir), new THREE.Vector3(1, 1, 1))
        .multiply(new THREE.Matrix4().makeTranslation(0, len * 0.5, 0))
    };
  }

  /** Anémone pompon : dôme couvert de brins courts et gras. */
  function pomAnemoneGeo(seed, R, count) {
    var R2 = mulberry32(seed), parts = [];
    /* Dôme réduit (7×4 au lieu de 10×7, et 0,50 R au lieu de 0,58) : ce sont les
       brins qui doivent faire la touffe, pas le socle. Il en dépassait un crâne
       chauve au milieu, et les 84 triangles rendus ici paient les brins. */
    var base = new THREE.SphereGeometry(R * 0.50, 7, 4, 0, TAU, 0, Math.PI * 0.6);
    base.scale(1, 0.82, 1);
    parts.push({ geo: base, matrix: TRS(0, R * 0.26, 0) });
    count = count || 30;
    for (var i = 0; i < count; i++) {
      // biaisés vers le haut : répartis sur toute la demi-sphère, ils laissaient
      // le sommet du dôme nu et la bête se lisait comme une boule à piquants
      var a = R2() * TAU, b = Math.acos(1 - R2() * 0.80);
      var dir = new THREE.Vector3(Math.sin(b) * Math.cos(a), Math.cos(b) * 1.15, Math.sin(b) * Math.sin(a)).normalize();
      /* Trapus : environ cinq fois leur largeur. Le cône de pointe ne fait que
         les 18 derniers pour cent, donc plus le brin est court, plus son bout
         est franc — c'est ce rapport, et pas le nombre de faces, qui décide
         si on voit un doigt ou une aiguille. */
      var len = R * (0.42 + R2() * 0.34);
      parts.push(pomTentacleGeo(dir.clone().multiplyScalar(R * 0.40).add(new THREE.Vector3(0, R * 0.24, 0)),
                                dir, len, R * 0.088 * (0.88 + R2() * 0.24)));
    }
    var g = mergeGeos(parts);
    occByHeight(g, 0, R * 0.8, 0.45);
    // dégradé doux seulement : le vrai éclaircissement de pointe est déjà cuit
    // par brin ci-dessus, et deux rampes multipliées cramaient les bouts.
    rampColor(g, 0, R * 1.0, 0.90, 1.06);
    return g;
  }

  /* ================================================================== */
  /* L'ANÉMONE HÔTE                                                     */
  /*                                                                    */
  /* Celle du film est une botte de gros brins mous, serrés, presque     */
  /* translucides à la pointe, plantés sur une colonne magenta. Elle     */
  /* était faite ici de cônes à quatre faces effilés en pointe, plantés  */
  /* au hasard sur une demi-sphère : de loin ça donnait un oursin, pas   */
  /* une anémone. Trois choses ont changé.                              */
  /*                                                                    */
  /*   1. Le brin est un tube arqué à bout arrondi, d'épaisseur presque  */
  /*      constante — c'est la silhouette du brin qui fait l'anémone.    */
  /*   2. Ils partent d'un disque oral en spirale dorée, plus longs au   */
  /*      centre et plus couchés au bord : le tas prend tout seul la     */
  /*      forme de dôme de la référence, au lieu d'une pelote.           */
  /*   3. Le dégradé magenta → pêche → crème est cuit le long du brin,   */
  /*      pas selon la hauteur dans le monde : un brin couché garde donc */
  /*      sa pointe claire.                                             */
  /* ================================================================== */

  // Les trois teintes relevées sur les captures. Aucune n'est magenta : dans le
  // film le magenta est sur la COLONNE, les brins vont du saumon à la crème.
  // Une première version mettait du magenta à leur base et l'occlusion la
  // tirait vers un rouge sang qui ne ressemblait à rien.
  var ANEM = { base: 0xe4785f, mid: 0xffbc8e, tip: 0xfae4c6 };

  /** Un brin d'anémone : tube arqué, épais, à bout arrondi. */
  function tentacleTubeGeo(len, rad, bend, seg, sides) {
    seg = seg || 10;
    var g = new THREE.CylinderGeometry(1, 1, len, sides || 6, seg, true);
    ensureAttrs(g);
    var p = g.attributes.position, sw = g.attributes.aSway, ac = g.attributes.aColor;
    var ao = g.attributes.aOcc;
    var c0 = new THREE.Color(ANEM.base), c1 = new THREE.Color(ANEM.mid), c2 = new THREE.Color(ANEM.tip);
    var cc = new THREE.Color();
    for (var i = 0; i < p.count; i++) {
      var x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      var u = clamp((y + len * 0.5) / len, 0, 1);
      /* Les anneaux d'un cylindre sont répartis uniformément, et c'est ce qui
         ratait le bout arrondi : avec la calotte sur les 10 derniers pour cent,
         un seul anneau tombait dedans et le tube finissait en pointe — on
         obtenait un oursin. On resserre donc les anneaux vers la pointe
         (`1-(1-u)^1.75`), ce qui en met quatre dans la calotte. */
      var t = 1 - Math.pow(1 - u, 1.75);
      // Profil : mince à l'émergence, plein très vite, léger renflement aux
      // deux tiers, puis une vraie calotte hémisphérique sur les 12 derniers %.
      var r = rad * (0.58 + 0.42 * smoothstep(0, 0.13, t)) * (1 + 0.13 * smoothstep(0.40, 0.90, t));
      if (t > 0.88) r *= Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.88) / 0.12, 2)));
      // L'arc croît en t² : le brin sort droit du disque puis se couche.
      p.setXYZ(i, x * r + bend * len * t * t, (t - 0.5) * len, z * r);
      /* 3,4 fois la souplesse d'une pointe de corail. `uSwayAmp` est partagé par
         tous les props mous, et le monter globalement ferait gigoter les coraux
         durs ; `aSway` veut justement dire « à quel point ce sommet est mou »,
         et un brin d'anémone l'est bien plus qu'une branche. Réglé en mesurant :
         4,4 donne ~0,9 m de course à une pointe de 5,7 m, soit 15 % de sa
         longueur — la pointe ondule nettement, la botte reste une botte. */
      sw.setX(i, 4.4 * Math.pow(t, 1.25));
      if (t < 0.26) cc.copy(c0).lerp(c1, smoothstep(0.0, 0.26, t));
      // La bascule vers la crème est tardive : sur les captures les deux tiers
      // hauts sont encore pêche, seul le bout pâlit vraiment.
      else cc.copy(c1).lerp(c2, smoothstep(0.44, 1.0, t));
      ac.setXYZ(i, cc.r, cc.g, cc.b);
      // le fond de la couronne reste dans l'ombre, mais chaudement : pas noir
      ao.setX(i, 0.46 + 0.54 * smoothstep(0.03, 0.50, t));
    }
    g.computeVertexNormals();
    return g;
  }

  /** Anémone hôte : la botte de brins mous où l'on habite. */
  function hostAnemoneGeo(seed, R, count) {
    var R2 = mulberry32(seed), parts = [];
    count = count || 130;
    var Rd = R * 0.58;              // rayon du disque oral
    var yd = R * 0.52;              // hauteur du disque : la colonne se voit

    /* ---- la colonne : un tronc magenta évasé, à plis verticaux ---- */
    var prof = [
      new THREE.Vector2(R * 0.58, 0),             // pied évasé sur la roche
      new THREE.Vector2(R * 0.48, R * 0.12),
      new THREE.Vector2(R * 0.41, R * 0.28),      // la taille
      new THREE.Vector2(R * 0.46, R * 0.42),
      new THREE.Vector2(R * 0.58, R * 0.52),      // évasement sous les brins
      new THREE.Vector2(R * 0.64, R * 0.565),     // la lèvre, qui dépasse
      new THREE.Vector2(R * 0.57, R * 0.58)
    ];
    var col = new THREE.LatheGeometry(prof, 30);
    ensureAttrs(col);
    var cp = col.attributes.position, cc2 = col.attributes.aColor, co = col.attributes.aOcc;
    var mag0 = new THREE.Color(0x8a1a5c), mag1 = new THREE.Color(0xd8298c);
    var mc = new THREE.Color();
    for (var k = 0; k < cp.count; k++) {
      var vx = cp.getX(k), vy = cp.getY(k), vz = cp.getZ(k);
      var ang = Math.atan2(vz, vx);
      // plis verticaux : la colonne du film est plissée, pas lisse
      var f = 1 + Math.sin(ang * 13) * 0.045 + Math.sin(ang * 5 + 1.1) * 0.030;
      cp.setXYZ(k, vx * f, vy, vz * f);
      var h = clamp(vy / (R * 0.58), 0, 1);
      mc.copy(mag0).lerp(mag1, smoothstep(0.1, 0.9, h));
      cc2.setXYZ(k, mc.r, mc.g, mc.b);
      /* Plancher d'occlusion haut : dans le film la colonne est VIVE, même au
         pied. À 0,30 elle sortait presque noire sous la couronne, et on perdait
         le seul accent saturé de la bête. */
      co.setX(k, 0.52 + 0.40 * h);
    }
    col.computeVertexNormals();
    parts.push({ geo: col });

    /* ---- la couronne : spirale dorée sur le disque ---- */
    for (var i = 0; i < count; i++) {
      var fr = (i + 0.5) / count;
      var rho = Rd * Math.sqrt(fr);                   // racine : densité uniforme
      var a = i * 2.399963229728653 + R2() * 0.22;    // angle d'or : jamais d'alignement
      // Les brins du centre sont les plus longs et les plus droits, ceux du
      // bord les plus courts et les plus couchés : d'où le dôme.
      /* Les proportions comptent plus que le nombre : un brin du film fait
         environ dix fois sa largeur. À vingt-quatre fois (l'essai précédent)
         on lit des piquants, quelle que soit la couleur. Et l'écartement reste
         faible pour que la masse reste une botte serrée, pas un feu d'artifice. */
      /* Le dôme vient du CONTRASTE de longueur entre le centre et le bord :
         à longueurs presque égales on obtient une brosse à plat, ce qu'on
         avait. Ici le centre fait presque le double du bord. */
      var len = R * (1.30 - 0.62 * fr) * (0.82 + R2() * 0.36);
      var bend = 0.05 + 0.36 * fr + R2() * 0.09;
      var rad = R * 0.069 * (0.88 + R2() * 0.26);
      var geo = tentacleTubeGeo(len, rad, bend, 10, 6);
      var m = new THREE.Matrix4()
        .makeTranslation(Math.cos(a) * rho, yd + R * 0.02, Math.sin(a) * rho)
        .multiply(new THREE.Matrix4().makeRotationY(-a))     // +X local -> vers l'extérieur
        .multiply(new THREE.Matrix4().makeTranslation(0, len * 0.5, 0));
      parts.push({ geo: geo, matrix: m, phase: R2() * TAU });
    }
    // Ni rampColor ni swayByHeight ici : tout est déjà cuit par brin, et une
    // seconde passe selon la hauteur du monde écraserait le dégradé.
    return mergeGeos(parts);
  }

  /** Éponges tubulaires à bouche sombre. */
  function tubeSpongeGeo(seed) {
    var R2 = mulberry32(seed), parts = [];
    var n = 2 + ((R2() * 4) | 0);
    for (var i = 0; i < n; i++) {
      var h = 0.65 + R2() * 1.35, r = 0.20 + R2() * 0.17;
      var a = R2() * TAU, d = R2() * 0.42, tilt = (R2() - 0.5) * 0.36;
      var g = new THREE.CylinderGeometry(r, r * 0.86, h, 11, 1, false);
      dimpleTop(g, r * 0.75, 0.80, 0.14);
      occByHeight(g, -h * 0.5, h * 0.2, 0.5);
      parts.push({
        geo: g,
        matrix: TRS(Math.cos(a) * d, h * 0.5, Math.sin(a) * d, tilt, R2() * TAU, tilt * 0.7)
      });
      rampColor(g, -h * 0.5, h * 0.5, 0.80, 1.16);
      parts.push({
        geo: new THREE.TorusGeometry(r * 0.93, r * 0.14, 4, 10),
        matrix: TRS(Math.cos(a) * d, h - r * 0.05, Math.sin(a) * d, Math.PI / 2 + tilt, 0, 0)
      });
    }
    return mergeGeos(parts);
  }

  /** Fouet de mer : longue tige souple et incurvée. */
  function whipGeo(seed, h) {
    var R2 = mulberry32(seed);
    var pts = [];
    var lean = (R2() - 0.5) * 1.15, lean2 = (R2() - 0.5) * 1.15;
    for (var i = 0; i <= 4; i++) {
      var t = i / 4;
      pts.push(new THREE.Vector3(Math.sin(t * 2.6) * lean * h * 0.42, t * h * (1 - t * 0.10),
                                 Math.sin(t * 2.0 + 1) * lean2 * h * 0.42));
    }
    var curve = new THREE.CatmullRomCurve3(pts);
    var g = new THREE.TubeGeometry(curve, 12, h * 0.016, 5, false);
    swayByHeight(g, 0, h, 1.5);
    rampColor(g, 0, h, 0.85, 1.15);
    occByHeight(g, 0, h * 0.25, 0.6);
    return g;
  }

  /** Plateau d'algue plate (les "nénuphars" verts du film). */
  function padGeo(seed, R) {
    var R2 = mulberry32(seed), sd = R2() * 9;
    var g = new THREE.CylinderGeometry(R, R * 0.96, R * 0.09, 20, 1, false);
    var p = g.attributes.position, v = new THREE.Vector3();
    for (var i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      var a = Math.atan2(v.z, v.x);
      var k = 1 + fbm2(Math.cos(a) * 2.6 + sd, Math.sin(a) * 2.6 - sd, 2) * 0.26;
      p.setXYZ(i, v.x * k, v.y + Math.sin(a * 3 + sd) * R * 0.10, v.z * k);
    }
    g.computeVertexNormals();
    occByHeight(g, -R * 0.05, R * 0.05, 0.35);
    return g;
  }

  /** Touffe d'herbe / algues souples. */
  function grassGeo(seed, blades, h) {
    var R = mulberry32(seed), parts = [], maxH = 0;
    for (var i = 0; i < blades; i++) {
      var hh = h * (0.6 + R() * 0.7), w = 0.09 + R() * 0.07;
      maxH = Math.max(maxH, hh);
      var g = new THREE.PlaneGeometry(w, hh, 1, 4);
      var p = g.attributes.position, v = new THREE.Vector3();
      for (var j = 0; j < p.count; j++) {
        v.fromBufferAttribute(p, j);
        var t = (v.y + hh * 0.5) / hh;
        p.setXYZ(j, v.x * (1 - t * 0.75), v.y, v.z + t * t * hh * 0.22);
      }
      g.computeVertexNormals();
      parts.push({ geo: g, matrix: TRS((R() - 0.5) * 0.8, hh * 0.5, (R() - 0.5) * 0.8, 0, R() * TAU, 0) });
    }
    var out = mergeGeos(parts);
    swayByHeight(out, 0, maxH, 1.45);
    occByHeight(out, 0, maxH * 0.4, 0.55);
    return out;
  }

  /** Laminaire : long ruban ondulant. */
  function kelpGeo(seed, h) {
    var R = mulberry32(seed), parts = [];
    var g = new THREE.PlaneGeometry(0.5, h, 2, 10);
    var p = g.attributes.position, v = new THREE.Vector3();
    for (var j = 0; j < p.count; j++) {
      v.fromBufferAttribute(p, j);
      var t = (v.y + h * 0.5) / h;
      p.setXYZ(j, v.x * (0.5 + t * 0.8), v.y, v.z + Math.sin(t * 7) * 0.16 * t);
    }
    g.computeVertexNormals();
    var rot0 = R() * TAU;
    parts.push({ geo: g, matrix: TRS(0, h * 0.5, 0, 0, rot0, 0) });
    parts.push({ geo: g.clone(), matrix: TRS(0, h * 0.5, 0, 0, rot0 + Math.PI / 2, 0) });
    parts.push({ geo: new THREE.CylinderGeometry(0.05, 0.08, h, 5, 1, true), matrix: TRS(0, h * 0.5, 0) });
    var out = mergeGeos(parts);
    swayByHeight(out, 0, h, 1.5);
    occByHeight(out, 0, h * 0.3, 0.6);
    return out;
  }

  /** Oursin. */
  function urchinGeo(seed) {
    var R = mulberry32(seed), parts = [];
    parts.push({ geo: new THREE.SphereGeometry(0.32, 10, 8), matrix: TRS(0, 0.28, 0) });
    for (var i = 0; i < 30; i++) {
      var a = R() * TAU, b = Math.acos(1 - 2 * R() * 0.7);
      var d = new THREE.Vector3(Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a));
      var len = 0.26 + R() * 0.3;
      parts.push({
        geo: new THREE.ConeGeometry(0.026, len, 4, 1, true),
        matrix: new THREE.Matrix4().compose(
          d.clone().multiplyScalar(0.28 + len * 0.5).add(new THREE.Vector3(0, 0.28, 0)),
          new THREE.Quaternion().setFromUnitVectors(YAXIS, d), new THREE.Vector3(1, 1, 1))
      });
    }
    var g = mergeGeos(parts);
    occByHeight(g, 0, 0.5, 0.5);
    return g;
  }

  /** Étoile de mer. */
  function starfishGeo() {
    var parts = [];
    for (var i = 0; i < 5; i++) {
      var a = i / 5 * TAU;
      var arm = new THREE.SphereGeometry(0.5, 8, 6);
      arm.scale(0.22, 0.12, 0.62);
      parts.push({ geo: arm, matrix: TRS(Math.sin(a) * 0.34, 0.06, Math.cos(a) * 0.34, 0, a, 0) });
    }
    var c = new THREE.SphereGeometry(0.26, 10, 6); c.scale(1, 0.45, 1);
    parts.push({ geo: c, matrix: TRS(0, 0.07, 0) });
    return mergeGeos(parts);
  }

  /** Rocher / patate de corail. */
  function rockGeo(seed, r) {
    var g = new THREE.SphereGeometry(r, 26, 17);
    noisify(g, r * 0.16, 1.5 / r, seed % 71, 0.9);
    g.scale(1, 0.86 + (seed % 7) * 0.05, 1);
    g.computeVertexNormals();
    occByHeight(g, -r, r * 0.2, 0.45);
    return g;
  }

  /** Pilier / tourelle de roche. */
  function pillarGeo(seed, h) {
    var R = mulberry32(seed), sd = R() * 20, parts = [];
    var g = new THREE.CylinderGeometry(0.6 + R() * 0.4, 1.9 + R() * 0.5, h, 13, 8, true);
    var p = g.attributes.position, v = new THREE.Vector3();
    for (var i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      var t = (v.y + h * 0.5) / h;
      var bump = 1 + fbm2(v.x * 0.55 + sd, v.z * 0.55 - sd, 3) * 0.34 + Math.sin(t * 8.5 + sd) * 0.09;
      p.setXYZ(i, v.x * bump + Math.sin(t * 2.6 + sd) * 1.5 * t * t, v.y,
                  v.z * bump + Math.cos(t * 2.1 + sd) * 1.2 * t * t);
    }
    g.computeVertexNormals();
    parts.push({ geo: g, matrix: TRS(0, h * 0.5, 0) });
    parts.push({
      geo: new THREE.SphereGeometry(0.85, 10, 7),
      matrix: TRS(Math.sin(2.6 + sd) * 1.5, h, Math.cos(2.1 + sd) * 1.2)
    });
    var out = mergeGeos(parts);
    occByHeight(out, 0, h * 0.55, 0.4);
    return out;
  }

  /** Arche rocheuse (on peut nager dessous). */
  function archGeo(seed, R, thick) {
    var g = new THREE.TorusGeometry(R, thick, 10, 26, Math.PI);
    noisify(g, thick * 0.4, 0.8, seed % 53, 0.8);
    g.computeVertexNormals();
    return g;
  }

  /* ================================================================== */
  /* PERSONNAGES                                                        */
  /* ================================================================== */

  // Robe du poisson-clown : 3 bandes blanches bordées de noir + une à la queue
  var CLOWN_HOOK = [
    '  float z = vObj.z + 0.13*vObj.y;',
    '  float wA = bandMask(z, 0.575, 0.105) + bandMask(z, 0.015, 0.125) + bandMask(z, -0.655, 0.080) + bandMask(z, -1.07, 0.075);',
    '  float kA = bandMask(z, 0.575, 0.158) + bandMask(z, 0.015, 0.182) + bandMask(z, -0.655, 0.125) + bandMask(z, -1.07, 0.122);',
    '  wA = clamp(wA, 0.0, 1.0); kA = clamp(kA, 0.0, 1.0);',
    '  base *= mix(1.10, 0.94, smoothstep(-0.45, 0.35, vObj.y));',
    '  base = mix(base, vec3(0.07,0.09,0.14), clamp(kA - wA, 0.0, 1.0)*0.95);',
    '  base = mix(base, vec3(1.0,0.985,0.95), wA*0.97);'
  ].join('\n');

  /** Le héros : petit poisson-clown, museau vers +Z. */
  function buildClownfish() {
    var g = new THREE.Group();

    // --- corps + nageoires médianes, tout fusionné dans l'espace du corps
    var parts = [{ geo: fishBodyGeo(0.335, 0.495, { belly: 0.20, arch: 0.05, head: 0.30, seg: 26, seg2: 18 }), matrix: null }];

    var fins = [];
    var tail = finGeo([[0, 0.12], [0.18, 0.26], [0.34, 0.34], [0.46, 0.33], [0.52, 0.20],
                       [0.53, 0.0], [0.52, -0.20], [0.46, -0.33], [0.34, -0.34],
                       [0.18, -0.26], [0, -0.12]], 0.030);
    finEdge(tail, 0.30, 0.50, 1.10, 0.34);
    tail.rotateY(Math.PI / 2);                       // le profil part vers -Z
    fins.push({ geo: tail, matrix: TRS(0, 0.02, -0.94) });

    var dorsal = finGeo([[0, 0], [0.18, 0.24], [0.50, 0.38], [0.84, 0.32], [1.04, 0.04], [0.55, 0.01]], 0.028);
    finEdge(dorsal, 0.22, 0.44, 1.05, 0.34);
    dorsal.rotateY(Math.PI / 2);                      // se dresse sur le dos
    fins.push({ geo: dorsal, matrix: TRS(0, 0.40, 0.30) });

    var anal = finGeo([[0, 0], [0.15, 0.20], [0.38, 0.26], [0.54, 0.03], [0.30, 0.0]], 0.026);
    finEdge(anal, 0.18, 0.34, 1.05, 0.36);
    anal.rotateY(Math.PI / 2);
    anal.rotateZ(Math.PI);                            // et celle-ci pend sous le ventre
    fins.push({ geo: anal, matrix: TRS(0, -0.38, -0.34) });

    var bodyMat = {
      color: 0xf4661f, baseHook: CLOWN_HOOK, mode: 1, fishLen: 1.0,
      swayAmp: 0.085, swayFreq: 2.7, swaySpeed: 7.0,
      rim: 0.40, spec: 0.30, soft: 0.045, outline: 3.4
    };
    var body = toonMesh(mergeGeos(parts), bodyMat);
    g.add(body);

    // les nageoires partagent les uniforms d'animation du corps -> même ondulation
    var finMesh = toonMesh(mergeGeos(fins), {
      color: 0xf4661f, baseHook: CLOWN_HOOK, mode: 1, fishLen: 1.0,
      rim: 0.5, spec: 0.2, sss: 0.85, opacity: 0.9, transparent: true,
      side: THREE.DoubleSide, uniforms: body.userData.anim
    });
    finMesh.renderOrder = 2;
    g.add(finMesh);

    // --- nageoires pectorales (battent en JS), dont la "nageoire porte-bonheur"
    var pectShape = finGeo([[0, 0], [0.16, 0.16], [0.32, 0.17], [0.42, 0.08],
                            [0.40, -0.06], [0.26, -0.15], [0.06, -0.11]], 0.020);
    (function cup(g) {                              // on bombe la nageoire
      var pp = g.attributes.position;
      for (var i = 0; i < pp.count; i++) {
        var x = pp.getX(i), y = pp.getY(i);
        pp.setZ(i, pp.getZ(i) + Math.sin(clamp(x / 0.42, 0, 1) * Math.PI) * 0.055 - y * 0.06);
      }
      g.computeVertexNormals();
    })(pectShape);
    finEdge(pectShape, 0.20, 0.40, 1.10, 0.34);
    var pectOpt = {
      color: 0xf9853a, rim: 0.45, spec: 0.15, sss: 0.9,
      opacity: 0.86, transparent: true, side: THREE.DoubleSide
    };
    var pl = toonMesh(pectShape, pectOpt);
    pl.position.set(0.255, 0.0, 0.30); pl.rotation.set(0, -0.5, 0.2);
    var pr = toonMesh(pectShape, pectOpt);
    pr.position.set(-0.255, 0.0, 0.30); pr.rotation.set(0, Math.PI + 0.5, -0.2);
    pr.scale.setScalar(0.72);                      // la petite nageoire
    g.add(pl); g.add(pr);

    // --- yeux façon dessin animé (grands, brillants)
    var eyes = new THREE.Group();
    for (var s = -1; s <= 1; s += 2) {
      var sclera = toonMesh(new THREE.SphereGeometry(0.152, 14, 10),
        { color: 0xfffaf4, rim: 0.20, spec: 0.35 });
      sclera.position.set(0.148 * s, 0.150, 0.495);
      var iris = toonMesh(new THREE.SphereGeometry(0.114, 12, 9),
        { color: 0x8ecfe6, rim: 0.15, spec: 0.4 });
      iris.position.set(0.188 * s, 0.150, 0.545);
      var pupil = toonMesh(new THREE.SphereGeometry(0.086, 12, 9),
        { color: 0x0a1520, rim: 0.05, spec: 1.4 });
      pupil.position.set(0.212 * s, 0.150, 0.575);
      var glint = new THREE.Mesh(new THREE.SphereGeometry(0.030, 8, 6),
        new THREE.MeshBasicMaterial({ color: 0xffffff }));
      glint.position.set(0.228 * s, 0.196, 0.610);
      var glint2 = new THREE.Mesh(new THREE.SphereGeometry(0.015, 6, 5),
        new THREE.MeshBasicMaterial({ color: 0xffffff }));
      glint2.position.set(0.222 * s, 0.108, 0.618);
      eyes.add(sclera); eyes.add(iris); eyes.add(pupil); eyes.add(glint); eyes.add(glint2);
    }
    g.add(eyes);

    g.userData.body = body;
    g.userData.pect = [pl, pr];
    g.userData.bend = body.userData.anim.uBend;
    g.userData.swaySpeed = body.userData.anim.uSwaySpeed;
    return g;
  }

  /** Poisson de banc : corps + queue fusionnés, œil peint par le shader. */
  function buildSmallFish(opt) {
    var parts = [{ geo: fishBodyGeo(opt.w || 0.30, opt.h || 0.55, { belly: 0.1, seg: 14, seg2: 10 }), matrix: null }];
    var tail = finGeo([[0, 0.09], [0.34, 0.34], [0.46, 0.30], [0.30, 0.04],
                       [0.46, -0.30], [0.34, -0.34], [0, -0.09]], 0.04);
    tail.rotateY(Math.PI / 2);
    parts.push({ geo: tail, matrix: TRS(0, 0, -0.95) });
    var dors = finGeo([[0, 0], [0.32, 0.34], [0.75, 0.03]], 0.035);
    dors.rotateY(Math.PI / 2);
    parts.push({ geo: dors, matrix: TRS(0, 0.46, 0.10) });

    var hook = [
      '  base = mix(base, uColorB, smoothstep(-0.1, 0.45, vObj.y));',
      opt.stripes ? '  base = mix(base, vec3(0.08,0.10,0.14), bandMask(vObj.z + vObj.y*0.2, 0.30, 0.10)*0.85 + bandMask(vObj.z + vObj.y*0.2, -0.25, 0.09)*0.85);' : '',
      '  float ey = discMask(vec2(vObj.z, vObj.y), vec2(0.60, 0.13), 0.105);',
      '  ey *= smoothstep(0.10, 0.20, abs(vObj.x));',
      '  base = mix(base, vec3(0.98), ey);',
      '  base = mix(base, vec3(0.05,0.06,0.09), discMask(vec2(vObj.z, vObj.y), vec2(0.635, 0.13), 0.058)*step(0.10, abs(vObj.x)));'
    ].join('\n');

    return toonMesh(mergeGeos(parts), {
      color: opt.color, colorB: opt.colorB !== undefined ? opt.colorB : opt.color,
      baseHook: hook, mode: 1, fishLen: 1.0,
      swayAmp: 0.11, swayFreq: 2.9, swaySpeed: opt.swaySpeed || 8.5,
      rim: 0.45, spec: 0.25, soft: 0.05, outline: 2.2
    });
  }

  /** Méduse translucide (le danger du récif). */
  function buildJellyfish() {
    var g = new THREE.Group();
    var bell = new THREE.SphereGeometry(1, 18, 12, 0, TAU, 0, Math.PI * 0.58);
    bell.scale(1, 0.82, 1);
    var bellMesh = toonMesh(bell, {
      color: 0xd6a8ff, colorB: 0xfff0ff,
      baseHook: '  base = mix(base, uColorB, smoothstep(0.2, 0.95, vObj.y));\n  base *= 0.9 + 0.35*bandMask(length(vObj.xz), 0.72, 0.16);',
      opacity: 0.55, transparent: true, depthWrite: false, side: THREE.DoubleSide,
      rim: 1.25, emissive: 0.30, soft: 0.10, outline: false
    });
    g.add(bellMesh);
    var rim = toonMesh(new THREE.TorusGeometry(0.995, 0.055, 6, 20), {
      color: 0xffd9ff, rim: 0.9, emissive: 0.5, soft: 0.2, outline: false
    });
    rim.rotation.x = Math.PI / 2;
    g.add(rim);
    var tent = [];
    for (var i = 0; i < 7; i++) {
      var a = i / 7 * TAU, len = 1.5 + (i % 3) * 0.5;
      var rib = new THREE.PlaneGeometry(0.12, len, 1, 5);
      tent.push({ geo: rib, matrix: TRS(Math.cos(a) * 0.62, len * 0.5, Math.sin(a) * 0.62, 0, a, 0) });
    }
    var tents = toonMesh(mergeGeos(tent), {
      color: 0xe9c2ff, opacity: 0.45, transparent: true, depthWrite: false,
      side: THREE.DoubleSide, rim: 0.9, emissive: 0.25, soft: 0.2, outline: false,
      mode: 2, swayAmp: 0.36, swayFreq: 1.7, swaySpeed: 1.6
    });
    tents.rotation.x = Math.PI;                     // les tentacules pendent
    g.add(tents);
    g.userData.bell = bellMesh;
    return g;
  }

  /** Tortue de mer, silhouette qui passe au loin. */
  function buildTurtle() {
    var g = new THREE.Group();
    var shell = new THREE.SphereGeometry(1, 18, 12);
    noisify(shell, 0.06, 3.5, 11);
    shell.scale(1.0, 0.46, 1.25);
    var sh = toonMesh(shell, {
      color: 0x5f7f4a, colorB: 0x8fae5c,
      baseHook: '  float cell = fbm(vec2(vObj.x, vObj.z)*3.4);\n  base = mix(base, uColorB, smoothstep(0.42, 0.62, cell));\n  base *= 0.86 + 0.3*smoothstep(0.15, 0.5, vObj.y);',
      rim: 0.4, spec: 0.35, soft: 0.05, outline: 3.0
    });
    g.add(sh);
    var belly = toonMesh(new THREE.SphereGeometry(0.92, 14, 8, 0, TAU, Math.PI * 0.55, Math.PI * 0.45),
      { color: 0xe8dda6, rim: 0.3, soft: 0.08, outline: false });
    belly.scale.set(1.0, 0.4, 1.22);
    g.add(belly);
    var head = toonMesh(new THREE.SphereGeometry(0.34, 12, 9), { color: 0x6f8f55, rim: 0.4, spec: 0.3, outline: 2.6 });
    head.position.set(0, 0.06, 1.30); head.scale.set(0.85, 0.85, 1.25);
    g.add(head);
    var flipShape = finGeo([[0, 0], [0.85, 0.34], [1.5, 0.22], [1.35, -0.14], [0.6, -0.28]], 0.09);
    var fl = [];
    for (var i = 0; i < 4; i++) {
      var side = i % 2 === 0 ? 1 : -1, front = i < 2 ? 1 : -1;
      var f = toonMesh(flipShape, { color: 0x6a8a52, rim: 0.4, soft: 0.06, outline: 2.6 });
      f.position.set(0.75 * side, -0.02, front > 0 ? 0.55 : -0.62);
      f.rotation.y = side > 0 ? 0 : Math.PI;
      f.rotation.z = side > 0 ? 0.1 : -0.1;
      if (front < 0) f.scale.setScalar(0.6);
      g.add(f); fl.push(f);
    }
    g.userData.flippers = fl;
    return g;
  }


  /* ================================================================== */
  /* LE BESTIAIRE                                                       */
  /* ================================================================== */

  /** Paire d'yeux façon dessin animé (sclère + pupille + éclat), en miroir sur X. */
  function addEyes(parent, x, y, z, r, opt) {
    opt = opt || {};
    for (var s = -1; s <= 1; s += 2) {
      var e = toonMesh(new THREE.SphereGeometry(r, 10, 8),
        { color: opt.white !== undefined ? opt.white : 0xfffaf4, rim: 0.2, spec: 0.4 });
      e.position.set(x * s, y, z);
      parent.add(e);
      if (opt.iris) {
        var ir = toonMesh(new THREE.SphereGeometry(r * 0.72, 9, 7), { color: opt.iris, rim: 0.15, spec: 0.4 });
        ir.position.set(x * s * 1.14, y, z + r * 0.36);
        parent.add(ir);
      }
      var p = toonMesh(new THREE.SphereGeometry(r * (opt.pupilR || 0.56), 9, 7),
        { color: opt.pupil !== undefined ? opt.pupil : 0x0a1520, rim: 0.05, spec: 1.3 });
      p.position.set(x * s * 1.26, y, z + r * 0.52);
      parent.add(p);
      var gl = new THREE.Mesh(new THREE.SphereGeometry(r * 0.20, 6, 5),
        new THREE.MeshBasicMaterial({ color: 0xffffff }));
      gl.position.set(x * s * 1.32, y + r * 0.34, z + r * 0.62);
      parent.add(gl);
    }
  }

  /** Nageoire triangulaire simple, orientée par une matrice. */
  function finPart(pts, thick, mtx, tint) {
    var g = finGeo(pts, thick);
    if (tint) finEdge(g, tint[0], tint[1], tint[2], tint[3]);
    return { geo: g, matrix: mtx };
  }

  /* ---------- LE REQUIN ---------- */
  var SHARK_HOOK = [
    '  base = mix(base, uColorB, smoothstep(-0.02, -0.30, vObj.y));',           // ventre blanc
    '  float side = step(0.13, abs(vObj.x));',
    '  float gill = bandMask(vObj.z, 0.34, 0.022) + bandMask(vObj.z, 0.42, 0.022) + bandMask(vObj.z, 0.50, 0.022);',
    '  base = mix(base, base*0.55, clamp(gill,0.0,1.0)*side*0.8);',
    '  float mouth = discMask(vec2(vObj.z, vObj.y), vec2(0.66, -0.20), 0.20);',
    '  base = mix(base, vec3(0.05,0.04,0.06), mouth*0.92);',
    '  base = mix(base, vec3(0.96,0.96,0.92), bandMask(vObj.y, -0.135, 0.022)*smoothstep(0.48,0.60,vObj.z)*0.9);'
  ].join('\n');

  function buildShark(len) {
    var g = new THREE.Group();
    var parts = [{ geo: fishBodyGeo(0.30, 0.34, { belly: 0.06, arch: 0.0, head: -0.1, seg: 22, seg2: 15 }) }];
    // dorsale haute
    var d1 = finGeo([[0, 0], [0.10, 0.34], [0.34, 0.40], [0.46, 0.02], [0.10, 0.0]], 0.045);
    d1.rotateY(Math.PI / 2);
    parts.push({ geo: d1, matrix: TRS(0, 0.22, 0.06) });
    var d2 = finGeo([[0, 0], [0.08, 0.12], [0.20, 0.01]], 0.03);
    d2.rotateY(Math.PI / 2);
    parts.push({ geo: d2, matrix: TRS(0, 0.17, -0.62) });
    // caudale en croissant
    var t1 = finGeo([[0, 0.04], [0.16, 0.30], [0.40, 0.62], [0.30, 0.16], [0.34, -0.02],
                     [0.30, -0.34], [0.14, -0.20], [0, -0.04]], 0.035);
    t1.rotateY(Math.PI / 2);
    parts.push({ geo: t1, matrix: TRS(0, 0, -0.96) });
    // pectorales larges
    var pc = finGeo([[0, 0], [0.40, -0.04], [0.70, -0.34], [0.44, -0.20], [0.08, -0.08]], 0.035);
    parts.push({ geo: pc, matrix: TRS(0.17, -0.08, 0.30, 0.30, 0, 0) });
    var pc2 = pc.clone(); pc2.scale(-1, 1, 1);
    parts.push({ geo: pc2, matrix: TRS(-0.17, -0.08, 0.30, 0.30, 0, 0) });
    // pelviennes
    var pv = finGeo([[0, 0], [0.14, -0.10], [0.20, -0.02]], 0.025);
    parts.push({ geo: pv, matrix: TRS(0.09, -0.16, -0.42, 0.5, 0, 0) });
    var pv2 = pv.clone(); pv2.scale(-1, 1, 1);
    parts.push({ geo: pv2, matrix: TRS(-0.09, -0.16, -0.42, 0.5, 0, 0) });

    var body = toonMesh(mergeGeos(parts), {
      color: 0x6f7f8c, colorB: 0xe8e6dd, baseHook: SHARK_HOOK,
      mode: 1, fishLen: 1.0, taper: 1.3, swayAmp: 0.10, swayFreq: 2.2, swaySpeed: 2.4,
      spec: 0.28, rim: 0.30, bump: 0.10, sss: 0.22
    });
    g.add(body);
    addEyes(g, 0.155, 0.075, 0.58, 0.055, { white: 0x2a3038, pupil: 0x05070a, pupilR: 0.7 });
    // dents
    for (var i = 0; i < 7; i++) {
      var tx = -0.12 + i * 0.04;
      var tooth = new THREE.Mesh(new THREE.ConeGeometry(0.014, 0.05, 4),
        new THREE.MeshBasicMaterial({ color: 0xfffaf0 }));
      tooth.position.set(tx, -0.115, 0.70 - Math.abs(tx) * 0.5);
      tooth.rotation.x = Math.PI;
      g.add(tooth);
    }
    g.scale.setScalar(len || 5.5);
    g.userData.body = body;
    return g;
  }

  function buildHammerhead(len) {
    var g = buildShark(len);
    // marteau : une barre aplatie en travers du museau
    var head = toonMesh(new THREE.SphereGeometry(0.5, 14, 9), { color: 0x7c8b96, spec: 0.25, rim: 0.3 });
    head.scale.set(0.62, 0.16, 0.20);
    head.position.set(0, 0.02, 0.66);
    g.add(head);
    addEyes(g, 0.30, 0.02, 0.66, 0.05, { white: 0x2a3038, pupil: 0x05070a, pupilR: 0.75 });
    return g;
  }

  /* ---------- LA RAIE ---------- */
  function buildRay(span) {
    var g = new THREE.Group();
    // aile : un disque aplati étiré, bords fins
    var w = new THREE.SphereGeometry(1, 26, 14);
    var p = w.attributes.position, v = new THREE.Vector3();
    for (var i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      var ax = Math.abs(v.x), taper = Math.pow(1 - ax * 0.94, 0.55);
      p.setXYZ(i, v.x * 1.95, v.y * 0.105 * taper, v.z * (0.66 - ax * 0.34) - ax * 0.60);
    }
    w.computeVertexNormals();
    ensureAttrs(w);
    var body = toonMesh(w, {
      color: 0x35566b, colorB: 0xf2f0e6,
      baseHook: [
        '  base = mix(base, uColorB, smoothstep(0.0, -0.04, vObj.y));',
        '  float sp = smoothstep(0.58, 0.665, fbm(vObj.xz*10.0));',
        '  base = mix(base, vec3(0.95,0.97,0.98), sp*step(0.0, vObj.y)*0.9);'
      ].join('\n'),
      mode: 3, fishLen: 1.95, swayAmp: 0.42, swayFreq: 1.6, swaySpeed: 1.4,
      spec: 0.22, rim: 0.35, bump: 0.08, sss: 0.55
    });
    g.add(body);
    // queue
    var tail = new THREE.CylinderGeometry(0.02, 0.07, 1.5, 6, 4, true);
    tail.translate(0, 0.75, 0);
    swayByHeight(tail, 0, 1.5, 1.3);
    var tm = toonMesh(tail, { color: 0x3f4d5e, mode: 2, swayAmp: 0.22, swaySpeed: 1.6, rim: 0.3 });
    tm.rotation.x = -Math.PI / 2 + 0.14;   // la queue traîne derrière
    tm.position.set(0, 0.02, -0.55);
    g.add(tm);
    // cornes céphaliques
    for (var s2 = -1; s2 <= 1; s2 += 2) {
      var horn = toonMesh(new THREE.ConeGeometry(0.055, 0.26, 6), { color: 0x465666, rim: 0.3 });
      horn.position.set(0.14 * s2, 0.0, 0.46);
      horn.rotation.x = 1.55;                // les cornes pointent devant
      g.add(horn);
    }
    addEyes(g, 0.19, 0.02, 0.30, 0.05, { white: 0xf2ede0, pupil: 0x0a1018 });
    g.scale.setScalar(span || 3.2);
    g.userData.body = body;
    return g;
  }

  /* ---------- POISSONS PERSONNAGES ---------- */
  /** Poisson au corps aplati (chirurgien, idole, papillon…). */
  function buildDiscFish(opt) {
    var g = new THREE.Group();
    var parts = [{ geo: fishBodyGeo(opt.w || 0.22, opt.h || 0.78, { belly: 0.05, head: opt.head || 0.15, seg: 20, seg2: 14 }) }];
    var tail = finGeo(opt.tail || [[0, 0.10], [0.28, 0.26], [0.40, 0.22], [0.26, 0.02],
                                   [0.40, -0.22], [0.28, -0.26], [0, -0.10]], 0.028);
    finEdge(tail, 0.26, 0.46, 1.05, opt.tailEdge !== undefined ? opt.tailEdge : 0.4);
    tail.rotateY(Math.PI / 2);
    parts.push({ geo: tail, matrix: TRS(0, 0, -0.94) });
    var dors = finGeo(opt.dorsal || [[0, 0], [0.28, 0.34], [0.72, 0.40], [1.10, 0.05], [0.5, 0.0]], 0.024);
    finEdge(dors, 0.2, 0.42, 1.05, 0.45);
    dors.rotateY(Math.PI / 2);
    parts.push({ geo: dors, matrix: TRS(0, 0.58, 0.20) });
    var anal = finGeo([[0, 0], [0.26, 0.22], [0.62, 0.02], [0.3, 0.0]], 0.022);
    finEdge(anal, 0.18, 0.36, 1.05, 0.45);
    anal.rotateY(Math.PI / 2); anal.rotateZ(Math.PI);
    parts.push({ geo: anal, matrix: TRS(0, -0.52, -0.10) });

    var body = toonMesh(mergeGeos(parts), {
      color: opt.color, colorB: opt.colorB !== undefined ? opt.colorB : opt.color,
      baseHook: opt.hook, mode: 1, fishLen: 1.0, taper: 1.7,
      swayAmp: 0.085, swayFreq: 2.7, swaySpeed: opt.speed || 6.5,
      spec: 0.3, rim: 0.4, sss: 0.2
    });
    g.add(body);
    // pectorales qui battent
    var pect = finGeo([[0, 0], [0.14, 0.13], [0.28, 0.12], [0.34, 0.0], [0.20, -0.11], [0.05, -0.09]], 0.016);
    finEdge(pect, 0.16, 0.34, 1.1, 0.35);
    var pl = toonMesh(pect, { color: opt.finColor !== undefined ? opt.finColor : opt.color, opacity: 0.85, transparent: true, side: THREE.DoubleSide, rim: 0.5, sss: 0.9 });
    pl.position.set(0.145, -0.02, 0.24); pl.rotation.set(0, -0.5, 0.15);
    var pr = toonMesh(pect, { color: opt.finColor !== undefined ? opt.finColor : opt.color, opacity: 0.85, transparent: true, side: THREE.DoubleSide, rim: 0.5, sss: 0.9 });
    pr.position.set(-0.145, -0.02, 0.24); pr.rotation.set(0, Math.PI + 0.5, -0.15);
    g.add(pl); g.add(pr);
    addEyes(g, opt.eyeX || 0.115, opt.eyeY || 0.16, opt.eyeZ || 0.52, opt.eyeR || 0.10,
            { iris: opt.iris, pupil: 0x0a1018 });
    g.userData.body = body;
    g.userData.pect = [pl, pr];
    g.scale.setScalar(opt.scale || 1);
    return g;
  }

  /** Chirurgien bleu (le compagnon bavard). */
  function buildBlueTang(scale) {
    return buildDiscFish({
      color: 0x2f6fd8, colorB: 0x7fc0ff, finColor: 0xffd23f, iris: 0x9fd8e8,
      w: 0.20, h: 0.80, scale: scale || 1.1, speed: 6.0,
      eyeX: 0.078, eyeY: 0.20, eyeZ: 0.50, eyeR: 0.088,
      hook: [
        '  base = mix(base, uColorB, smoothstep(-0.2, 0.6, vObj.y)*0.5);',
        // la "palette" : un ovale sombre en arrière du corps, bordé de bleu clair
        '  float pd = length(vec2((vObj.z + 0.30)*1.15, (vObj.y - 0.02)*1.7));',
        '  base = mix(base, vec3(0.05,0.07,0.13), (1.0 - smoothstep(0.30, 0.44, pd))*0.88);',
        '  base = mix(base, vec3(1.0,0.82,0.20), smoothstep(-0.70, -0.92, vObj.z));', // queue jaune
        '  base = mix(base, vec3(0.98,0.98,0.95), bandMask(vObj.z, -0.78, 0.045)*0.55);'
      ].join('\n')
    });
  }

  /** Idole des Maures (rayures noir / blanc / jaune). */
  function buildMoorishIdol(scale) {
    return buildDiscFish({
      color: 0xf7f3e4, colorB: 0xffffff, finColor: 0xffd23f, iris: 0xbfe0ee,
      w: 0.17, h: 0.88, scale: scale || 1.0, speed: 5.6, head: 0.25,
      eyeX: 0.072, eyeY: 0.20, eyeZ: 0.50, eyeR: 0.082,
      dorsal: [[0, 0], [0.24, 0.42], [0.55, 0.55], [0.9, 0.30], [1.15, 0.02], [0.5, 0.0]],
      hook: [
        '  float z = vObj.z + vObj.y*0.10;',
        '  float b1 = bandMask(z, 0.30, 0.17), b2 = bandMask(z, -0.42, 0.20);',
        '  base = mix(base, vec3(0.08,0.09,0.13), clamp(b1+b2, 0.0, 1.0)*0.92);',
        '  base = mix(base, vec3(1.0,0.80,0.18), smoothstep(-0.78, -0.98, z));',
        '  base = mix(base, vec3(1.0,0.78,0.16), smoothstep(0.30, 0.62, vObj.y)*0.55);'
      ].join('\n')
    });
  }

  /** Poisson-globe : se gonfle quand on approche. */
  function buildPufferfish(scale) {
    var g = new THREE.Group();
    var b = new THREE.SphereGeometry(0.62, 20, 15);
    var p = b.attributes.position, v = new THREE.Vector3();
    for (var i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      var t = (v.z / 0.62 + 1) * 0.5;
      p.setXYZ(i, v.x * (0.86 + t * 0.2), v.y * (0.9 + t * 0.18), v.z * 1.15);
    }
    b.computeVertexNormals();
    var body = toonMesh(b, {
      color: 0xe0a24a, colorB: 0xfff0cf,
      baseHook: [
        '  base = mix(base, uColorB, smoothstep(-0.1, -0.45, vObj.y));',
        '  base = mix(base, base*0.42, step(0.62, fbm(vObj.xz*7.0 + vObj.y*3.0))*0.8);'
      ].join('\n'),
      spec: 0.3, rim: 0.35, bump: 0.25
    });
    g.add(body);
    var spikes = new THREE.Group();
    for (var k = 0; k < 46; k++) {
      var a = rnd() * TAU, e = Math.acos(1 - 2 * rnd());
      var d = new THREE.Vector3(Math.sin(e) * Math.cos(a), Math.cos(e), Math.sin(e) * Math.sin(a));
      if (d.z > 0.6) continue;
      var sp = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.16, 4),
        new THREE.MeshBasicMaterial({ color: 0x8a5a2a }));
      sp.position.copy(d).multiplyScalar(0.6);
      sp.quaternion.setFromUnitVectors(YAXIS, d);
      spikes.add(sp);
    }
    g.add(spikes);
    var tailF = finGeo([[0, 0.06], [0.2, 0.16], [0.26, 0.0], [0.2, -0.16], [0, -0.06]], 0.02);
    tailF.rotateY(Math.PI / 2);
    var tm = toonMesh(tailF, { color: 0xe8b567, opacity: 0.9, transparent: true, side: THREE.DoubleSide, rim: 0.4, sss: 0.8 });
    tm.position.set(0, 0, -0.7);
    g.add(tm);
    addEyes(g, 0.24, 0.16, 0.50, 0.115, { iris: 0xffe08a, pupil: 0x0a1018 });
    g.userData.spikes = spikes;
    g.userData.body = body;
    g.scale.setScalar(scale || 1);
    return g;
  }

  /** Hippocampe. */
  function buildSeahorse(scale) {
    var g = new THREE.Group();
    var pts = [];
    for (var i = 0; i <= 6; i++) {
      var t = i / 6;
      pts.push(new THREE.Vector3(0, t * 1.5 - 0.2, Math.sin(t * 2.4) * 0.28 - 0.1));
    }
    var curve = new THREE.CatmullRomCurve3(pts);
    var bodyG = new THREE.TubeGeometry(curve, 16, 0.13, 8, false);
    var pb = bodyG.attributes.position, vb = new THREE.Vector3();
    for (var j = 0; j < pb.count; j++) {                 // effiler la queue
      vb.fromBufferAttribute(pb, j);
      var k = clamp((vb.y + 0.2) / 1.5, 0, 1);
      pb.setXYZ(j, vb.x * (0.5 + k * 0.9), vb.y, (vb.z - Math.sin(k * 2.4) * 0.28 + 0.1) * (0.5 + k * 0.9)
                 + Math.sin(k * 2.4) * 0.28 - 0.1);
    }
    bodyG.computeVertexNormals();
    var parts = [{ geo: bodyG }];
    var head = new THREE.SphereGeometry(0.17, 12, 9);
    head.scale(0.8, 0.9, 1.5);
    parts.push({ geo: head, matrix: TRS(0, 1.28, 0.14) });
    var snout = new THREE.CylinderGeometry(0.045, 0.075, 0.34, 7, 1, false);
    parts.push({ geo: snout, matrix: TRS(0, 1.26, 0.36, Math.PI / 2 - 0.25, 0, 0) });
    var crown = new THREE.ConeGeometry(0.07, 0.20, 6);
    parts.push({ geo: crown, matrix: TRS(0, 1.46, 0.02, -0.3, 0, 0) });
    var bg = mergeGeos(parts);
    swayByHeight(bg, 1.5, -0.2, 1.2);
    var body = toonMesh(bg, {
      color: 0xf2c14e, colorB: 0xfff0c0,
      baseHook: [
        '  base = mix(base, uColorB, smoothstep(0.0, 1.3, vObj.y)*0.4);',
        '  base *= 0.86 + 0.28*step(0.5, fract(vObj.y*7.0));',                  // anneaux
        '  base = mix(base, base*0.7, step(0.6, fbm(vObj.xz*9.0))*0.5);'
      ].join('\n'),
      mode: 2, swayAmp: 0.05, swayFreq: 1.2, swaySpeed: 1.6, spec: 0.3, rim: 0.4, bump: 0.3
    });
    g.add(body);
    var dfin = finGeo([[0, 0], [0.1, 0.22], [0.24, 0.30], [0.3, 0.02]], 0.014);
    dfin.rotateY(Math.PI / 2);
    var dm = toonMesh(dfin, { color: 0xffdc8a, opacity: 0.8, transparent: true, side: THREE.DoubleSide, rim: 0.5, sss: 1.0 });
    dm.position.set(0, 0.72, -0.16); dm.rotation.z = -0.2;
    g.add(dm);
    addEyes(g, 0.10, 1.32, 0.22, 0.058, { iris: 0x9fd8e8, pupil: 0x0a1018 });
    g.userData.body = body;
    g.userData.fin = dm;
    g.scale.setScalar(scale || 1);
    return g;
  }

  /** Pieuvre : manteau bombé et huit bras qui ondulent. */
  function buildOctopus(scale) {
    var g = new THREE.Group();
    var m = new THREE.SphereGeometry(0.5, 16, 12);
    m.scale(1, 1.25, 1.05);
    var mm = toonMesh(m, {
      color: 0xc4628f, colorB: 0xffd3e0,
      baseHook: [
        '  base = mix(base, uColorB, smoothstep(0.1, 0.6, vObj.y)*0.5);',
        '  base = mix(base, base*0.68, step(0.58, fbm(vObj.xz*6.0 + vObj.y*2.0))*0.7);'
      ].join('\n'),
      spec: 0.35, rim: 0.4, sss: 0.3, bump: 0.35
    });
    mm.position.y = 0.42;
    g.add(mm);
    var arms = [];
    for (var i = 0; i < 8; i++) {
      var a = (i / 8) * TAU;
      var pts = [];
      for (var k = 0; k <= 4; k++) {
        var t = k / 4;
        pts.push(new THREE.Vector3(Math.cos(a) * (0.30 + t * 1.15), 0.34 - t * 0.22 + Math.sin(t * 3.1) * 0.16,
                                   Math.sin(a) * (0.30 + t * 1.15)));
      }
      var cur = new THREE.CatmullRomCurve3(pts);
      var ag = new THREE.TubeGeometry(cur, 10, 0.085, 6, false);
      var pa = ag.attributes.position, va = new THREE.Vector3();
      ensureAttrs(ag);
      var sw = ag.attributes.aSway;
      for (var j = 0; j < pa.count; j++) {              // effiler + souplesse vers la pointe
        va.fromBufferAttribute(pa, j);
        var d = Math.sqrt(va.x * va.x + va.z * va.z);
        var kk = clamp((d - 0.30) / 1.15, 0, 1);
        sw.setX(j, Math.pow(kk, 1.4));
      }
      arms.push({ geo: ag });
    }
    var armMesh = toonMesh(mergeGeos(arms), {
      color: 0xb85684, colorB: 0xffd3e0,
      baseHook: '  base = mix(base, uColorB, smoothstep(0.3, -0.2, vObj.y)*0.35);',
      mode: 0, swayAmp: 0.30, swaySpeed: 1.5, spec: 0.3, rim: 0.4, sss: 0.4
    });
    g.add(armMesh);
    addEyes(g, 0.30, 0.62, 0.30, 0.12, { iris: 0xffe08a, pupil: 0x0a1018, pupilR: 0.4 });
    g.userData.body = mm;
    g.userData.arms = armMesh;
    g.scale.setScalar(scale || 1);
    return g;
  }

  /** Crabe : carapace, pattes et pinces. */
  function buildCrab(scale) {
    var g = new THREE.Group();
    var sh = new THREE.SphereGeometry(0.5, 16, 11);
    sh.scale(1.15, 0.5, 0.9);
    var body = toonMesh(sh, {
      color: 0xd8543f, colorB: 0xffb08a,
      baseHook: '  base = mix(base, uColorB, smoothstep(0.05, 0.3, vObj.y)*0.6);\n  base = mix(base, base*0.7, step(0.6, fbm(vObj.xz*5.0))*0.5);',
      spec: 0.4, rim: 0.35, bump: 0.3
    });
    body.position.y = 0.3;
    g.add(body);
    var legs = [];
    for (var s2 = -1; s2 <= 1; s2 += 2) {
      for (var i = 0; i < 4; i++) {
        var zz = -0.28 + i * 0.19;
        var l1 = new THREE.CylinderGeometry(0.028, 0.04, 0.36, 5, 1, true);
        legs.push({ geo: l1, matrix: TRS(s2 * 0.52, 0.24, zz, 0, 0, s2 * 1.0) });
        var l2 = new THREE.CylinderGeometry(0.022, 0.032, 0.34, 5, 1, true);
        legs.push({ geo: l2, matrix: TRS(s2 * 0.76, 0.10, zz, 0, 0, s2 * 2.3) });
      }
      // pince
      var cl = new THREE.SphereGeometry(0.14, 9, 7);
      cl.scale(1.3, 0.7, 0.8);
      legs.push({ geo: cl, matrix: TRS(s2 * 0.72, 0.26, 0.44, 0, s2 * 0.5, 0) });
      var arm = new THREE.CylinderGeometry(0.035, 0.05, 0.4, 5, 1, true);
      legs.push({ geo: arm, matrix: TRS(s2 * 0.46, 0.28, 0.3, 1.2, s2 * 0.6, 0) });
    }
    var legMesh = toonMesh(mergeGeos(legs), { color: 0xc44a38, spec: 0.35, rim: 0.3 });
    g.add(legMesh);
    // yeux sur pédoncules
    for (var s3 = -1; s3 <= 1; s3 += 2) {
      var st = toonMesh(new THREE.CylinderGeometry(0.022, 0.026, 0.2, 5), { color: 0xd8543f, rim: 0.3 });
      st.position.set(s3 * 0.14, 0.52, 0.24);
      g.add(st);
    }
    addEyes(g, 0.14, 0.63, 0.25, 0.055, { pupil: 0x0a1018, pupilR: 0.65 });
    g.userData.body = body;
    g.scale.setScalar(scale || 1);
    return g;
  }

  /** Crevette nettoyeuse. */
  function buildShrimp(scale) {
    var g = new THREE.Group();
    var parts = [];
    for (var i = 0; i < 6; i++) {
      var t = i / 5;
      var r = 0.14 * (1 - t * 0.55);
      var seg = new THREE.SphereGeometry(r, 9, 7);
      parts.push({ geo: seg, matrix: TRS(0, 0.02 + Math.sin(t * 1.6) * 0.12, 0.30 - t * 0.62, 0, 0, 0, 1, 0.9, 1.1) });
    }
    var bodyG = mergeGeos(parts);
    var body = toonMesh(bodyG, {
      color: 0xf2f0ea, colorB: 0xe0483f,
      baseHook: [
        '  float band = step(0.5, fract(vObj.z*4.5));',
        '  base = mix(base, uColorB, band*0.85);',
        '  base = mix(base, vec3(1.0), 0.15);'
      ].join('\n'),
      opacity: 0.92, transparent: true, spec: 0.5, rim: 0.6, sss: 0.7
    });
    g.add(body);
    var tailF = finGeo([[0, 0.03], [0.14, 0.13], [0.18, 0.0], [0.14, -0.13], [0, -0.03]], 0.012);
    tailF.rotateY(Math.PI / 2);
    var tm = toonMesh(tailF, { color: 0xffd9d0, opacity: 0.8, transparent: true, side: THREE.DoubleSide, rim: 0.5 });
    tm.position.set(0, 0.02, -0.38);
    g.add(tm);
    for (var s2 = -1; s2 <= 1; s2 += 2) {                // antennes
      var ant = new THREE.CylinderGeometry(0.006, 0.009, 0.9, 4, 3, true);
      ant.translate(0, 0.45, 0);
      swayByHeight(ant, 0, 0.9, 1.3);
      var am = toonMesh(ant, { color: 0xffffff, opacity: 0.55, transparent: true, mode: 2, swayAmp: 0.12, swaySpeed: 2.2, rim: 0.6 });
      am.position.set(s2 * 0.05, 0.10, 0.34);
      am.rotation.set(1.15, 0, s2 * 0.25);
      g.add(am);
    }
    addEyes(g, 0.075, 0.14, 0.34, 0.04, { pupil: 0x101820, pupilR: 0.8 });
    g.userData.body = body;
    g.scale.setScalar(scale || 1);
    return g;
  }

  /** Murène : longue anguille tapie dans son trou. */
  function buildMoray(scale) {
    var g = new THREE.Group();
    var pts = [];
    for (var i = 0; i <= 5; i++) {
      var t = i / 5;
      pts.push(new THREE.Vector3(Math.sin(t * 3.0) * 0.5, t * 0.5, -t * 3.4));
    }
    var cur = new THREE.CatmullRomCurve3(pts);
    var bg = new THREE.TubeGeometry(cur, 22, 0.26, 9, false);
    var pb = bg.attributes.position, vb = new THREE.Vector3();
    for (var j = 0; j < pb.count; j++) {
      vb.fromBufferAttribute(pb, j);
      var k = clamp(-vb.z / 3.4, 0, 1);
      pb.setXYZ(j, vb.x * (1 - k * 0.5), vb.y * (1.15 - k * 0.6), vb.z);
    }
    bg.computeVertexNormals();
    var body = toonMesh(bg, {
      color: 0x7a8f5c, colorB: 0xe8e2b0,
      baseHook: [
        '  base = mix(base, uColorB, smoothstep(0.0, -0.2, vObj.y)*0.5);',
        '  base = mix(base, base*0.55, step(0.55, fbm(vObj.xz*4.5 + vObj.y*2.0))*0.75);'
      ].join('\n'),
      mode: 1, fishLen: 0.2, taper: 0.5, swayAmp: 0.16, swayFreq: 3.4, swaySpeed: 1.4,
      spec: 0.35, rim: 0.35, bump: 0.2
    });
    g.add(body);
    // mâchoire
    var jaw = toonMesh(new THREE.SphereGeometry(0.24, 12, 8, 0, TAU, 0, Math.PI * 0.55),
      { color: 0x6f8452, rim: 0.3 });
    jaw.scale.set(1, 0.5, 1.5);
    jaw.rotation.x = Math.PI;
    jaw.position.set(0, -0.04, 0.18);
    g.add(jaw);
    for (var k2 = 0; k2 < 6; k2++) {
      var tooth = new THREE.Mesh(new THREE.ConeGeometry(0.018, 0.07, 4),
        new THREE.MeshBasicMaterial({ color: 0xfff8e8 }));
      tooth.position.set(-0.1 + k2 * 0.04, -0.02, 0.30);
      tooth.rotation.x = Math.PI;
      g.add(tooth);
    }
    addEyes(g, 0.12, 0.10, 0.24, 0.052, { white: 0xffe8a0, pupil: 0x120a06, pupilR: 0.75 });
    g.userData.body = body;
    g.userData.jaw = jaw;
    g.scale.setScalar(scale || 1);
    return g;
  }

  /** Anguilles de jardin : elles rentrent dans le sable quand on approche. */
  function buildGardenEels(count, radius) {
    var g = new THREE.Group();
    var eels = [];
    for (var i = 0; i < count; i++) {
      var a = rnd() * TAU, d = Math.sqrt(rnd()) * radius;
      var h = rr(1.1, 2.2);
      var tube = new THREE.CylinderGeometry(0.035, 0.055, h, 6, 4, true);
      tube.translate(0, h * 0.5, 0);
      swayByHeight(tube, 0, h, 1.3);
      var m = toonMesh(tube, {
        color: 0xd8cfae, colorB: 0x8a7f5f,
        baseHook: '  base = mix(base, uColorB, step(0.5, fract(vObj.y*3.0))*0.5);',
        mode: 2, swayAmp: 0.10, swayFreq: 1.6, swaySpeed: 1.8, rim: 0.35, spec: 0.2
      });
      var x = Math.cos(a) * d, z = Math.sin(a) * d;
